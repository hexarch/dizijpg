# dizi.jpg — nginx SEO parcasi (14 Agu 2026)  [HENUZ UYGULANMADI]
# ===========================================================================
# Hedef dosya: /etc/nginx/sites-available/dizijpg.com  (443 server blogu)
# DIKKAT: /etc/nginx/sites-available/dizijpg AYRI ve TERK EDILMIS eski sitedir,
#         sites-enabled'da yoktur; ELLEME.
#
# Bu dosya calisan bir conf DEGIL, elle uygulanacak DEGISIKLIGIN listesidir.
# Onkosul: 6 Agu parcasindaki (backend/nginx-seo-20260806.parca.conf) `@og`
# adlandirilmis location'i ve `$og_bot` map'i CANLIDA MEVCUT olmali — bu parca
# ikisini de aynen kullanir, yenisini tanimlamaz.
#
# ---------------------------------------------------------------------------
# NE COZUYOR: SOFT 404  (SEO-PLANI 3.4)
# ---------------------------------------------------------------------------
# OLCUM (14 Agu 2026, canli):
#   curl -s -o /dev/null -w '%{http_code}' -A Googlebot \
#        https://dizijpg.com/boyle-bir-sayfa-yok
#     -> 200   (+ bos Flutter kabugu, `noindex` bile yok)
# Google bunu "Soft 404" olarak raporlar: tarama butcesi olmayan sayfalarda
# yanar ve site geneli kalite algisi duser.
#
# SEBEP: bot regex'i yalnizca `^/(icerik|gonderi|kisi|dizi|listeler)/` ve
# `^/(gozat|kesfet)$` yollarini Node'a tasiyor. GERI KALAN her yol `location /`
# icindeki `try_files $uri /index.html` ile 200 + kabuk aliyor — bot da dahil.
#
# COZUM: SPA geri donusune dusen BOT istekleri Node'a tasinir. Node'daki
# BILINEN ROTA TABLOSU (server.js `BOT_ROTALARI`) karari verir:
#   · tabloda VAR ama SSR'i yok -> 200 + noindex,follow minimal sayfa
#   · tabloda YOK               -> GERCEK 404 + noindex
#
# INSAN TRAFIGI HIC DEGISMEZ: kapi `if ($og_bot)` ile korunuyor. Gercek
# ziyaretci derin baglantida (`/kullanici/alcelik`, `/ayarlar`, F5, geri tusu)
# Flutter kabugunu almaya DEVAM eder. Geri alma tek satir: `if` blogunu sil.
# ===========================================================================


# ---------------------------------------------------------------------------
# 1) SPA geri donusu: statik dosya -> yoksa @spa               (ASIL DEGISIKLIK)
# ---------------------------------------------------------------------------
# NEREYE: canli conf'taki mevcut
#           location / { try_files $uri /index.html; }
#         blogunun YERINE bu IKI blok.
#
# NEDEN `try_files $uri @spa` VE ARA BIR NAMED LOCATION:
# Bot kapisini dogrudan `location /` icine koymak YANLIS olurdu — o zaman
# GERCEKTEN VAR OLAN dosyalar da (`/main.<hash>.dart.js`, `/favicon.ico`,
# `/icons/Icon-192.png`, `/manifest.json`) bot icin `/og/...`e proxy'lenir ve
# Googlebot 404 alirdi (JS'i alamayan bot ayrica sayfayi hic render edemez).
# `try_files $uri @spa;` sirasi soyle isler:
#   1. istenen dosya DISKTE varsa -> aynen servis edilir (bot da insan da),
#   2. yoksa -> @spa (yani "bu bir SPA yolu") -> orada bot ayrimi yapilir.
#
# NOT: bu blok, mevcut `location ~ ^/(icerik|gonderi|kisi|dizi|listeler)/` ve
# `location ~ ^/(gozat|kesfet)$` bloklarini GEREKSIZ kilar (ayni isi yapiyorlar)
# ama ONLARI SILMEK ZORUNDA DEGILSIN: nginx'te regex location'lar `location /`
# on ekinden ONCE degerlendirilir, yani davranis birebir aynidir. Onerilen:
# once bu parcayi ekle, dogrula, eskileri AYRI bir adimda temizle.
location / {
    try_files $uri @spa;
}

# SPA geri donusu. Yalniz DISKTE OLMAYAN yollar buraya duser.
location @spa {
    error_page 418 = @og;
    if ($og_bot) { return 418; }
    try_files /index.html =404;
}


# ---------------------------------------------------------------------------
# 2) @og: Node'un 404'u BOTA GECMELI                        (KRITIK KONTROL)
# ---------------------------------------------------------------------------
# NEREYE: mevcut `location @og` blogunu KONTROL ET. Icinde
#           proxy_intercept_errors on;
#         VARSA KALDIR (ya da `off` yap).
#
# NEDEN: `proxy_intercept_errors on` iken nginx, Node'un dondurdugu 404'u kendi
# `error_page 404` yonergesiyle DEGISTIRIR. O zaman bu maddenin tamami etkisiz
# kalir: Node dogru 404'u uretir, nginx onu 200'e ya da baska bir govdeye cevirir.
# Varsayilan `off`; bu yuzden buyuk olasilikla degisiklik GEREKMEZ, ama
# dogrulanmadan "tamam" denmemeli (asagidaki DOGRULAMA adimi tam bunu olcer).
#
# Beklenen blok (referans; canlidaki hali buysa DOKUNMA):
#   location @og {
#       proxy_pass http://127.0.0.1:8500/og$uri;
#       proxy_set_header Host $host;
#       proxy_read_timeout 30s;
#   }


# ---------------------------------------------------------------------------
# 3) sitemap-bolum-N.xml                                    (KONTROL, degisiklik yok)
# ---------------------------------------------------------------------------
# Yeni alt harita `sitemap-bolum-1.xml` adiyla yayinlaniyor ve canlidaki
#   location ~ ^/sitemap-.*\.xml$ { proxy_pass http://127.0.0.1:8500$request_uri; }
# kurali bu adi ZATEN kapsiyor (olcum: `sitemap-icerik-1.xml` calisiyor).
# Yani nginx tarafinda EK IS YOK. Kural farkli yazilmissa (or. yalniz
# `sitemap-icerik-` on ekini kapsiyorsa) yukaridaki genel hale getirilmeli.
#
# robots.txt'e YENI `Sitemap:` SATIRI EKLENMEDI: alt haritalar `sitemap.xml`
# DIZININDEN kesfedilir (sitemapindex), tek tek bildirmek gereksiz yineleme olur.


# ===========================================================================
# UYGULAMA ADIMLARI  (ana oturumda, kullanici onayiyla)
# ===========================================================================
#  1. ssh karanew 'cp /etc/nginx/sites-available/dizijpg.com \
#                     /etc/nginx/sites-available/dizijpg.com.yedek-20260814'
#  2. (1) numarali bloklari uygula: mevcut `location / { try_files $uri
#     /index.html; }` blogunu yukaridaki IKI blokla degistir.
#  3. (2) numarali kontrol: `grep -n proxy_intercept_errors \
#         /etc/nginx/sites-available/dizijpg.com`  -> cikti bos olmali.
#  4. ssh karanew 'nginx -t'          -> "syntax is ok" + "test is successful"
#  5. ssh karanew 'systemctl reload nginx'
#  6. Backend dagitimi (server.js degisti; migrasyon YOK):
#     scp backend/server.js karanew:/opt/dizijpg/
#     ssh karanew 'cd /opt/dizijpg && docker compose up -d --build api'
#
# DOGRULAMA (dagitimdan sonra; sirayla)
# ---------------------------------------------------------------------------
# A) SOFT 404 KAPANDI MI
#   curl -s -o /dev/null -w '%{http_code}\n' -A Googlebot \
#        https://dizijpg.com/boyle-bir-sayfa-yok
#     -> 404
#   curl -s -A Googlebot https://dizijpg.com/boyle-bir-sayfa-yok | grep -i robots
#     -> <meta name="robots" content="noindex,follow">
#   curl -s -o /dev/null -w '%{http_code}\n' -A Googlebot https://dizijpg.com/ayarlar
#     -> 200   (bilinen rota, SSR'i yok -> noindex,follow)
#
# B) INSAN TRAFIGI BOZULMADI MI  (EN ONEMLI KONTROL)
#   curl -s -o /dev/null -w '%{http_code}\n' https://dizijpg.com/boyle-bir-sayfa-yok
#     -> 200   (Flutter kabugu; SPA kendi "Baglanti gecersiz" ekranini cizer)
#   curl -s https://dizijpg.com/kullanici/alcelik | grep -c flutter_bootstrap
#     -> 1'den buyuk   (kabuk geliyor, SSR degil)
#   curl -s -o /dev/null -w '%{http_code}\n' -A Googlebot \
#        https://dizijpg.com/flutter_bootstrap.js
#     -> 200   (STATIK dosya bota da gidiyor; 404 goruyorsan (1) yanlis uygulandi)
#   curl -sI -A Googlebot https://dizijpg.com/main.*.dart.js  # gercek hash ile
#     -> 200 + cache-control: public, max-age=31536000
#
# C) SSR REGRESYONU YOK MU
#   curl -s -A Googlebot https://dizijpg.com/icerik/tv/1396 | grep -c '<article>'
#     -> 0'dan buyuk
#   curl -s -A Googlebot https://dizijpg.com/ | grep -c '<a href="/icerik/'
#     -> 0'dan buyuk
#   curl -s -A Googlebot https://dizijpg.com/gozat | grep -c '<a href="/icerik/'
#     -> 24'ten buyuk
#
# GERI ALMA
# ---------------------------------------------------------------------------
#   ssh karanew 'cp /etc/nginx/sites-available/dizijpg.com.yedek-20260814 \
#                   /etc/nginx/sites-available/dizijpg.com && nginx -t && \
#                   systemctl reload nginx'
# Daha yumusak geri alma (Node'u geri almadan): @spa blogundaki
