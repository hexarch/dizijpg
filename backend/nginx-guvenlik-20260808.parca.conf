# dizi.jpg — nginx GUVENLIK parcasi: CSP + ozel medya onbellegi  (8 Agu 2026)
#                                                          [HENUZ UYGULANMADI]
# ===========================================================================
# Hedef dosya: /etc/nginx/sites-available/dizijpg.com  (443 `dizijpg.com` blogu)
# DIKKAT: /etc/nginx/sites-available/dizijpg AYRI ve TERK EDILMIS eski sitedir;
#         sites-enabled'da yoktur, ELLEME.
#
# KAYNAK: GUVENLIK-DENETIMI-2026-08-07.md
#   §4.3 [SARI] "Canli sitede Content-Security-Policy basligi hala YOK.
#                Gelecekte bir XSS cikarsa calinan token 90 gune kadar gecerli."
#   §2.1 [SARI] "Cloudflare medyayi PUBLIC onbellege aliyor (cf-cache-status: HIT)."
#
# Bu dosya calisan bir conf DEGIL; elle kopyalanacak bloklarin listesidir.
# Her blogun basinda "NEREYE" satiri var; uygulama + geri alma en altta.
#
# ---------------------------------------------------------------------------
# ONCE REPORT-ONLY. BU BIR TAVSIYE DEGIL, ADIMDIR.
# ---------------------------------------------------------------------------
# CSP'yi dogrudan zorunlu koymak siteyi BEYAZ EKRANA dusurebilir: Flutter web
# CanvasKit'i WebAssembly ile derler, GIS (Google ile giris) kendi script ve
# iframe'ini enjekte eder. Hangi direktifin gerektigini TAHMIN ETMIYORUZ,
# OLCUYORUZ. Once `Content-Security-Policy-Report-Only` konur (tarayici hicbir
# seyi engellemez, yalnizca ihlalleri bildirir), en az 48 saat / bir dagitim
# dongusu beklenir, `GET /api/admin/csp` bos kalirsa ayni deger
# `Content-Security-Policy` adiyla zorunlu yapilir.
#
# Ihlal toplayici canliya bu turda giden server.js ile birlikte gelir:
#   POST /api/csp-rapor   (tarayici otomatik gonderir; kimlik gerektirmez)
#   GET  /api/admin/csp   (ozet; admin IP kisitli)
#
# ---------------------------------------------------------------------------
# NEDEN HER BLOKTA TEKRARLANIYOR
# ---------------------------------------------------------------------------
# nginx'te `add_header` MIRAS ALINMAZ: bir location kendi add_header'ini
# yazdigi anda ust bloktaki TUM add_header'lar o yanit icin IPTAL olur.
# Bu yuzden CSP satiri, add_header ICEREN HER location'a ayri ayri eklenmeli.
# Eklenmezse o yol (ornegin /kullanici/ ya da "/") CSP'siz kalir ve korumada
# sessiz bir delik olusur.
#
# add_header ICEREN bloklar (canli conf, 8 Agu 2026 okumasi):
#   satir 104/126-129  server duzeyi
#   satir 136          index.html | flutter_bootstrap.js | ... (Flutter giris)
#   satir 152          main.<hash>.dart.js
#   satir 166          /canvaskit/
#   satir 179          /assets/
#   satir 216          /kullanici/
#   satir 250          location = /
# add_header ICERMEYEN bloklar (server duzeyini DEVRALIR, dokunma):
#   /api/, /api/admin, @og, @og_ana, /robots.txt, /sitemap*, location /,
#   /(icerik|gonderi|kisi|dizi|listeler)/, /(gozat|kesfet)$
# ===========================================================================


# ---------------------------------------------------------------------------
# 1) CSP DEGERI — tek kaynak
# ---------------------------------------------------------------------------
# Asagidaki tek satir, 2..8 arasindaki her yere AYNEN kopyalanacak.
# (nginx'te add_header degeri icin degisken tanimlamak `map` gerektirir ve
#  `always` ile birlesince okunaksizlasiyor; tekrar daha az hataliydi.)
#
# DIREKTIFLERIN GEREKCESI — her biri OLCULEN bir ihtiyaca karsilik gelir:
#   default-src 'self'         : temel; her sey ayni kokenden.
#   script-src ... 'wasm-unsafe-eval'
#                              : CanvasKit WebAssembly derliyor. BU OLMAZSA
#                                UYGULAMA HIC ACILMAZ. 'unsafe-eval' DEGIL:
#                                wasm-unsafe-eval yalnizca WASM'a izin verir,
#                                JavaScript eval()'i acmaz.
#   script-src https://accounts.google.com
#                              : web/index.html:56 `<script src=
#                                "https://accounts.google.com/gsi/client">`
#                                (Google ile giris). Kaldirilirsa giris kirilir.
#   style-src 'unsafe-inline'  : Flutter web calisma aninda <style> enjekte
#                                eder; hash/nonce verilemez (uretilen kod).
#                                Bilinen odun: stil enjeksiyonu engellenmez.
#   img-src https://image.tmdb.org
#                              : tum poster/afis gorselleri (app/lib/api.dart
#                                posterUrl). Kendi medyamiz 'self'.
#   img-src https://*.googleusercontent.com
#                              : Google hesabiyla girenlerin profil fotografi.
#   img-src data: blob:        : Flutter tuvali ve yukleme onizlemesi.
#   media-src 'self' blob: data:
#                              : DM sesli mesaj + video oynatici.
#   connect-src 'self' ...     : API ayni koken. GIS token ucu accounts.google.com.
#   worker-src 'self' blob:    : Flutter web worker'lari blob URL'den dogar.
#   frame-src https://accounts.google.com
#                              : GIS giris penceresi iframe.
#   object-src 'none'          : <object>/<embed> hic gerekmiyor; klasik XSS yolu.
#   base-uri 'self'            : <base> enjeksiyonuyla tum goreli URL'lerin
#                                saldirgan sunucusuna cevrilmesini engeller.
#   form-action 'self'         : calinan veriyi <form> ile disari POST etmeyi keser.
#   frame-ancestors 'self'     : X-Frame-Options SAMEORIGIN'in modern karsiligi.
#   report-uri /api/csp-rapor  : ihlaller toplayiciya gitsin (olcum icin SART).
#                                Eski ama HER yerde calisan yontem; report-to
#                                Safari'de hala guvenilmez.
#
# TEK SATIR (kopyalanacak):
#
# add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com; worker-src 'self' blob:; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
#
# ZORUNLU HALE GETIRIRKEN: yalnizca baslik ADI degisir
#   Content-Security-Policy-Report-Only  ->  Content-Security-Policy
# (deger AYNEN kalir; report-uri zorunlu modda da calisir ve ihlalleri
#  bildirmeye devam eder — gerileme fark etmek icin birak.)


# ---------------------------------------------------------------------------
# 2) NEREYE: server duzeyi — mevcut `Permissions-Policy` satirindan HEMEN SONRA
#            (canli conf satir 129)
# ---------------------------------------------------------------------------
# Bu tek ekleme, add_header ICERMEYEN tum location'lari kapsar:
# location /, /api/, /icerik/..., @og, sitemap, robots.txt.
#
    add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
    # >>> EKLE (CSP olcum modu; 48 saat sonra Report-Only ekini kaldir) <<<
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com; worker-src 'self' blob:; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;


# ---------------------------------------------------------------------------
# 3..8) NEREYE: add_header ICEREN her location'in SONUNA ayni satir
# ---------------------------------------------------------------------------
# Asagidaki alti blogun her birinde, mevcut `Referrer-Policy` satirindan
# HEMEN SONRA ayni CSP satirini ekle. Blok govdelerinin geri kalanina
# DOKUNMA (try_files / rewrite satirlari aynen kalsin).
#
#   3) location ~* ^/(index\.html|flutter_bootstrap\.js|...)$   (satir 136)
#   4) location ~* "^/main\.[0-9a-f]{12}\.dart\.js$"            (satir 152)
#   5) location ^~ /canvaskit/                                  (satir 166)
#   6) location ^~ /assets/                                     (satir 179)
#   7) location ^~ /kullanici/                                  (satir 216)
#   8) location = /                                             (satir 250)
#
# ORNEK (3 numarali blok, eklemeden SONRAKI hali):
#
#     location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|version\.json|manifest\.json)$ {
#         add_header Cache-Control "no-store, must-revalidate" always;
#         # add_header burada ust bloktakileri iptal ettigi icin tekrarlanir
#         add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
#         add_header X-Content-Type-Options "nosniff" always;
#         add_header X-Frame-Options "SAMEORIGIN" always;
#         add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#         add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com; worker-src 'self' blob:; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
#         try_files $uri =404;
#     }
#
# NOT (4,5,6): main.<hash>.dart.js, /canvaskit/ ve /assets/ HTML DEGIL; CSP
# onlarin yanitinda davranis degistirmez. Yine de ekleniyor, cunki eksik
# birakmak "hangi blokta var, hangisinde yok" karmasasini dogurur ve ileride
# bu bloklardan biri HTML servis etmeye baslarsa delik sessizce acilir.


# ---------------------------------------------------------------------------
# 9) OZEL (DM) MEDYA — Cloudflare edge'de PUBLIC kopya birikmesin
# ---------------------------------------------------------------------------
# NEREYE: hicbir yere. BU MADDE ICIN NGINX DEGISIKLIGI GEREKMIYOR.
#
# Cozum uygulama katmaninda: server.js artik ozel medyayi
# `Cache-Control: private, no-store, max-age=0` ile donduruyor
# (bkz. OZEL_MEDYA + express.static setHeaders). Cloudflare `private`
# gorunce yaniti edge'de TUTMAZ; denetimdeki `cf-cache-status: HIT`
# durumu bu sayede olusmaz. Halka acik yorum/akis medyasi eskisi gibi
# `public, max-age=31536000, immutable` kalir ve onbelleklenmeye devam eder.
#
# ISTEGE BAGLI IKINCI KATMAN (Cloudflare paneli, nginx degil):
#   Rules > Cache Rules > "dizijpg ozel medya"
#     When: (http.request.uri.path matches "^/api/medya/i/")
#     Then: Cache eligibility = Bypass cache
# Imzali yollar `/api/medya/i/...` on ekiyle geldigi icin bu tek kural
# imzali (yani ozel) medyayi ayirir; imzasiz genel medya etkilenmez.
# Origin zaten dogru basligi gonderdigi icin bu kural YEDEKTIR.


# ===========================================================================
# UYGULAMA ADIMLARI
# ===========================================================================
# 0) Once server.js dagitilmis olmali (CSP toplayici ucu /api/csp-rapor
#    calismali), yoksa her ihlal raporu 404 uretir:
#      curl -s -o /dev/null -w '%{http_code}\n' -X POST \
#        -H 'Content-Type: application/csp-report' \
#        --data '{"csp-report":{"document-uri":"https://dizijpg.com/","violated-directive":"img-src"}}' \
#        https://dizijpg.com/api/csp-rapor
#      -> 204 beklenir
#
# 1) YEDEK AL (geri alma bunun uzerinden yapilir):
#      cp -a /etc/nginx/sites-available/dizijpg.com \
#            /etc/nginx/sites-available/dizijpg.com.yedek-20260808
#      sha1sum /etc/nginx/sites-available/dizijpg.com*
#
# 2) Yukaridaki 2..8 eklemelerini yap (7 satir CSP; 1 server + 6 location).
#
# 3) SOZDIZIMI:
#      nginx -t
#    Hata verirse HIC RELOAD ETME, yedekten don.
#
# 4) Eklemenin 7 yere de girdigini SAY (7 beklenir):
#      grep -c "Content-Security-Policy-Report-Only" \
#        /etc/nginx/sites-available/dizijpg.com
#
# 5) RELOAD (restart degil — reload kesintisizdir):
#      systemctl reload nginx
#
# 6) DOGRULAMA — CSP'nin gercekten her yolda dondugunu OLC.
#    add_header mirasi yuzunden asil risk "bir yolda hic gorunmemesi".
#      for y in / /index.html /kullanici/testkullanici /gozat \
#               /flutter_bootstrap.js /assets/AssetManifest.bin.json \
#               /api/saglik; do
#        printf '%-42s %s\n' "$y" \
#          "$(curl -sI "https://dizijpg.com$y" \
#             | grep -ci 'content-security-policy-report-only')"
#      done
#    Her satirda 1 beklenir. 0 goren yol varsa o location'a CSP eklenmemistir.
#
# 7) OLCUM (en az 48 saat, bir dagitim dongusu dahil):
#      curl -s https://dizijpg.com/api/admin/csp | head -40
#    Beklenen: `toplam: 0`. Ihlal varsa direktifi genislet ya da kaynagi duzelt;
#    ihlal listesi bosalmadan 8. adima GECME.
#
# 8) ZORUNLU KILMA (olcum temizse):
#      sed -i 's/Content-Security-Policy-Report-Only/Content-Security-Policy/g' \
#        /etc/nginx/sites-available/dizijpg.com
#      nginx -t && systemctl reload nginx
#    Ardindan gercek tarayicida ac: giris (Google dahil), akis, DM, video,
#    sesli mesaj. Tarayici konsolunda "Refused to ..." satiri OLMAMALI.
#
# ===========================================================================
# GERI ALMA (her adimda gecerli)
# ===========================================================================
#   cp -a /etc/nginx/sites-available/dizijpg.com.yedek-20260808 \
#         /etc/nginx/sites-available/dizijpg.com
#   nginx -t && systemctl reload nginx
#   sha1sum /etc/nginx/sites-available/dizijpg.com   # yedekle ayni olmali
#
# Acil ve daha hizli yol (conf'a dokunmadan): CSP satirlarini tek komutla sil
#   sed -i '/Content-Security-Policy/d' /etc/nginx/sites-available/dizijpg.com
#   nginx -t && systemctl reload nginx
