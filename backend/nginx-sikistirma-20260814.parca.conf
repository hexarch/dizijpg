# dizi.jpg — nginx sıkıştırma parçası (14 Ağustos 2026)
#
# SUNUCUDAKİ YERİ: /etc/nginx/dizijpg/sikistirma.conf
# BAĞLANMA BİÇİMİ: /etc/nginx/sites-available/dizijpg.com içindeki 443 numaralı
#   `server { server_name dizijpg.com; ... }` bloğunda, `root /var/www/dizijpg;`
#   satırının HEMEN ARDINDAN:
#
#       include /etc/nginx/dizijpg/sikistirma.conf;
#
#   Sunucu kapsamına konur, çünkü `brotli*` ve `gzip*` yönergeleri alt
#   `location` bloklarına MİRAS KALIR. (Bu dosyada bilerek `add_header` YOK:
#   bu projede `add_header` miras alınmıyor, alt bloklar kendi başlığını
#   verdiği an üsttekiler düşüyor — SEO/güvenlik başlıkları o yüzden
#   location'larda tekrarlanıyor.)
#
# ÖN KOŞUL (14 Ağu 2026'da kuruldu):
#   apt-get install -y brotli libnginx-mod-http-brotli-filter \
#                        libnginx-mod-http-brotli-static
#   Debian 12 paketleri /etc/nginx/modules-enabled/ altına sembolik bağ koyar,
#   nginx.conf'un 5. satırındaki `include /etc/nginx/modules-enabled/*.conf;`
#   bunları yükler. `brotli` komut satırı aracı dağıtımda .br üretmek için.
#
# NEDEN (ölçüm, 14 Ağu 2026 — canlı dosyalarla):
#   main.f68cb0813ef6.dart.js  ham 11.842.763 B
#     · nginx varsayılanı gzip seviye 1 →  3.523.884 B   (origin'in verdiği)
#     · Cloudflare üzerinden gelen br   →  2.941.559 B
#     · brotli -q 11 (statik .br)       →  2.097.008 B   → −845 KB
#   canvaskit/canvaskit.wasm  ham 7.229.467 B
#     · Cloudflare üzerinden br         →  2.851.336 B
#     · brotli -q 11 (statik .br)       →  2.248.161 B   → −603 KB
#   İlk yüklemenin kritik yolu ~1,45 MB kısalıyor.
#
#   Kök sebep: origin sıkıştırmayı nginx'in VARSAYILAN `gzip_comp_level 1`i ile
#   yapıyordu ve Cloudflare origin'den gelen gövdeyi yeniden sıkıştırmıyor.
#   Yani "Cloudflare nasılsa sıkıştırır" varsayımı ölçümle YANLIŞLANDI:
#   br isteyen istemciye gzip'ten DAHA BÜYÜK yanıt (2.941.559 > 2.882.477)
#   gidiyordu.
#
# DAĞITIM BAĞIMLILIĞI (ATLANIRSA KAZANÇ SIFIR):
#   `brotli_static on` yalnızca yanı başında `<dosya>.br` VARSA çalışır.
#   Bu dosyaları dağıtım üretir: araclar/web_brotli.sh
#   .br dosyası ESKİ kalırsa nginx eski içeriği yollar; bu yüzden betik her
#   dağıtımda `-f` ile yeniden üretir ve sahipsiz kalan .br'leri siler.

# Dağıtımda üretilmiş .br dosyasını olduğu gibi yolla (CPU maliyeti sıfır).
brotli_static on;

# .br'si olmayan yanıtlar için anlık sıkıştırma: SSR bot sayfaları, sitemap
# XML'leri ve /api/ JSON yanıtları. Seviye 5, CPU/kazanç dengesinin makul
# noktası (11 anlık istekte pahalı, 1 anlamsız).
brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    application/wasm
    image/svg+xml
    font/ttf
    font/otf;

# Brotli desteklemeyen istemci yedeği. `gzip on` nginx.conf'tan miras geliyor
# ama `gzip_comp_level` varsayılanı 1 ve `gzip_types` varsayılanı yalnız
# text/html — yani JS/JSON/XML hiç sıkışmıyordu.
#
# `application/wasm` bu listede OLMAK ZORUNDA: ilk denemede yalnız brotli
# listesine konmuştu, br desteklemeyen istemci canvaskit.wasm'ı 7.229.467 B
# HAM indiriyordu (origin'de ölçüldü). gzip 6 ile ~2,9 MB'a düşüyor.
gzip_comp_level 6;
gzip_vary on;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    application/wasm
    image/svg+xml
    font/ttf
    font/otf;
