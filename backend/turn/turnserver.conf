# =============================================================================
# dizi.jpg — coturn (TURN/STUN) yapılandırması
# Hedef: /etc/turnserver.conf   (Debian 12, coturn 4.6.1-1, apt + systemd)
# Yazıldı: 8 Ağu 2026 — ARAMA-PLANI.md §3, F0 fazı
#
# BU DOSYA HENÜZ CANLIYA KURULMADI. Kurulum adımları: turn/KURULUM.md
# =============================================================================
#
# NEDEN DOCKER DEĞİL, HOST + systemd (karar kapandı, yeniden değerlendirilmeyecek)
# -----------------------------------------------------------------------------
# TURN'ün işi geniş bir UDP röle port aralığı dinlemek. Docker köprü ağında bir
# port ARALIĞI yayınlamak, port BAŞINA bir iptables DNAT kuralı ve (userland
# proxy açıksa) bir `docker-proxy` süreci üretir. 500 portluk bir aralıkta bu,
# konteyner açılışını dakikalara çıkarır ve yüzlerce MB bellek yer. Kaçış yolu
# `network_mode: host`tur; ama o noktada Docker'ın ağ izolasyonundan zaten
# vazgeçilmiş olur ve geriye yalnız paketleme yükü kalır — kazanç sıfır.
# Ayrıca Debian 12 deposunda coturn 4.6.1-1 hazır: güvenlik yamaları `apt`tan
# kendiliğinden gelir, Docker imajında bunu elle taşımak zorunda kalırdık.
# Mevcut Docker yığını (dizijpg-api, dizijpg-db) olduğu gibi kalır; coturn
# onların YANINDA bağımsız bir host servisidir.
#
# =============================================================================
# 1) DİNLENEN ADRES — açıkça tek IP
# =============================================================================
# Sunucuda başka servisler var (nginx :80/:443, postfix :25/:587, dovecot,
# host PostgreSQL :5432, dopamall-redis :6379, docker köprüleri 172.16/12).
# `listening-ip` VERİLMEZSE coturn tüm arayüzleri dinler — docker0 ve
# br-* köprüleri dahil. O zaman TURN, konteyner ağının içinden de erişilebilir
# bir hizmete dönüşür. Tek bir genel IP'ye bağlamak bunu kökten keser.
#
# 154.53.163.3 doğrudan ens18 üzerindedir (154.53.163.3/29, NAT YOK) —
# `ip -4 addr show ens18` ile doğrulandı, 8 Ağu 2026.
listening-ip=154.53.163.3
relay-ip=154.53.163.3

# Sunucu NAT arkasında OLMADIĞI için `external-ip` teknik olarak gereksizdir;
# yine de açıkça yazılıyor: ileride sağlayıcı 1:1 NAT'a geçerse ya da ikinci
# bir IP eklenirse, eksikliği "kimlik doğrulama geçiyor ama ses gelmiyor"
# şeklinde teşhisi zor bir hataya dönüşür. Yazılı olması bedava sigorta.
external-ip=154.53.163.3

# =============================================================================
# 2) PORTLAR
# =============================================================================
# Sinyal portları: `ss -lntup` ile 8 Ağu 2026'da 3478 ve 5349 BOŞ doğrulandı.
listening-port=3478
tls-listening-port=5349

# -----------------------------------------------------------------------------
# RÖLE PORT ARALIĞI — 24000-24499  (ARAMA-PLANI'ndaki 49152-65535 ÖNERİSİ YANLIŞ)
# -----------------------------------------------------------------------------
# İKİ AYRI SEBEPLE değiştirildi:
#
# (a) EFEMERAL ARALIKLA ÇAKIŞMA — ölçüldü, teorik değil.
#     Bu sunucuda:  net.ipv4.ip_local_port_range = 32768  60999
#     Yani çekirdek, giden her bağlantı için (postfix'in SMTP çıkışı, Node'un
#     TMDB istekleri, apt, curl, docker) 32768-60999 arasından rastgele bir
#     kaynak portu seçer. ARAMA-PLANI'nın önerdiği 49152-65535 aralığının
#     49152-60999 kısmı BU ARALIĞIN İÇİNDE. Kanıt: şu anda `avahi-daemon`
#     UDP 51666'da oturuyor — tam da o aralıkta. coturn bir röle portu
#     ayırmaya kalktığında çekirdeğin başka bir sürece verdiği porta denk
#     gelebilir; sonuç, yeniden üretilmesi çok zor, aralıklı "arama bağlandı
#     ama ses yok" hatasıdır. Bu, coturn dağıtımlarının klasik tuzağıdır.
#     Çözüm: aralığı efemeral pencerenin TAMAMEN ALTINA al. 24000-24499'da
#     hiçbir şey dinlemiyor (`ss -lntup`, 20000-32767 taraması boş döndü).
#
# (b) GÜVENLİK DUVARINDA DAR DELİK.
#     49152-65535 = 16.384 port. 24000-24499 = 500 port. Güvenlik duvarında
#     açacağımız delik 32 kat küçülüyor.
#
# BOYUTLANDIRMA (port başına BİR röle ayırması / allocation):
#   ARAMA-PLANI §3.3: tepe saatte ~35 eşzamanlı arama, ~%20'si röleye düşüyor
#   -> ~7 röleli arama. Her iki uç da simetrik NAT arkasındaysa arama başına
#   İKİ ayırma olur (en kötü hal) -> ~14 port. 500 port ~35 kat pay bırakır,
#   yani günlük 1.000 aramanın 35 katına kadar aynı aralık yeter.
#   İzleme: `turnutils_uclient` değil, `ss -anu | grep -c ':24[0-4][0-9][0-9]'`
#   ile anlık kullanım sayılabilir; %50'yi aşarsa aralık genişletilir.
min-port=24000
max-port=24499

# =============================================================================
# 3) KİMLİK DOĞRULAMA — YALNIZ KISA ÖMÜRLÜ (TURN REST API)
# =============================================================================
# Uzun ömürlü kullanıcı/parola (`user=`) BİLEREK YOK. Sabit bir parola
# istemciye gömülmek zorundadır; APK'dan `strings` ile çıkarılır ve o andan
# itibaren TURN sunucumuz herkesin ücretsiz VPN'i olur (trafiği biz öderiz).
#
# Bunun yerine: `use-auth-secret` (RFC 5766 TURN REST API kalıbı).
#   username = "<son_kullanma_epoch>:<kullanici_id>"
#   password = base64( HMAC-SHA1( static-auth-secret, username ) )
# Sunucu (`GET /arama/buz-sunuculari`) bu çifti üretip verir; coturn aynı sırla
# doğrular. Sır İSTEMCİYE HİÇ GİTMEZ. Sızan bir kimlik bilgisi TTL kadar
# (12 saat, bkz. ARAMA-API-SOZLESMESI.md §3) yaşar ve kendiliğinden ölür.
#
# `username`in ikinci alanı kullanıcı kimliğidir; coturn onu yorumlamaz ama
# `user-quota` kişi başına uygulanabilsin ve kötüye kullanan hesap coturn
# günlüğünden teşhis edilebilsin diye oraya konur.
use-auth-secret

# ***** SIR BURAYA — DEPOYA ASLA GİRMEZ *****
# Kurulumda `openssl rand -hex 32` çıktısıyla DOLDURULACAK ve AYNI değer
# /opt/dizijpg/.env içine TURN_SIR olarak yazılacak (bkz. KURULUM.md adım 4).
# Bu satır depoda yer tutucudur; canlıya bu haliyle kopyalanırsa coturn
# çalışır ama HİÇBİR istemci doğrulanamaz (sessiz arıza) — kurulum adımı
# atlanmasın.
static-auth-secret=DEGISTIR-openssl-rand-hex-32-CIKTISI

realm=dizijpg.com

# Nonce ömrü: yeniden oynatma penceresini daraltır (varsayılan 600 sn).
stale-nonce=600

# =============================================================================
# 4) TLS (TURNS 5349) — Let's Encrypt
# =============================================================================
# KARAR: TURNS AÇILIR, ama TURN (3478) ile BAĞIMSIZ iki yol olarak.
#
# Gerekçe:
#  * Sertifika GİZLİLİK için gerekmiyor. WebRTC medyası zaten DTLS-SRTP ile
#    uçtan uca şifreli; TURN sunucusu şifreli paketi çözmeden iletir. TURNS'ün
#    eklediği tek şey, dış katmanın TLS'e BENZEMESİDİR.
#  * Faydası ERİŞİLEBİLİRLİK: yalnız 443/TLS çıkışına izin veren kurumsal /
#    okul / otel güvenlik duvarlarının ardındaki kullanıcılar 3478'e hiç
#    ulaşamaz, 5349/TLS'e ulaşabilir.
#  * Maliyeti neredeyse sıfır: certbot SUNUCUDA ZATEN KURULU (/usr/bin/certbot,
#    doğrulandı) ve /etc/letsencrypt/live BOŞ — yani ilk sertifika olacak,
#    mevcut hiçbir şeyi bozma riski yok.
#  * ARIZA MODU NAZİK: sertifika süresi dolarsa yalnız TURNS ölür, 3478
#    çalışmaya devam eder ve istemci ICE sırasında ona düşer. Bu yüzden TURNS
#    "arama kapanır" riski taşımaz — eklemenin bedeli asimetrik biçimde düşük.
#
# NEDEN nginx'in mevcut sertifikası KULLANILAMAZ: /etc/nginx/ssl/dizijpg.crt
# KENDİNDEN İMZALI (issuer = subject = CN=dizijpg.com, SAN yok). Cloudflare
# "Full (strict değil)" modunda çalıştığı için tarayıcı onu hiç görmez ve
# doğrulamaz. WebRTC istemcisi ise TURNS'te halka açık güvenilen bir zincir
# ister; kendinden imzalı sertifikayla el sıkışma başarısız olur.
#
# BİLİNEN SINIR — TURNS 443'e KONULAMAZ: en güçlü güvenlik duvarı aşma numarası
# TURNS'ü 443'te sunmaktır, çünkü o portu kapatan güvenlik duvarı yok denecek
# kadar azdır. Bu sunucuda 443'ü nginx tutuyor (dizijpg.com, monteqr.me,
# brnmedia). Aynı IP'de ikisi birden olmaz. 5349 ikinci en iyi seçenek; 443'ü
# de isteyen bir gün gelirse ikinci bir IP gerekir. Kaybın büyüklüğü
# ÖLÇÜLMEDİ — [DOĞRULANMALI], ARAMA-PLANI §11 madde 14.
#
# Yollar: certbot'un ürettiği dosyalar root'a 0600'dür; coturn `turnserver`
# kullanıcısı olarak çalıştığı için ONLARI OKUYAMAZ. Bu yüzden sertifikalar
# /etc/coturn/certs/ altına KOPYALANIR ve sahipliği turnserver'a verilir.
# Kopyalamayı yenileme kancası yapar: turn/coturn-sertifika-kancasi.sh
#
# ***** Sertifika ÜRETİLENE KADAR aşağıdaki üç satır YORUMDA KALMALI *****
# Var olmayan bir dosya gösterilirse coturn AÇILIŞTA ÖLÜR ve 3478 de gitmiş
# olur. Sırayla: önce yorumlu haliyle kur ve 3478'i doğrula, sonra certbot,
# sonra bu satırları aç ve `systemctl restart coturn`.
#cert=/etc/coturn/certs/fullchain.pem
#pkey=/etc/coturn/certs/privkey.pem
#cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# TLS 1.0/1.1 kapalı (coturn 4.6 varsayılanı zaten böyle; açıkça yazılıyor).
no-tlsv1
no-tlsv1_1

# =============================================================================
# 5) *** SSRF SAVUNMASI — BU BÖLÜM SİLİNMEZ ***
# =============================================================================
# TURN'ün tanımı gereği yaptığı iş, istemcinin SEÇTİĞİ bir hedefe UDP paketi
# yollamaktır. Kısıtlanmazsa TURN sunucusu, İNTERNETTEN İÇ AĞA AÇILAN BİR
# PROXY'dir: kimlik bilgisi alan herhangi bir istemci 127.0.0.1'e röle isteyip
# yalnız localhost'a bağlı servislere ulaşır.
#
# BU SUNUCUDA NE KAYBEDİLİRDİ (ss -lntup çıktısından, 8 Ağu 2026):
#   127.0.0.1:8500  -> dizijpg API'nin KENDİSİ (nginx'i ve dolayısıyla
#                      Cloudflare'i, gerçek-IP ezmesini, admin IP kontrolünü
#                      TAMAMEN atlayarak)
#   127.0.0.1:8000  -> gunicorn (monteqr)
#   127.0.0.1:8001  -> gunicorn (ikinci uygulama)
#   127.0.0.1:3000  -> next-server (brnmedia)
#   127.0.0.1:8891  -> opendkim  (posta imzalama soketi)
#   127.0.0.1:39217 -> containerd
#   172.16.0.0/12   -> docker köprüsü: dizijpg-db (PostgreSQL) ve
#                      dopamall-redis. Redis'in iptables kuralı
#                      172.16.0.0/12'yi AÇIKÇA KABUL EDİYOR (INPUT kural 4) —
#                      yani docker ağına röle, kimlik doğrulamasız Redis
#                      demektir.
#   169.254.169.254 -> bulut üstveri servisi (varsa kimlik bilgisi sızdırır)
#   154.53.163.3    -> sunucunun KENDİ genel IP'si; 25/587 (postfix) dışarıya
#                      açık, yani röle üzerinden spam kaynağı.
#
# UDP röle TCP servislerine bağlanamaz diye rahatlamak YANLIŞ: coturn TCP röle
# de destekler (RFC 6062) — aşağıda `no-tcp-relay` ile kapatıyoruz, ama
# `denied-peer-ip` ikinci ve ASIL katmandır. İkisi birden.
#
# Not: coturn 4.5.1+ loopback'i varsayılan olarak reddeder; buna GÜVENMİYORUZ,
# açıkça yazıyoruz. Varsayılana güvenmek, bir sürüm yükseltmesinde sessizce
# kaybolabilecek bir güvencedir. [DOĞRULANMALI] 4.6.1'in tam varsayılanı.

# --- IPv4: RFC 1918 özel ağlar ---
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# --- IPv4: loopback ve "bu ağ" ---
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# --- IPv4: link-local + BULUT ÜSTVERİ (169.254.169.254) ---
denied-peer-ip=169.254.0.0-169.254.255.255

# --- IPv4: CGNAT / paylaşımlı adres alanı (RFC 6598) ---
# Operatör NAT havuzu; buraya röle iç abone ağını taramaya yarar.
denied-peer-ip=100.64.0.0-100.127.255.255

# --- IPv4: IETF ayrılmış / belgeleme / kıyaslama blokları ---
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255

# --- IPv4: çoklu yayın + yayın (multicast/broadcast) ---
denied-peer-ip=224.0.0.0-255.255.255.255

# --- SUNUCUNUN KENDİSİ ---
# Kendi genel IP'mize röle: postfix 25/587'ye erişim (spam), nginx 80/443'e
# erişim (Cloudflare'i atlayan istekler). /29 bloğun tamamı kapatılıyor,
# çünkü komşu adresler de aynı altyapıdadır.
denied-peer-ip=154.53.163.0-154.53.163.7

# --- IPv6 ---
# Sunucuda IPv6 dinleme var (nginx [::]:443 vb.). Aynı mantık IPv6'da da
# geçerli: loopback, link-local ve benzersiz-yerel adresler kapatılır.
denied-peer-ip=::1
# *** `denied-peer-ip=::` SATIRI KALDIRILDI — 9 Ağu 2026 ***
# CANLIDA DOĞRULANDI: bu satır "yalnız belirtilmemiş IPv6 adresi" demek DEĞİL;
# coturn onu 0 uzunluklu bir önek gibi ele alıp IPv4 DAHİL **TÜM HEDEFLERİ**
# engelliyordu. Sonuç: kimlik doğrulaması geçiyor, ayırma başarılı görünüyor,
# ama HİÇBİR röle kurulamıyor — yani "arama bağlandı ama ses yok" arızasının
# ta kendisi, üstelik hiçbir hata mesajı vermeden.
# Satır canlı yapılandırmadan çıkarıldıktan sonra dış hedefler geçti;
# 127.0.0.1, docker ağı (172.16/12), 10.x, 192.168.x ve 169.254.169.254
# **hâlâ 403** — yani SSRF engellemesi bu satır olmadan da tam çalışıyor.
# GERİ EKLEME. `KURULUM.md` adım 9 bunu `turnutils_uclient` ile doğrulatıyor.
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Çoklu yayın eşlerine röle YOK (yukarıdaki aralıkla birlikte ikinci katman).
no-multicast-peers

# TCP röle ayırmaları (RFC 6062) KAPALI. WebRTC bunu HİÇ kullanmaz — istemci
# TURN sunucusuna TCP ile BAĞLANABİLİR (bu `listening-port` işidir ve açıktır),
# ama röleden çıkan trafiğin TCP olmasına ihtiyacı yoktur. Kapatmak, iç ağa
# TCP taraması yapılabilecek tüm yolları kesiyor.
no-tcp-relay

# =============================================================================
# 6) KÖTÜYE KULLANIM VE BANT GENİŞLİĞİ SINIRLARI
# =============================================================================
# ARAMA-PLANI §3.3: mevcut giden trafik ~26 GB/ay. Günde 1.000 GÖRÜNTÜLÜ arama
# bunu ~675 GB/ay'a çıkarır. Aşağıdaki üç sınır, "fatura sürprizi" senaryosunun
# ÜST SINIRINI coturn düzeyinde çakar — uygulama katmanı hata yapsa bile.

# Sunucu GENELİNDE eşzamanlı röle ayırma sayısı. 500 portumuz var; 400'de
# durdurmak, port tükenmesinden önce nazik bir "kapasite dolu" hatası verir
# (port tükenmesi teşhisi çok daha zor bir arızadır).
total-quota=400

# Kullanıcı BAŞINA eşzamanlı ayırma. Meşru bir 1:1 arama en çok 2 ayırma ister
# (ses + görüntü ayrı m-line olsa bile BUNDLE ile tek taşıma kullanılır).
# 4, geçiş anlarında (eski arama kapanmadan yenisi kurulurken) pay bırakır;
# tek hesapla onlarca röle açmayı engeller.
user-quota=4

# TEK ayırma için saniyedeki bayt tavanı. 150.000 B/s = 1,2 Mbit/s.
# 720p görüntülü aramanın hedefi yön başına 1,5 Mbit/s'ti; bu tavan röleye
# DÜŞEN aramaları ~1,2 Mbit/s'e sıkıştırır (WebRTC kendi tıkanıklık denetimiyle
# uyum sağlar, arama kopmaz — yalnız çözünürlük düşer). BİLİNÇLİ ÖDÜN: röleye
# düşen %20'lik dilimde görüntü kalitesi biraz düşer, buna karşılık en pahalı
# senaryonun maliyeti %20 kırpılır. P2P bağlanan %80 bundan HİÇ etkilenmez.
max-bps=150000

# SUNUCU GENELİNDE saniyedeki bayt tavanı — asıl emniyet supabı.
# 3.750.000 B/s = 30 Mbit/s. ARAMA-PLANI'nın tepe tahmini 21 Mbit/s idi;
# 30 Mbit/s pay bırakır. Bu tavana çarpıldığında yeni AYIRMALAR reddedilir
# (mevcut aramalar kopmaz) — yani ay sonu faturası, bir hatanın ya da kötüye
# kullanımın büyüklüğüyle DEĞİL, bu sayıyla sınırlanır.
bps-capacity=3750000

# =============================================================================
# 7) YÖNETİM VE İZ BIRAKMA
# =============================================================================
# CLI (varsayılan 127.0.0.1:5766) KAPALI. Açık bırakılırsa parolasız telnet
# arayüzü olur; parola koysak bile kullanmayacağımız bir yüzeyi açmanın anlamı
# yok. İzleme için `ss` ve günlük yeterli.
no-cli

# Prometheus uç noktası da kapalı (varsayılan kapalı; açıkça belirtiliyor):
# yeni bir dinleyen port açmaya değecek bir ihtiyaç yok. Bant genişliği ölçümü
# uygulama tarafında yapılıyor (bkz. ARAMA-API-SOZLESMESI.md §6).
#prometheus

# Sürüm/yazılım adını STUN yanıtlarında REKLAM ETME (parmak izi yüzeyini
# daraltır; sürüme özel bir açık çıktığında hedef listesine girmemek için).
no-software-attribute

# RFC 5780 (NAT davranış keşfi) KAPALI. Bize gerekmiyor ve yansıtmalı
# (amplification) DDoS için kullanılabilen ikinci bir yanıt biçimi sunuyor.
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# Günlük: systemd journal'a. `simple-log` zaman damgalı düz metin verir.
# ÖNEMLİ — `verbose` AÇILMAZ: ayrıntılı kip her ayırma için istemci IP'sini ve
# eş adresini yazar. Bu, ARAMA-PLANI §6'daki "IP adresi KAYDEDİLMEZ" sözüyle
# çelişir. Arıza ayıklarken geçici olarak açılabilir, sonra KAPATILIR.
log-file=stdout
simple-log

# Süreç kimliği: Debian paketi `turnserver` kullanıcısını kendi oluşturur.
proc-user=turnserver
proc-group=turnserver

# Fingerprint özniteliği (WebRTC istemcileri bekler).
fingerprint

# Mobil istemciler için ICE mobility (ağ değişince ayırmayı korur — Wi-Fi'dan
# hücresele geçişte aramanın hayatta kalma şansını artırır).
mobility

# Veritabanı YOK: `use-auth-secret` kullanıldığı için kullanıcı tablosu
# gerekmez. Debian paketi varsayılan olarak SQLite dosyası arar; boş bırakmak
# yerine açıkça belirtmek, "userdb bulunamadı" uyarılarını susturur.
no-sqlite
