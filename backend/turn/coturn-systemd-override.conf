# =============================================================================
# dizi.jpg — coturn systemd sertleştirme eklentisi (drop-in)
# Hedef: /etc/systemd/system/coturn.service.d/dizijpg.conf
# Uygulama:  systemctl edit coturn     (ya da dosyayı elle koy + daemon-reload)
# =============================================================================
#
# NEDEN BİRİM DOSYASI YAZILMIYOR, ÜSTÜNE EKLENTİ KONUYOR
# -----------------------------------------------------------------------------
# Debian'ın coturn paketi kendi birimini getiriyor
# (/lib/systemd/system/coturn.service). Onu KOPYALAYIP değiştirseydik, paket
# bir gün ExecStart'ını ya da bağımlılıklarını düzelttiğinde bizim kopyamız
# eskimiş halde kalır ve bunu kimse fark etmez. Drop-in yalnız DEĞİŞTİRMEK
# İSTEDİĞİMİZ alanları ezer; gerisi paketle birlikte güncellenmeye devam eder.
# Aynı gerekçeyle `apt` üzerinden kurulum seçildi (bkz. turnserver.conf başı).

[Unit]
# Ağ tam kurulmadan başlarsa `listening-ip=154.53.163.3` bağlanamaz ve servis
# ölür. `network-online.target` bunu bekletir.
After=network-online.target
Wants=network-online.target

[Service]
# --- Yeniden başlatma ---
# TURN'ün ölü kalması "aramaların %20'si hiç bağlanmıyor" demektir ve bu
# kullanıcıya "uygulama bozuk" diye görünür (ARAMA-PLANI §3.1). Sessiz ölüme
# tahammül yok.
Restart=always
RestartSec=5s

# --- Sertleştirme ---
# coturn'ün diske YAZMASI gerekmiyor (userdb yok, günlük journal'a gidiyor).
# Bu yüzden dosya sistemi sıkı kapatılabilir.
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
RestrictRealtime=true
LockPersonality=true
MemoryDenyWriteExecute=true

# Sertifikalar yalnız OKUNUR. (Kancanın yazdığı dizin; bkz.
# coturn-sertifika-kancasi.sh)
ReadOnlyPaths=/etc/coturn

# Adres aileleri: IPv4 + IPv6 + yerel soketler. AF_NETLINK, coturn'ün
# arayüzleri sayması için gerekir — çıkarılırsa açılışta "no interfaces"
# hatası verir. [DOĞRULANMALI] ilk kurulumda journal'dan doğrulanmalı;
# sorun çıkarsa bu satır YORUMA ALINIR (güvenlik kaybı sınırlıdır).
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK

# --- Kaynak sınırları ---
# 500 röle portu + sinyal soketleri + istemci bağlantıları. 16384 fazlasıyla
# yeterli, ama varsayılan 1024 DEĞİL: dosya tanıtıcısı tükenmesi, teşhisi zor
# "bazı aramalar bağlanmıyor" hatasının ikinci klasik sebebidir.
LimitNOFILE=16384

# Bellek tavanı: coturn paket yönlendirir, durum tutmaz; 512 MB'ın yakınına
# bile gelmemeli. Gelirse bir sızıntı ya da kötüye kullanım var demektir ve
# 131 GB'lık makineyi yemesindense servisin yeniden başlaması yeğdir.
MemoryMax=512M

# CPU: 16 çekirdekli makinede coturn'ün 2 çekirdekten fazlasını yemesi
# beklenmiyor (30 Mbit/s tavanında paket kopyalama işi). Diğer servisleri
# (nginx, PostgreSQL, dizijpg-api) aç bırakmasın diye tavan.
CPUQuota=200%
