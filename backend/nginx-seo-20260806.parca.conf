# dizi.jpg — nginx SEO parcasi (6 Agu 2026)  [HENUZ UYGULANMADI]
# ===========================================================================
# Hedef dosya: /etc/nginx/sites-available/dizijpg.com  (443 server blogu)
# DIKKAT: /etc/nginx/sites-available/dizijpg AYRI ve TERK EDILMIS eski sitedir,
#         sites-enabled'da yoktur; ELLEME.
#
# Bu dosya calisan bir conf DEGIL, elle kopyalanacak bloklarin listesidir.
# Her blogun basinda "NEREYE" satiri var. Uygulama sirasi ve dogrulama
# adimlari en altta.
#
# ---------------------------------------------------------------------------
# NEDEN HER BLOKTA GUVENLIK BASLIKLARI TEKRARLANIYOR
# ---------------------------------------------------------------------------
# nginx'te `add_header` MIRAS ALINMAZ: bir location kendi add_header'ini
# yazdigi anda ust bloktaki TUM add_header'lar (HSTS, nosniff, X-Frame-Options,
# Referrer-Policy, Permissions-Policy) o yanit icin IPTAL olur. Yani
# Cache-Control eklemek istedigin her yerde digerlerini de tekrar yazmak
# zorundasin. Canli conf'taki main.<hash>.dart.js blogu tam olarak bu yuzden
# bes basligi tekrarliyor; asagidakiler ayni kalibi izler.
# ===========================================================================


# ---------------------------------------------------------------------------
# 1) canvaskit/ — kalici onbellek                       (SEO-PLANI 1.5 / 1. adim)
# ---------------------------------------------------------------------------
# NEREYE: `location ~* "^/main\.[0-9a-f]{12}\.dart\.js$"` blogundan HEMEN SONRA.
#
# OLCUM (6 Agu, canli): canvaskit.wasm zaten `cf-cache-status: HIT` +
# `cache-control: max-age=31536000` + `content-encoding: br` donuyor. Bu deger
# ORIGIN'DEN GELMIYOR — nginx'te canvaskit blogu YOK; Cloudflare tarafindaki
# bir Cache Rule / Browser TTL uretiyor. Yani bugun calisan sey CF ayarina
# bagli ve panelde biri onu degistirirse sessizce 4 saate duser.
# Bu blok o degeri ORIGIN'e sabitler: CF ayari degisse de dosya 1 yil
# onbelleklenir. Dosya adlari Flutter surumuyle sabit oldugu icin `immutable`
# guvenli (surum degisince yol da degisir).
location ^~ /canvaskit/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # add_header burada ust bloktakileri iptal ettigi icin tekrarlanir
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}


# ---------------------------------------------------------------------------
# 2) assets/ — 4 saat -> 30 gun                         (SEO-PLANI 1.5 / 2. adim)
# ---------------------------------------------------------------------------
# NEREYE: (1)'in hemen ardina.
#
# OLCUM (6 Agu, canli): /assets/fonts/MaterialIcons-Regular.otf ve
# /icons/Icon-192.png -> `cache-control: max-age=14400`, `cf-cache-status: HIT`.
# Bu 14400 de ORIGIN'DEN GELMIYOR (nginx'te assets blogu yok): Cloudflare'in
# varsayilan Browser Cache TTL'i 4 saat. /assets/*.json ise `DYNAMIC` —
# hic onbelleklenmiyor.
#
# !!! TEK BASINA YETMEZ !!!  Cloudflare panelinde Caching > Configuration >
# Browser Cache TTL "Respect Existing Headers" DEGILSE, CF asagidaki
# max-age=2592000'i EZER ve tarayiciya yine 14400 gonderir. Once o ayar,
# sonra bu blok. Dogrulama komutu en altta.
#
# Flutter assets'i icerik hash'li DEGIL (AssetManifest.bin.json degisir ama adi
# ayni kalir), bu yuzden `immutable` VERILMEZ ve sure 1 yil degil 30 gundur:
# yeni dagitimda tarayici en gec 30 gun icinde yeni varliga geciyor olmali.
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=2592000" always;
    # add_header burada ust bloktakileri iptal ettigi icin tekrarlanir
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}


# ---------------------------------------------------------------------------
# 3) /gozat ve /kesfet botlara SSR                      (SEO-PLANI 1.4 kalani)
# ---------------------------------------------------------------------------
# NEREYE: `location ~ ^/(icerik|gonderi|kisi|dizi|listeler)/` blogunun HEMEN
#         ARDINA (mevcut `@og` adlandirilmis location'i aynen kullanir:
#         proxy_pass .../og$uri -> /og/gozat, /og/kesfet).
#
# Mevcut bot regex'i sondaki `/` yuzunden tek parcali yollari yakalamaz;
# bu yuzden AYRI location gerekiyor. `$` sinirlayici onemli: /gozat-bilmemne
# gibi uydurma yollara SSR uretilmesin.
#
# NOT (cloaking): server.js'te `SEO_KESIF_INDEKS = false` oldugu surece bu iki
# sayfa `noindex,follow` doner. Yani blok bugun taranabilirlik/ic baglanti
# icindir, indeksleme icin degil. Flutter `acikYolOnEkleri`ne '/gozat' ve
# '/kesfet' eklenmeden sabiti true YAPMA.
location ~ ^/(gozat|kesfet)$ {
    error_page 418 = @og;
    if ($og_bot) { return 418; }
    try_files $uri /index.html;
}


# ---------------------------------------------------------------------------
# 4) /kullanici/ — profiller ASLA indekslenmez            (kullanici karari)
# ---------------------------------------------------------------------------
# NEREYE: (3)'un ardina, `location / { try_files ... }` blogundan ONCE.
#
# robots.txt'teki `Disallow: /kullanici/` birinci katmandir ve tarama HIC
# olmadigi surece yeterlidir. Bu blok ikinci katman:
#   - Cloudflare yonetilen robots.txt bizim dosyamizin ONUNE kendi bloklarini
#     ekliyor; bir gun bizimkini golgelerse Disallow etkisiz kalabilir,
#   - robots.txt'e uymayan ama X-Robots-Tag'e uyan tarayicilar var,
#   - ve tarama olursa "URL-only indexing" (icerigi olmayan cikti bagi) da
#     kapanir.
# Iki katman birlikte celiskili degil, kademelidir: Disallow taramayi keser,
# X-Robots-Tag tarama olursa indekslemeyi keser.
location ^~ /kullanici/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # add_header burada ust bloktakileri iptal ettigi icin tekrarlanir
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri /index.html;
}


# ---------------------------------------------------------------------------
# 5) robots.txt Node'dan                                  (istege bagli)
# ---------------------------------------------------------------------------
# NEREYE: mevcut `location = /robots.txt { root /var/www/dizijpg; ... }`
#         blogunun YERINE.
#
# Gerekce: dosyanin depoda kaynagi yoktu (backend/robots.txt ile eklendi) ve
# /var/www/dizijpg Flutter dagitimlariyla eziliyor. IndexNow anahtar dosyasi
# icin verilen kararin aynisi.
#
# BU BLOGU UYGULAMAZSAN: backend/robots.txt'i elle kopyalaman gerekir ->
#   scp backend/robots.txt karanew:/var/www/dizijpg/robots.txt
# Ikisinden BIRI yapilmali; yoksa yeni Disallow kurallari canliya cikmaz.
location = /robots.txt {
    proxy_pass http://127.0.0.1:8500/robots.txt;
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
}


# ===========================================================================
# UYGULAMA ADIMLARI  (ana oturumda, kullanici onayiyla)
# ===========================================================================
#  1. ssh karanew 'cp /etc/nginx/sites-available/dizijpg.com \
#                     /etc/nginx/sites-available/dizijpg.com.yedek-20260806'
#  2. Bloklari yukaridaki "NEREYE" notlarina gore ekle/degistir.
#  3. ssh karanew 'nginx -t'          -> "syntax is ok" + "test is successful"
#  4. ssh karanew 'systemctl reload nginx'
#  5. Backend dagitimi (robots.txt Node'a girdigi icin ZORUNLU):
#     scp backend/server.js backend/robots.txt backend/Dockerfile karanew:/opt/dizijpg/
#     ssh karanew 'cd /opt/dizijpg && docker compose up -d --build api'
#
# DOGRULAMA (dagitimdan sonra):
#   curl -sI https://dizijpg.com/canvaskit/canvaskit.wasm | grep -i cache-control
#     -> public, max-age=31536000, immutable
#   curl -sI https://dizijpg.com/assets/fonts/MaterialIcons-Regular.otf | grep -i cache-control
#     -> public, max-age=2592000   (14400 gorunuyorsa CF Browser TTL eziyor)
#   curl -s https://dizijpg.com/robots.txt | grep -i 'kullanici'
#     -> Disallow: /kullanici/
#   curl -sI https://dizijpg.com/kullanici/testkullanici | grep -i x-robots-tag
#     -> noindex, nofollow, noarchive
#   curl -s -A Googlebot https://dizijpg.com/gozat | grep -c '<a href="/icerik/'
#     -> 24'ten buyuk
#   curl -s -A Googlebot https://dizijpg.com/gozat | grep -i 'name="robots"'
#     -> noindex,follow   (SEO_KESIF_INDEKS=false oldugu surece DOGRU cikti)
#   curl -s -A Googlebot https://dizijpg.com/kesfet | grep -o '"@type":"CollectionPage"'
#     -> eslesmeli
#   curl -s -A Googlebot https://dizijpg.com/icerik/tv/1396 | grep -c '<article>'
#     -> regresyon: 1.1 sayfasi bozulmadi mi
#
# GERI ALMA:
#   ssh karanew 'cp /etc/nginx/sites-available/dizijpg.com.yedek-20260806 \
#                   /etc/nginx/sites-available/dizijpg.com && nginx -t && \
#                   systemctl reload nginx'
#
# CLOUDFLARE PANELINDE (nginx'in yapamayacaklari):
#   a) Caching > Configuration > Browser Cache TTL = "Respect Existing Headers"
#      (yoksa 2 numarali blok etkisiz kalir)
#   b) Cache Rules: `.wasm` uzantisi icin Eligible for cache + Edge TTL 1 yil
#      (bugun calisiyor ama panelde acik bir kural yoksa varsayilana bagli)
#   c) Speed > Optimization > Content Optimization > Brotli: ACIK
#      (olcum: canvaskit.wasm `br` aliyor ama main.dart.js ve /assets/ `gzip`)
#   d) AI Crawl Control: yonetilen robots.txt blogu KAPATILMALI; yoksa CF kendi
#      `Google-Extended: Disallow` blogunu bizim dosyamizin ONUNE ekliyor ve
#      origin robots.txt'i tek basina yetmiyor.
# ===========================================================================
