# dizi.jpg — nginx SEO parcasi (19 Agu 2026)  [HENUZ UYGULANMADI]
# ===========================================================================
# Hedef dosya: /etc/nginx/sites-available/dizijpg.com  (443 server blogu)
# Depodaki kopya: backend/nginx-dizijpg.com-20260817.conf (bu parca ORAYA
# ISLENDI; canliya elle uygulanmasi gerekiyor).
#
# NE COZUYOR: bu turda IKI yeni SSR yuzeyi acildi
#   * /og/sirket/:id — yapim firmasi sayfasi (Netflix/HBO/TIMS&B yapimlari)
#   * /og/gizlilik   — gizlilik politikasinin TAM metni (artik indekslenebilir)
#
# ONEMLI: canlida `location @spa` (14 Agu parcasi, md.58) UYGULANMISSA bu
# degisiklik ISLEVSEL OLARAK ZORUNLU DEGIL — @spa zaten diskte olmayan HER bot
# yolunu /og$uri'ye tasiyor, yani /sirket/123 ve /gizlilik su an da Node'a
# gidiyor ve yeni uclar servis edilir. Bu parca iki sey yapiyor:
#   1. NIYETI BELGELIYOR: bot regex'i "SSR'i olan paylasilabilir yollar"in
#      listesidir; iki yeni yuzey oraya yaziliyor.
#   2. @spa'nin UYGULANMADIGI bir sunucuda da (13 Agu oncesi conf) yeni SSR'in
#      servis edilmesini garanti ediyor — orada bot Flutter kabugu alirdi.
# ===========================================================================


# ---------------------------------------------------------------------------
# 1) Icerik bot regex'ine `sirket` eklendi
# ---------------------------------------------------------------------------
# NEREYE: mevcut
#   location ~ ^/(icerik|gonderi|kisi|dizi|listeler)/ { ... }
# blogunun ILK SATIRI. Govde AYNEN kalir.
location ~ ^/(icerik|gonderi|kisi|dizi|listeler|sirket)/ {
    error_page 418 = @og;
    if ($og_bot) { return 418; }
    try_files $uri /index.html;
}


# ---------------------------------------------------------------------------
# 2) Tek parcali yol regex'ine `gizlilik` eklendi
# ---------------------------------------------------------------------------
# NEREYE: mevcut
#   location ~ ^/(gozat|kesfet)$ { ... }
# blogunun ILK SATIRI. Govde AYNEN kalir.
#
# "$" siniri onemli: `/gizlilik.html` BURAYA DUSMEZ. O gercek bir statik dosya
# (app/web/gizlilik.html, 45 dilli JS'li surum) ve oldugu gibi servis edilmeye
# devam eder — SSR yalnizca Flutter rotasi olan `/gizlilik` icindir.
location ~ ^/(gozat|kesfet|gizlilik)$ {
    error_page 418 = @og;
    if ($og_bot) { return 418; }
    try_files $uri /index.html;
}


# ===========================================================================
# UYGULAMA ADIMLARI  (ana oturumda, kullanici onayiyla)
# ===========================================================================
#  1. ssh karanew 'cp /etc/nginx/sites-available/dizijpg.com \
#                     /etc/nginx/sites-available/dizijpg.com.yedek-20260819'
#  2. Iki location satirini yukaridaki gibi genislet (govdelere DOKUNMA).
#  3. ssh karanew 'nginx -t'          -> "syntax is ok" + "test is successful"
#  4. ssh karanew 'systemctl reload nginx'
#  5. Backend dagitimi (server.js degisti; MIGRASYON YOK — `tur='company'`
#     kolon kisiti 19 Agu'nun ilk migrasyonuyla zaten uygulandi):
#     scp backend/server.js karanew:/opt/dizijpg/
#     ssh karanew 'cd /opt/dizijpg && docker compose up -d --build api'
#
# DOGRULAMA (dagitimdan sonra; sirayla)
# ---------------------------------------------------------------------------
# A) FIRMA SSR'I
#   curl -s -A Googlebot https://dizijpg.com/sirket/213 | head -5
#     -> <title>Netflix dizileri ve filmleri — dizi.jpg</title>
#   curl -s -A Googlebot https://dizijpg.com/sirket/213 | grep -c '"@type":"Organization"'
#     -> 1
#   curl -s -A Googlebot https://dizijpg.com/sirket/213 | grep -c '<img '
#     -> 0'dan buyuk (afisler)
#   curl -s -o /dev/null -w '%{http_code}\n' -A Googlebot \
#        https://dizijpg.com/sirket/999999999
#     -> 404   (olmayan firma: GERCEK 404, soft 404 degil)
#
# B) GIZLILIK SSR'I
#   curl -s -A Googlebot https://dizijpg.com/gizlilik | grep -c 'KVKK ve GDPR'
#     -> 1     (gercek politika metni basiliyor)
#   curl -s -A Googlebot https://dizijpg.com/gizlilik | grep -i 'name="robots"'
#     -> BOS   (noindex KALKTI)
#   curl -s https://dizijpg.com/sitemap-genel.xml | grep -c '/gizlilik'
#     -> 1
#
# C) INSAN TRAFIGI BOZULMADI MI  (EN ONEMLI KONTROL)
#   curl -s https://dizijpg.com/sirket/213 | grep -c flutter_bootstrap
#     -> 1'den buyuk   (kabuk geliyor, SSR degil)
#   curl -s https://dizijpg.com/gizlilik | grep -c flutter_bootstrap
#     -> 1'den buyuk
#   curl -s -o /dev/null -w '%{http_code}\n' https://dizijpg.com/gizlilik.html
#     -> 200   (statik cok dilli sayfa hala yerinde)
#
# GERI ALMA
# ---------------------------------------------------------------------------
#   ssh karanew 'cp /etc/nginx/sites-available/dizijpg.com.yedek-20260819 \
#                   /etc/nginx/sites-available/dizijpg.com && nginx -t && \
#                   systemctl reload nginx'
