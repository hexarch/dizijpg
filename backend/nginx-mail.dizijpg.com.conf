# mail.dizijpg.com — YALNIZ ACME (Let's Encrypt) dogrulamasi icin.
#
# NEDEN AYRI VHOST: mail.dizijpg.com'da web icerigi YOK; bu blogun tek isi
# HTTP-01 meydan okumasini servis etmek. Blok olmadan istek, port 80'deki ILK
# server blogu ne ise ona dusuyordu (bugun HTTPS'e 301). Yonlendirme ile de
# calisirdi ama davranis "config dosyalarinin siralamasina" bagli kalirdi;
# bir gun baska bir vhost eklendiginde sessizce kayar ve YENILEME BASARISIZ
# olurdu — sertifika 90 gunde bir yenilendigi icin bunu aylar sonra fark
# ederdik. Acik blok o belirsizligi kaldiriyor.
#
# NEDEN CLOUDFLARE BLOGU (444) YOK: mail.dizijpg.com BILEREK gri buluttur
# (proxy'siz, dogrudan 154.53.163.3). Let's Encrypt dogrulayicisi de bir CF
# IP'si degildir; $dizijpg_cf_disi kurali burada olsaydi dogrulama 444 yer ve
# sertifika HIC alinamazdi.
#
# HTTPS blogu YOK ve GEREKMIYOR: sertifikayi kullanan nginx degil, Postfix
# (25/465/587) ve Dovecot (143/993/110/995).
server {
    listen 80;
    listen [::]:80;
    server_name mail.dizijpg.com;

    access_log /var/log/nginx/access.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # Geri kalan her sey: burada web sitesi yok.
    location / {
        return 404;
    }
}
