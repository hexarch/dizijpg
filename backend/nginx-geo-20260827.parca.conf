# dizi.jpg — nginx GEO parcasi (27 Agu 2026)
# ===========================================================================
# Hedef dosya: /etc/nginx/sites-available/dizijpg.com  (dosyanin BASI, map blogu)
# Ilgili karar belgesi: GEO-PLANI.md v1.0 §3 (baglayici sira, 1. adim)
#
# NE COZUYOR
# ----------
# Uretken arama motorlarinin CEVAP botlari `$og_bot` regex'inde YOKTU. Yani
# ChatGPT Search / Perplexity / Claude sayfayi istese SSR degil BOS FLUTTER
# KABUGU alirdi (olculdu: 12.679 bayt, <title> yalniz "dizi.jpg").
#
# OLCUM (27 Agu 2026, canli curl, ?n=$RANDOM ile onbellek atlanarak):
#   Googlebot / bingbot / DuckDuckBot -> 200 + 16.215 bayt TAM SSR
#   OAI-SearchBot / ChatGPT-User      -> 403 (Cloudflare)
#   PerplexityBot / Perplexity-User   -> 403 (Cloudflare)
#   Claude-User / Claude-SearchBot    -> 403 (Cloudflare)
#   genel UA (curl/python/Chrome)     -> 200 + 12.679 bayt BOS KABUK
#
# SIRA NEDEN BU (GEO-PLANI §0.1): su an CF zaten 403 verdigi icin bu parca
# TEK BASINA gorunur bir sey degistirmez. AMA CF engeli KALKMADAN ONCE
# uygulanmasi sart: ters sirada, engel kalkar kalkmaz gelen ILK tarama bos
# kabugu gorur ve motor "bu sitede icerik yok" diye kaydeder. 403 gecici
# sayilir; BOS SAYFA KALICI KANAAT olur. Once arkayi hazirla, sonra kapiyi ac.
#
# NEDEN EGITIM BOTLARI EKLENMIYOR
# --------------------------------
# GPTBot, ClaudeBot, CCBot, Bytespider, Amazonbot, meta-externalagent,
# Applebot-Extended = model EGITIMI botlari. robots.txt onlara `Disallow: /`
# diyor (kullanici karari, `Content-Signal: ai-train=no`). SSR vermek kendi
# beyanimizla celisirdi. Bu parca YALNIZ cevap/arama botlarini ekler —
# robots.txt'teki `use=reference` izninin karsiligi budur.
#
# NEDEN "HERKESE SSR VER" DEGIL
# ------------------------------
# Genel UA'ya da SSR vermek, tuhaf UA'li GERCEK bir tarayiciya uygulama yerine
# bot sayfasini gosterirdi ve SEO-YAPILACAKLAR §10 md.4'teki cloaking kilidini
# bozardi. Cozum listeyi genisletmek, kapiyi sokmek degil.
#
# NOT: `Applebot` regex'te ZATEN VAR ve oyle kalir — o link onizleme /
# Spotlight botudur. Egitim botu olan `Applebot-Extended` AYRI bir UA'dir ve
# eklenmiyor. Ikisini karistirmayin.
# ===========================================================================


# ---------------------------------------------------------------------------
# 1) $og_bot regex'ine AI CEVAP botlari eklendi
# ---------------------------------------------------------------------------
# NEREYE: dosyanin basindaki
#   map $http_user_agent $og_bot { ... }
# blogundaki tek `~*(...)` satiri. Mevcut liste AYNEN korunur, sonuna alti UA
# eklenir. Blogun geri kalani (default 0; vb.) degismez.
#
# GECMIS LISTE (27 Agu oncesi, degistirilmedi):
#   facebookexternalhit|Facebot|Twitterbot|WhatsApp|Slackbot|Slack-ImgProxy|
#   TelegramBot|LinkedInBot|Discordbot|Pinterest|redditbot|Applebot|embedly|
#   vkShare|W3C_Validator|Googlebot|GoogleOther|bingbot|DuckDuckBot|Yandex|
#   Google-InspectionTool|SkypeUriPreview
#
# EKLENENLER ve NE OLDUKLARI:
#   OAI-SearchBot     — ChatGPT Search'un indeks tarayicisi (egitim DEGIL)
#   ChatGPT-User      — kullanici ChatGPT'de link actiginda canli getirme
#   PerplexityBot     — Perplexity indeks tarayicisi
#   Perplexity-User   — Perplexity'de kullanici tetikli canli getirme
#   Claude-User       — Claude kullanici tetikli getirme
#   Claude-SearchBot  — Claude arama tarayicisi
map $http_user_agent $og_bot {
    default 0;
    ~*(facebookexternalhit|Facebot|Twitterbot|WhatsApp|Slackbot|Slack-ImgProxy|TelegramBot|LinkedInBot|Discordbot|Pinterest|redditbot|Applebot|embedly|vkShare|W3C_Validator|Googlebot|GoogleOther|bingbot|DuckDuckBot|Yandex|Google-InspectionTool|SkypeUriPreview|OAI-SearchBot|ChatGPT-User|PerplexityBot|Perplexity-User|Claude-User|Claude-SearchBot) 1;
}


# ---------------------------------------------------------------------------
# UYGULAMA
# ---------------------------------------------------------------------------
#   cp /etc/nginx/sites-available/dizijpg.com \
#      /etc/nginx/sites-available/dizijpg.com.yedek-geo-20260827
#   # map blogundaki ~*(...) satirini yukaridakiyle degistir
#   nginx -t && systemctl reload nginx
#
# DOGRULAMA — CF'TEN GECMEDEN, SUNUCUNUN KENDISINDEN
# ---------------------------------------------------------------------------
# Disaridan curl ile dogrulanamaz: Cloudflare bu UA'lari 403'luyor, istek
# nginx'e hic ulasmiyor. Bu yuzden test origin'de yapilir:
#
#   for UA in OAI-SearchBot ChatGPT-User PerplexityBot Perplexity-User \
#             Claude-User Claude-SearchBot Googlebot; do
#     printf '%-18s ' "$UA"
#     curl -s -o /tmp/b -w '%{http_code} ' -H 'Host: dizijpg.com' \
#       -A "Mozilla/5.0 (compatible; $UA/1.0; +t)" \
#       http://127.0.0.1/icerik/tv/1396
#     wc -c < /tmp/b
#   done
#
# BEKLENEN: yedisi de 200 + ~16 KB (SSR). ~12,7 KB gelirse regex tutmamistir.
#
# INSAN TRAFIGI BOZULMADI MI:
#   curl -s -o /dev/null -w '%{http_code} %{size_download}\n' -H 'Host: dizijpg.com' \
#     -A 'Mozilla/5.0 (Macintosh) Chrome/140.0' http://127.0.0.1/icerik/tv/1396
#   BEKLENEN: 200 + ~12,7 KB (Flutter kabugu) — DEGISMEMELI.
#
# GERI ALMA
# ---------------------------------------------------------------------------
#   cp /etc/nginx/sites-available/dizijpg.com.yedek-geo-20260827 \
#      /etc/nginx/sites-available/dizijpg.com
#   nginx -t && systemctl reload nginx
# Tek satirlik degisiklik; yan etkisi yok, veri tasimaz.
