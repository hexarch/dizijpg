# Link önizleme botları (WhatsApp/Twitter/Facebook/…): bunlar JS çalıştırmaz,
# içerik-özel OG meta için /og/... uçlarına yönlendirilirler. Gerçek tarayıcılar
# normal Flutter uygulamasını alır.
map $http_user_agent $og_bot {
    default 0;
    ~*(facebookexternalhit|Facebot|Twitterbot|WhatsApp|Slackbot|Slack-ImgProxy|TelegramBot|LinkedInBot|Discordbot|Pinterest|redditbot|Applebot|embedly|vkShare|W3C_Validator|Googlebot|bingbot|Yandex|Google-InspectionTool|SkypeUriPreview) 1;
}

# Admin uclari yalniz yonetici IP'sinden acik. geo, realip modulu CF-Connecting-IP
# ile cozdukten SONRAKI $remote_addr'a bakar; yani gercek istemci IP'sine. CF edge
# araliklari disindan gelen sahte basliklar $remote_addr'i degistiremez.
geo $dizijpg_admin_izinli {
    default          0;
    127.0.0.1/32     1;
    ::1/128          1;
    188.119.45.48/32 1;
    151.250.44.135/32 1;
}

# GUVENLIK (denetim 2.2) — Cloudflare atlatmasini kapat.
# Origin IP acikta (mail.dizijpg.com A kaydi + SPF ip4:154.53.163.3), bu yuzden
# "curl -H 'Host: dizijpg.com' https://154.53.163.3/" tum siteyi veriyordu; yani
# CF'nin WAF / DDoS / bot yonetimi / hiz kurallari tamamen atlanabiliyordu.
#
# NEDEN $realip_remote_addr (allow/deny DEGIL):
#   allow/deny (access modulu) ACCESS fazinda calisir, yani realip modulu
#   CF-Connecting-IP'yi uyguladiktan SONRAKI $remote_addr'a bakar. Oraya CF
#   araliklarini yazmak GERCEK ziyaretcilerin IP'siyle karsilastirir ve
#   herkesi engellerdi. $realip_remote_addr ise degistirilmeden ONCEKI,
#   yani gercekten TCP baglantisini kuran tarafin (CF edge) adresidir.
#
# NEDEN nginx (guvenlik duvari DEGIL):
#   80/443 portlarini brnmedia.me ve monteqr.me (restaurant) vhost'lari da
#   paylasiyor; iptables/ufw kurali port bazlidir ve onlari da keserdi.
#   nginx'te vhost bazinda kisitlamak cerrahi olur, mail (25/587/993) ve
#   PostgreSQL (5432) hic etkilenmez.
geo $realip_remote_addr $dizijpg_cf_disi {
    default          1;
    127.0.0.1/32     0;   # sunucunun kendi ic cagrilari
    ::1/128          0;
    154.53.163.3/32  0;   # sunucunun kendi genel IP'si (/opt/dizijpg betikleri)
    include /etc/nginx/cloudflare/geo-izin.conf;   # CF edge araliklari -> 0
}

# Engellenen (CF disi, dogrudan origin'e gelen) istekler ayri dosyaya yazilir.
# $realip_remote_addr burada gercek baglanan taraftir; teshis icin sart.
log_format dizijpg_cfblok '$time_iso8601 baglanan=$realip_remote_addr '
                          'port=$server_port host=$host "$request" '
                          'ua="$http_user_agent"';

# www -> apex 301 (SEO-PLANI 0.4): link degeri tek hostta toplansin. Ana blogun
# server_name'inden www.dizijpg.com CIKARILDI; 80 portu da buraya duser.
# add_header YOK -> 301 yaniti icin gereksiz, ust seviye baslik da iptal olmaz.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dizijpg.com;

    ssl_certificate     /etc/nginx/ssl/dizijpg-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/dizijpg-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # DIKKAT: server duzeyinde access_log tanimlamak, http duzeyindeki
    # access_log'u DEVRE DISI BIRAKIR (nginx yalnizca ust seviyeden miras alir
    # eger bu seviyede HIC access_log yoksa). Bu yuzden ana gunluk burada
    # ACIKCA tekrar edilmeli; yoksa dizijpg.com trafigi access.log'a hic yazilmaz.
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/dizijpg-cf-disi.log dizijpg_cfblok if=$dizijpg_cf_disi;
    if ($dizijpg_cf_disi) { return 444; }

    return 301 https://dizijpg.com$request_uri;
}

# HTTP → HTTPS: origin'e doğrudan (CF atlanarak) gelen şifrelenmemiş istekleri
# de HTTPS'e zorla. CF SSL modu "Full" olduğundan CF origin'e zaten 443 ile
# bağlanır; bu yüzden redirect döngüsü OLUŞMAZ.
server {
    listen 80;
    listen [::]:80;
    server_name dizijpg.com;

    # DIKKAT: server duzeyinde access_log tanimlamak, http duzeyindeki
    # access_log'u DEVRE DISI BIRAKIR (nginx yalnizca ust seviyeden miras alir
    # eger bu seviyede HIC access_log yoksa). Bu yuzden ana gunluk burada
    # ACIKCA tekrar edilmeli; yoksa dizijpg.com trafigi access.log'a hic yazilmaz.
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/dizijpg-cf-disi.log dizijpg_cfblok if=$dizijpg_cf_disi;
    if ($dizijpg_cf_disi) { return 444; }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dizijpg.com;

    ssl_certificate     /etc/nginx/ssl/dizijpg-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/dizijpg-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Tarayıcıya "bu siteye hep HTTPS ile gel" de (6 ay).
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Cloudflare gerçek IP: yalnız CF edge aralıklarından gelen CF-Connecting-IP
    # güvenilir sayılır. Bu aralıklar DIŞINDAN (origin'e doğrudan) gelen bir
    # bağlantının gönderdiği CF-Connecting-IP başlığı YOK SAYILIR; $remote_addr
    # saldırganın gerçek IP'si olur. Tam güncel CF listesi (IPv4 + IPv6).
    # Aralik listesi /etc/nginx/cloudflare/realip.conf'ta; yukaridaki
    # $dizijpg_cf_disi geo blogu ayni kaynaktan uretilen geo-izin.conf'u
    # kullanir. Tek kaynak -> ikisi asla birbirinden kaymaz.
    # Tazeleme: /usr/local/bin/cf-ip-tazele.sh (gunluk cron).
    real_ip_header CF-Connecting-IP;
    include /etc/nginx/cloudflare/realip.conf;

    # CF disindan (dogrudan origin'e) gelen istekleri kaydet/engelle.
    # DIKKAT: server duzeyinde access_log tanimlamak, http duzeyindeki
    # access_log'u DEVRE DISI BIRAKIR (nginx yalnizca ust seviyeden miras alir
    # eger bu seviyede HIC access_log yoksa). Bu yuzden ana gunluk burada
    # ACIKCA tekrar edilmeli; yoksa dizijpg.com trafigi access.log'a hic yazilmaz.
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/dizijpg-cf-disi.log dizijpg_cfblok if=$dizijpg_cf_disi;
    if ($dizijpg_cf_disi) { return 444; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-RJ/D5BTfkRmRMxMKCW/0OVhx1yUCR3lJaAw9RjfZi+E=' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;

    # dizi.jpg web uygulaması (Flutter web)
    root /var/www/dizijpg;

    # Sikistirma (14 Agu 2026): brotli_static + gzip yedegi.
    include /etc/nginx/dizijpg/sikistirma.conf;
    index index.html;

    # Flutter giriş dosyaları her build'de değişir -> Cloudflare/tarayıcı önbelleklemesin
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # add_header burada ust bloktakileri iptal ettigi icin tekrarlanir
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-RJ/D5BTfkRmRMxMKCW/0OVhx1yUCR3lJaAw9RjfZi+E=' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
        try_files $uri =404;
    }

    # Icerik hash'li ana paket (araclar/web_hashla.js uretir). Adi icerikle
    # birlikte degistigi icin ESKI SURUM SERVIS EDILME RISKI YOK -> sonsuza
    # kadar onbelleklenebilir. Hash'siz main.dart.js ustteki no-store blogunda
    # kalir (eski dagitimdan artakalan dosya icin guvenlik agi).
    # Regex TIRNAK ICINDE: nginx yapilandirmasinda "{" "}" blok ayracidir,
    # tirnaksiz yazilinca [emerg] unknown directive "12}\.dart\.js$" verir.
    location ~* "^/main\.[0-9a-f]{12}\.dart\.js$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header burada ust bloktakileri iptal ettigi icin tekrarlanir
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-RJ/D5BTfkRmRMxMKCW/0OVhx1yUCR3lJaAw9RjfZi+E=' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
        try_files $uri =404;
    }

    # SEO 1.5/1: canvaskit dosya adlari Flutter surumuyle sabit -> 1 yil immutable.
    # Bugun donen max-age=31536000 ORIGIN'den DEGIL Cloudflare'den geliyordu;
    # bu blok degeri origin'e sabitler (panelde biri CF ayarini degistirirse
    # onbellek sessizce 4 saate dusmesin).
    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header burada ust bloktakileri iptal ettigi icin tekrarlanir
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-RJ/D5BTfkRmRMxMKCW/0OVhx1yUCR3lJaAw9RjfZi+E=' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
        try_files $uri =404;
    }

    # SEO/PageSpeed (19 Agu 2026) — KOK SEVIYEDEKI GORSELLER.
    # Olculdu: /logo.png, /favicon.png ve /icons/* yanitlarinda cache-control
    # HIC YOKTU; logo.png (100 KB, acilis ekraninda preload ediliyor) her
    # ziyarette yeniden iniyordu. Lighthouse: "Est savings of 105 KiB".
    #
    # ADLAR ICERIK HASH'LI DEGIL -> immutable YOK, /assets ile ayni 30 gun.
    # Logo degisirse en fazla 30 gun eski surum gorunur; marka logosu icin
    # kabul edilebilir, uygulama giris dosyalari zaten no-cache.
    location ~* "^/(logo|favicon)\.(png|webp|svg)$" {
        add_header Cache-Control "public, max-age=2592000" always;
        # add_header burada ust bloktakileri iptal ettigi icin tekrarlanir
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-RJ/D5BTfkRmRMxMKCW/0OVhx1yUCR3lJaAw9RjfZi+E=' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
        try_files $uri =404;
    }

    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=2592000" always;
        # add_header burada ust bloktakileri iptal ettigi icin tekrarlanir
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-RJ/D5BTfkRmRMxMKCW/0OVhx1yUCR3lJaAw9RjfZi+E=' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
        try_files $uri =404;
    }

    # 19 Agu 2026 — ERTELENMIS PARCALAR (main.dart.js_<n>.<hash>.part.js).
    # `pro_image_editor` deferred import'a alininca dart2js ana paketten ayri
    # 2,88 MB'lik bir parca uretmeye basladi ve bu ad HICBIR location blogunu
    # tutmuyordu. Cloudflare `.js`i VARSAYILAN olarak onbellege alir; yeni
    # derlemeden sonra ESKI parca servis edilirse dart2js'in
    # `deferredPartHashes` butunluk kontrolu patlar ve gorsel duzenleyici
    # canlida sessizce olur.
    #
    # Ad icerik hash'li (araclar/web_hashla.js) -> ana paketle AYNI muamele.
    # Regex TIRNAK ICINDE: "{12}" tirnaksiz yazilinca nginx [emerg] verir.
    location ~* "^/main\.dart\.js_\d+\.[0-9a-f]{12}\.part\.js$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header burada ust bloktakileri iptal ettigi icin tekrarlanir
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-RJ/D5BTfkRmRMxMKCW/0OVhx1yUCR3lJaAw9RjfZi+E=' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
        try_files $uri =404;
    }

    # GUVENLIK AGI: hash'SIZ parca (web_hashla.js atlanmis ya da hata vermis).
    # Adi sabit oldugu icin onbelleklenirse bayat servis edilir -> no-store.
    # Ustteki genel no-store blogu `main\.dart\.js$` ile bitiyor, bu adi
    # YAKALAMAZ; ayri blok gerekiyor.
    location ~* "^/main\.dart\.js_\d+\.part\.js$" {
        add_header Cache-Control "no-store, must-revalidate" always;
        # add_header burada ust bloktakileri iptal ettigi icin tekrarlanir
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-RJ/D5BTfkRmRMxMKCW/0OVhx1yUCR3lJaAw9RjfZi+E=' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
        try_files $uri =404;
    }

    # SEO 1.5/2: /assets icerik hash'li DEGIL (AssetManifest.bin.json adi sabit
    # kalir) -> immutable YOK, 30 gun. Cloudflare Browser Cache TTL "Respect
    # Existing Headers" degilse CF bunu ezer ve tarayiciya yine 14400 gonderir.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=2592000" always;
        # add_header burada ust bloktakileri iptal ettigi icin tekrarlanir
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-RJ/D5BTfkRmRMxMKCW/0OVhx1yUCR3lJaAw9RjfZi+E=' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
        try_files $uri =404;
    }

    # Paylaşılabilir içerik yolları: link önizleme botu ise OG meta'lı sayfaya,
    # gerçek tarayıcı ise normal Flutter uygulamasına.
    location ~ ^/(icerik|gonderi|kisi|dizi|listeler|sirket)/ {
        error_page 418 = @og;
        if ($og_bot) { return 418; }
        try_files $uri /index.html;
    }
    # SEO 1.4 kalani: ustteki bot regex'i sondaki "/" yuzunden tek parcali
    # yollari yakalamaz, bu yuzden ayri location. "$" siniri onemli:
    # /gozat-bilmemne gibi uydurma yollara SSR uretilmesin.
    # NOT: server.js'te SEO_KESIF_INDEKS=false oldugu surece bu iki sayfa
    # noindex,follow doner (oturumsuz /gozat girise attigi icin indekslemek
    # cloaking olurdu). Flutter bu rotalari oturumsuz acmadan sabiti true YAPMA.
    location ~ ^/(gozat|kesfet|gizlilik)$ {
        error_page 418 = @og;
        if ($og_bot) { return 418; }
        try_files $uri /index.html;
    }

    # Kullanici karari (6 Agu 2026): profiller ASLA indekslenmez. robots.txt
    # taramayi keser; bu baslik tarama yine de olursa indekslemeyi keser.
    # Iki katman celiskili degil, kademelidir.
    # DIKKAT: burada `try_files $uri /index.html` KULLANILMAZ. Ic yonlendirme
    # location eslemesini yeniden calistirir, istek yukaridaki index.html
    # blogua duser ve ORADAKI add_header seti bizimkini komple iptal eder
    # (7 Agu 2026'da olculdu: X-Robots-Tag yanitta hic gorunmedi).
    # `rewrite ... break` URI'yi degistirir ama location'da KALIR.
    location ^~ /kullanici/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        # index.html no-store olmali (Flutter giris dosyasi) + ust bloktaki
        # guvenlik basliklari add_header yuzunden iptal oldugu icin tekrarlanir
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-RJ/D5BTfkRmRMxMKCW/0OVhx1yUCR3lJaAw9RjfZi+E=' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
        rewrite ^ /index.html break;
    }

    location @og {
        proxy_pass http://127.0.0.1:8500/og$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    # SEO 1.4: ana sayfa da botlara SSR. Marka aramasinda ("dizi.jpg") bos
    # Flutter kabugu donmesin. Tam eslesme (=) oldugu icin yalniz "/" yakalanir.
    #
    # DUZELTME (8 Agu 2026) — "/" HIC cache-control ALMIYORDU:
    # Buradaki eski yorum "try_files ic yonlendirme yapar, no-store bloktaki
    # basliklar aynen gelir" diyordu. YANLIS: `try_files /index.html =404`
    # son argumani =404 oldugu icin /index.html'i DOSYA olarak dener ve
    # dogrudan servis eder; ic yonlendirme YOKTUR, location eslemesi TEKRAR
    # CALISMAZ. Sonuc: `/` yanitinda cache-control hic yoktu (olculdu) ve
    # tarayici SPA kabugunu sezgisel olarak onbellege alabiliyordu. Hash'li
    # paket adi her dagitimda degistigi ve eskisi origin'den silindigi icin
    # bu, bayat kabuk -> bozuk sayfa demekti. `/index.html` dogru davraniyordu,
    # yalniz kok yol kacmisti (6 Agu SEO isinden kalma gerileme).
    # Cozum: basliklari BURADA acikca yaz. add_header ust bloktakileri iptal
    # ettigi icin guvenlik basliklari da tekrarlanir.
    location = / {
        error_page 418 = @og_ana;
        if ($og_bot) { return 418; }
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-RJ/D5BTfkRmRMxMKCW/0OVhx1yUCR3lJaAw9RjfZi+E=' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
        try_files /index.html =404;
    }
    # rewrite + URI'siz proxy_pass: adlandirilmis location'da proxy_pass STATIK
    # URI parcasi alamaz (@og'daki /og$uri degisken tasidigi icin gecerli).
    location @og_ana {
        rewrite ^ /og/ana break;
        proxy_pass http://127.0.0.1:8500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    # Sitemap (SEO-PLANI 0.2): Node uretir, Flutter kabugu YUTMASIN. Bu yuzden
    # "location /" try_files kuralindan ONCE gelir. add_header YOK -> sunucu
    # duzeyindeki guvenlik basliklari (HSTS, nosniff, X-Frame-Options,
    # Referrer-Policy, Permissions-Policy) oldugu gibi devralinir.
    # robots.txt: gercek dosya servis edilsin. Yoksa "location /" Flutter
    # index.html'ini basiyor ve Cloudflare yonetilen robots.txt'in sonuna
    # ham HTML ekleniyordu. add_header YOK: ust seviye guvenlik basliklari
    # devralinsin (bir location'a add_header yazmak hepsini iptal eder).
    # robots.txt artik Node'dan servis ediliyor (backend/robots.txt imajda).
    # Gerekce IndexNow anahtariyla ayni: Flutter web dagitimi /var/www/dizijpg'yi
    # eziyordu ve dosyanin depoda kaynagi yoktu, her degisiklik izsiz kaliyordu.
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8500/robots.txt;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # IndexNow sahiplik anahtari. Node uretir ki Flutter web dagitimi (build/web
    # kopyalamasi) dosyayi silemesin. Anahtar GIZLI DEGIL; protokol geregi
    # herkese acik servis edilir.
    location = /b81003368ba94ba0ff8597b05833fe8d.txt {
        proxy_pass http://127.0.0.1:8500/b81003368ba94ba0ff8597b05833fe8d.txt;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8500/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location ~ ^/sitemap-[A-Za-z0-9-]+\.xml$ {
        proxy_pass http://127.0.0.1:8500$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ---- HASSAS YOLLAR: SPA yedegine DUSMESIN (10 Agu 2026) ----
    # SORUN: "location /" bilinmeyen HER yolu index.html'e ceviriyordu, bu
    # yuzden /.env, /.git/config, /server.js gibi yollar 200 donuyordu.
    # Icerik SIZMIYORDU (gelen sey index.html idi) ama 200 yaniti "burada bir
    # dosya var" izlenimi verir; tarama botlari bunu isaret sayip uzerine gider.
    # Artik 404 donuyor.
    # .well-known DISARIDA: ACME sertifika dogrulamasi ve security.txt oradan gecer.
    # NOT: bilerek add_header YOK -> sunucu duzeyindeki guvenlik basliklari
    # devralinsin (bir location'a add_header yazmak hepsini iptal eder).
    location ~ ^/\.(?!well-known/) {
        access_log off;
        return 404;
    }

    # Depoya ait dosya adlari: web kokunde bulunmalari zaten beklenmiyor,
    # ama yanlislikla kopyalanirsa da servis edilmesinler.
    location ~* ^/(docker-compose\.ya?ml|Dockerfile|package(-lock)?\.json|yarn\.lock|server\.js|pubspec\.ya?ml|sema\.sql)$ {
        access_log off;
        return 404;
    }

    # Hicbir kosulda servis edilmemesi gereken uzantilar.
    # DIKKAT: .js/.json/.html/.wasm/.png BILEREK YOK - uygulama onlardan olusuyor.
    location ~* \.(env|sql|sqlite|db|jks|keystore|pem|key|p12|pfx|bak|swp|old|log|ini|conf|gpg)$ {
        access_log off;
        return 404;
    }

    location / {
        try_files $uri $uri/ @spa;
    }

    # SEO md.58 (15 Agu 2026) — SOFT 404 KAPATMA.
    # SPA geri donusu: yalniz DISKTE OLMAYAN yollar buraya duser (statik
    # dosyalar yukarida `try_files $uri` ile zaten servis edildi, yani bot da
    # main.<hash>.dart.js / favicon / assets dosyalarini almaya devam eder).
    # Bot ise Node'a tasinir; server.js BOT_ROTALARI tablosu karar verir:
    #   · tabloda VAR ama SSR yok -> 200 + noindex,follow
    #   · tabloda YOK             -> GERCEK 404 + noindex
    # INSAN TRAFIGI DEGISMEZ: $og_bot disindaki herkes Flutter kabugunu alir.
    # GERI ALMA: asagidaki `if ($og_bot) { return 418; }` satirini sil, reload.
    location @spa {
        error_page 418 = @og;
        if ($og_bot) { return 418; }
        try_files /index.html =404;
    }

    # Admin paneli ve uclari: kisit NGINX duzeyinde. Izinsiz istek Node'a HIC
    # ulasmaz. 403 yerine 404 doner ki panelin varligi ele verilmesin.
    # Burada bilerek add_header YOK: olsaydi sunucu duzeyindeki tum guvenlik
    # basliklarini (HSTS, X-Frame-Options, ...) iptal ederdi; yoklugunda devralinir.
    # proxy_pass URI'si /admin: /api/admin/ozet -> /admin/ozet (eski /api/ blogu
    # ile ayni esleme).
    location ^~ /api/admin {
        if ($dizijpg_admin_izinli = 0) { return 404; }

        # Panele ozel CSP (21 Agu 2026): sunucu seviyesindeki site CSP'si
        # panelin SATIR-ICI betiklerini ve unpkg.com'daki globe.gl'i
        # engelliyor, panel bombos aciliyordu (tek gorunen statik baslikti).
        # unsafe-inline burada kabul: sayfaya yalniz beyaz listedeki IP'ler
        # ulasabiliyor (ustteki 404). add_header location'da tanimlaninca
        # sunucu seviyesindekiler MIRAS KALMAZ; guvenlik basliklari tekrar edildi.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://unpkg.com https://image.tmdb.org https://*.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-store" always;

        client_max_body_size 105m;
        proxy_pass http://127.0.0.1:8500/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # HARF DUYARLILIGI KAPISI (guvenlik denetimi 2026-08-17 §4.1).
    #
    # BULGU: nginx onek eslemesi HARF DUYARLIDIR, Express yonlendirmesi
    # varsayilan olarak DEGILDIR. `/api/Admin/ozet` yukaridaki `^~ /api/admin`
    # blogunu ISKALIYOR, genel `/api/` blogundan Node'a gidiyor ve Express onu
    # `/admin/ozet` rotasiyla esliyordu. Olculdu:
    #     /api/admin/ozet -> 404 (nginx kesti)
    #     /api/Admin/ozet -> 403 {"hata":"Erisim reddedildi"}  <-- EXPRESS
    # Veri sizmiyordu (adminKisit tutuyor, X-Real-IP her iki blokta da
    # $remote_addr ile eziliyor) ama iki katmandan BIRI dusuyordu:
    #   1) panelin VARLIGI ele veriliyordu (404 tasariminin amaci tam da buydu),
    #   2) `adminKisit` X-Admin-Token'i HER IP'den kabul eder; normal yolda
    #      nginx IP kapisi ikinci engeldir, bu yolda o engel YOKTU. Token
    #      sizsaydi panel dunyanin her yerinden acilirdi.
    #
    # NEDEN `return 404` VE NEDEN YUKARIDAKI BLOK REGEX YAPILMADI: regex ile
    # tanimli bir location'da `proxy_pass` URI TASIYAMAZ ("proxy_pass cannot
    # have URI part in location given by regular expression") — yukaridaki blok
    # `proxy_pass ... /admin;` ile yolu yeniden yaziyor, yani regex'e cevrilemez.
    #
    # NEDEN MESRU KUCUK HARFLI YOLU BOZMAZ: nginx once en uzun oneki bulur;
    # onek `^~` tasiyorsa regex'lere HIC BAKMAZ. `/api/admin/...` yukaridaki
    # bloga kilitlenir ve buraya dusmez. Regex'ler yalniz `^~` eslesmeyince
    # (yani farkli yazimda) ve duz `/api/` onekinden ONCE degerlendirilir.
    location ~* ^/api/admin {
        access_log off;
        return 404;
    }

    # dizi.jpg API (Docker, yalnizca yerel 8500)
    location /api/ {
        client_max_body_size 105m;
        proxy_pass http://127.0.0.1:8500/;
        proxy_set_header Host $host;
        # GÜVENLİK: istemcinin gönderdiği IP başlıklarını güvenilir $remote_addr
        # ile EZ. Böylece Cloudflare atlanıp origin'e doğrudan bağlanan biri
        # sahte CF-Connecting-IP / X-Forwarded-For ile admin IP kontrolünü
        # (veya hız limitini) atlatamaz. $remote_addr real_ip modülü sonrası
        # gerçek istemci IP'sidir.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # D2 (12 Agu 2026): Node'un X-Accel-Redirect ile isaret ettigi medyayi
    # sendfile'la yolla. Guvenlik (imza, ozel medya) NODE'da verilir; bu
    # bloklara yalniz Node yanitindaki baslikla girilir (`internal` -> disaridan
    # /ic-dosya/... istenirse 404). Medya koku /srv/dizijpg-veri: docker volume
    # _data'sina bind mount (fstab'da; www-data /var/lib/docker'i OKUYAMAZ,
    # o yuzden bu dolambac). Content-Type + Cache-Control Node'dan gelir ve
    # ic yonlendirmede KORUNUR — buraya types/add_header Cache-Control EKLEME
    # (cift baslik olur). add_header olmadigi icin server duzeyi basliklar
    # (HSTS, nosniff, ...) miras alinir.
    location /ic-dosya/ {
        internal;
        alias /srv/dizijpg-veri/;
    }

    # Ozel (DM) medya: Node X-Robots-Tag basar ama nginx ic yonlendirme beyaz
    # listesinde olmadigi icin duser -> burada yeniden. DIKKAT: add_header
    # yazinca server duzeyindekiler bu blok icin iptal olur, o yuzden hepsi
    # birebir kopyalandi (kaynak: bu dosyanin server duzeyi, satir ~104-129).
    location /ic-ozel/ {
        internal;
        alias /srv/dizijpg-veri/medya/;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-RJ/D5BTfkRmRMxMKCW/0OVhx1yUCR3lJaAw9RjfZi+E=' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://image.tmdb.org https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data:; connect-src 'self' https://accounts.google.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-rapor" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
    }
}
