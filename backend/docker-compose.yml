# dizi.jpg — izole yığın. Mevcut servislere (CRM, host PG 5432, Redis 6379) dokunmaz.
services:
  db:
    image: postgres:16-alpine
    container_name: dizijpg-db
    restart: unless-stopped
    # D3 (12 Ağu 2026): varsayılanlar 131 GB RAM'li makinede cimriydi
    # (shared_buffers ~160MB, work_mem 4MB, random_page_cost 4 = döner disk
    # varsayımı). Makine paylaşımlı (başka projeler var) — kasıtlı ölçülü:
    # 1GB tampon bugünkü 359MB veriyi tamamen tutar, büyümeye de yer var.
    command: postgres -c shared_buffers=1GB -c effective_cache_size=6GB -c work_mem=16MB -c maintenance_work_mem=256MB -c random_page_cost=1.1
    environment:
      POSTGRES_DB: dizijpg
      POSTGRES_USER: dizijpg
      POSTGRES_PASSWORD: ${DB_SIFRE}
    volumes:
      - dizijpg_pg:/var/lib/postgresql/data
      - ./sema.sql:/docker-entrypoint-initdb.d/01-sema.sql:ro
    # C2: log boyut sınırı. Sınırsız json-file logu diski doldurup HER ŞEYİ
    # durdurabilir (sessiz disk tuzağı). 50m × 5 = servis başına en çok 250 MB.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Dışarı port AÇMIYORUZ; yalnızca compose ağı içinden erişilir.

  api:
    build: .
    container_name: dizijpg-api
    restart: unless-stopped
    # B2: zarif kapanma payı. Varsayılan grace 10 sn; server.js uçuştaki
    # isteklere KAPANMA_AZAMI_MS (15 sn) tanıyor. Grace < azami olursa Docker
    # tam kapanma ortasında SIGKILL basar ve istekler yine yarıda kesilir —
    # bu satır o tuzağı kapatır (test/kapanma.test.js iki değeri kilitler).
    stop_grace_period: 30s
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://dizijpg:${DB_SIFRE}@db:5432/dizijpg
      JWT_SECRET: ${JWT_SECRET}
      TMDB_TOKEN: ${TMDB_TOKEN}
      # Özel mesajların DURAĞAN şifrelemesi (AES-256-GCM, backend/kripto.js).
      # base64, 32 bayt: `openssl rand -base64 32`.
      # YOKSA API AÇILMAZ (bilinçli: sessizce düz metne düşmek en tehlikelisi).
      # Bilerek şifresiz çalışılacaksa .env'e MESAJ_SIFRELEME=kapali yazılır.
      # ANAHTARI KAYBETMEK = TÜM MESAJLARI KAYBETMEK. Parola yöneticisine kopyala.
      MESAJ_ANAHTARI: ${MESAJ_ANAHTARI:-}
      # Anahtar döndürülünce ESKİ anahtar buraya taşınır (yalnız OKUMA için),
      # kimlikli ve virgülle ayrılmış: "k1:<base64>,k2:<base64>".
      MESAJ_ANAHTARI_ESKI: ${MESAJ_ANAHTARI_ESKI:-}
      MESAJ_SIFRELEME: ${MESAJ_SIFRELEME:-}
      # ---- Sesli/görüntülü arama ----
      # TURN kimlik bilgisi üretimi (coturn `use-auth-secret` kipi). Bu satır
      # UNUTULDUĞU için 9 Ağu'da API "TURN_SIR tanımsız" uyarısıyla açıldı:
      # .env'de değişken VARDI ama compose onu konteynere AKTARMIYORDU, yani
      # aramalar sessizce yalnız STUN'a düşecekti (röle gerektiren ~%20 arama
      # hiç bağlanmaz, kullanıcı bunu "uygulama bozuk" diye okur).
      TURN_SIR: ${TURN_SIR:-}
      # TURN sunucusunun alan adı; verilmezse kod turn.dizijpg.com varsayar.
      TURN_ALAN: ${TURN_ALAN:-}
      # Kırılacak cam: DB'deki `ayarlar` bayraklarını EZER. Fatura sürprizinde
      # veritabanına erişilemese bile aramayı kapatmanın tek kaldıracı.
      ARAMA_KAPALI: ${ARAMA_KAPALI:-}
      ARAMA_GORUNTULU: ${ARAMA_GORUNTULU:-}
      ARAMA_TRAFIK_ESIK_GB: ${ARAMA_TRAFIK_ESIK_GB:-}
      PORT: 8500
      # D1 (12 Ağu 2026): Node kümeleme. NODE_ISCI=0 geri dönüş anahtarıdır
      # (eski tek-süreç davranışı). İşçi başına pg havuzu floor(80/N) —
      # kume_yardimci.js hesaplar, PG_HAVUZ_MAX ezebilir ama tavana kırpılır.
      # ARAMA_IC_PORT (varsayılan PORT+1) konteyner içi 127.0.0.1 — publish YOK.
      NODE_ISCI: ${NODE_ISCI:-4}
      PG_HAVUZ_MAX: ${PG_HAVUZ_MAX:-}
      ARAMA_IC_PORT: ${ARAMA_IC_PORT:-}
      # D2 (12 Ağu 2026): medya gönderimi nginx'e (X-Accel-Redirect).
      # 0/boş = eski yol (Node okur). nginx'te /ic-dosya + /ic-ozel internal
      # blokları ve /srv/dizijpg-veri bind mount'u gerektirir (fstab'da).
      MEDYA_XACCEL: ${MEDYA_XACCEL:-1}
      # Disk eşiği kapısı (güvenlik denetimi 2026-08-17 §3.1). Boş alan bu
      # değerin altına inince yükleme uçları 507 döner. Varsayılan 10 GB;
      # `0` kapıyı tamamen açar (kırılacak cam).
      # BU SATIR ŞART: .env'de değişken olsa bile compose onu konteynere
      # AKTARMAZSA kod varsayılana düşer ve ayar SESSİZCE etkisiz kalır —
      # TURN_SIR'ın 9 Ağu'da düştüğü tuzağın aynısı (yukarıdaki nota bak).
      DISK_ESIK_GB: ${DISK_ESIK_GB:-}
      AVATAR_DIZIN: /veri/avatarlar
      MEDYA_DIZIN: /veri/medya
      MAIL_HOST: host.docker.internal
      MAIL_PORT: "25"
      MAIL_FROM: "dizi.jpg <noreply@dizijpg.com>"
      # Gelen kutuları (admin panelindeki Mailler sekmesi okur)
      MAIL_KUTU_KOK: /mail
      # Yedek durumu + elle yedek (pg_dump çıktısı buraya yazılır)
      YEDEK_DIZIN: /yedekler
      YEDEK_GUNLUK: /yedek.log
      # Admin paneli erişimi (.env'den): izinli IP listesi + yedek token.
      # Boş kalırsa /admin ve /admin/* HERKESE 403 döner.
      ADMIN_IPLER: ${ADMIN_IPLER}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - dizijpg_dosyalar:/veri
      # FCM servis hesabı: yoksa push sessizce kapanır (log: "FCM push kapalı").
      - ./firebase-admin.json:/app/firebase-admin.json:ro
      # Host'taki Maildir'ler SALT-OKUNUR: panel gelen maili gösterir ama
      # API hiçbir koşulda posta kutusunu değiştiremez/silemez.
      - /home/admin/Maildir:/mail/admin:ro
      - /home/noreply/Maildir:/mail/noreply:ro
      # Yedekler: panel gecelik yedeğin durumunu okur ve elle yedek ALIR.
      # Yazılabilir olmalı (pg_dump çıktısı buraya düşer); kod bu dizinden
      # dosya SİLMEZ, yalnızca ekler.
      - ./yedekler:/yedekler
      - ./yedek.log:/yedek.log:ro
    extra_hosts:
      # Konteynerden host'taki Postfix'e erişim (mail gönderimi)
      - "host.docker.internal:host-gateway"
    ports:
      # Yalnızca yerelden: dışarıya nginx üzerinden (SSL ile) açılır.
      - "127.0.0.1:8500:8500"
    # C2: log boyut sınırı (bkz. db servisi). API JSON hata logu buraya akıyor;
    # 50m × 5 = en çok 250 MB, eskisi otomatik döner (dönderme).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  dizijpg_pg:
  dizijpg_dosyalar:
