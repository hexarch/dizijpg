# dizi.jpg — izole yığın. Mevcut servislere (CRM, host PG 5432, Redis 6379) dokunmaz.
services:
  db:
    image: postgres:16-alpine
    container_name: dizijpg-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dizijpg
      POSTGRES_USER: dizijpg
      POSTGRES_PASSWORD: ${DB_SIFRE}
    volumes:
      - dizijpg_pg:/var/lib/postgresql/data
      - ./sema.sql:/docker-entrypoint-initdb.d/01-sema.sql:ro
    # Dışarı port AÇMIYORUZ; yalnızca compose ağı içinden erişilir.

  api:
    build: .
    container_name: dizijpg-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://dizijpg:${DB_SIFRE}@db:5432/dizijpg
      JWT_SECRET: ${JWT_SECRET}
      TMDB_TOKEN: ${TMDB_TOKEN}
      PORT: 8500
      AVATAR_DIZIN: /veri/avatarlar
      MEDYA_DIZIN: /veri/medya
      MAIL_HOST: host.docker.internal
      MAIL_PORT: "25"
      MAIL_FROM: "dizi.jpg <noreply@dizijpg.com>"
      # Gelen kutuları (admin panelindeki Mailler sekmesi okur)
      MAIL_KUTU_KOK: /mail
      # Yedek durumu + elle yedek (pg_dump çıktısı buraya yazılır)
      YEDEK_DIZIN: /yedekler
      YEDEK_GUNLUK: /yedek.log
      # Admin paneli erişimi (.env'den): izinli IP listesi + yedek token.
      # Boş kalırsa /admin ve /admin/* HERKESE 403 döner.
      ADMIN_IPLER: ${ADMIN_IPLER}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - dizijpg_dosyalar:/veri
      # FCM servis hesabı: yoksa push sessizce kapanır (log: "FCM push kapalı").
      - ./firebase-admin.json:/app/firebase-admin.json:ro
      # Host'taki Maildir'ler SALT-OKUNUR: panel gelen maili gösterir ama
      # API hiçbir koşulda posta kutusunu değiştiremez/silemez.
      - /home/admin/Maildir:/mail/admin:ro
      - /home/noreply/Maildir:/mail/noreply:ro
      # Yedekler: panel gecelik yedeğin durumunu okur ve elle yedek ALIR.
      # Yazılabilir olmalı (pg_dump çıktısı buraya düşer); kod bu dizinden
      # dosya SİLMEZ, yalnızca ekler.
      - ./yedekler:/yedekler
      - ./yedek.log:/yedek.log:ro
    extra_hosts:
      # Konteynerden host'taki Postfix'e erişim (mail gönderimi)
      - "host.docker.internal:host-gateway"
    ports:
      # Yalnızca yerelden: dışarıya nginx üzerinden (SSL ile) açılır.
      - "127.0.0.1:8500:8500"

volumes:
  dizijpg_pg:
  dizijpg_dosyalar:
