name: dizijpg
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# DİKKAT: sürümü artırınca lib/api.dart'taki Api.surum'u da güncelle.
version: 1.56.0+104

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  intl: any
  # Push bildirimleri (yalnız Android/iOS; web'de devre dışı)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Google ile giriş: Android id_token, web'de GIS düğmesinin id_token'ı
  # → /auth/google
  google_sign_in: ^6.3.0
  # Webde Google'ın KENDİ düğmesi (`renderButton`) için DOĞRUDAN bağımlılık —
  # paketin kendi belgesi bunu şart koşuyor. Web dışı derlemelere girmez;
  # kod da `google_kapisi.dart` içinde koşullu import ile ayrılmıştır.
  google_sign_in_web: ^0.12.4+4
  # Bağlantı türü (Wi-Fi / mobil veri) → veri tasarrufu kararları
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^18.0.1
  # Sesli mesaj: kayıt + oynatma
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  # Android SİSTEM Fotoğraf Seçici'si (ACTION_PICK_IMAGES) için DOĞRUDAN
  # gerekli: `image_picker_android.useAndroidPhotoPicker` VARSAYILAN OLARAK
  # FALSE ve o bayrak açılmazsa paket ACTION_GET_CONTENT'e düşer
  # (image_picker_android-0.8.13+19/lib/image_picker_android.dart:23 +
  # ImagePickerDelegate.java:317). Yalnız `foto_secici_io.dart` içinden,
  # koşullu içe aktarmayla kullanılır. Sürüm KİLİTLENMEZ: image_picker'ın
  # kendi çözdüğü uygulamayla aynı sürüm olmalı.
  image_picker_android: ^0.8.13+19
  image_picker_platform_interface: ^2.11.1
  video_player: ^2.13.0
  # 11.x AGP 9'da Kotlin'i kendisi uygulamıyor (builtInKotlin=false ile derlenmiyor); 10.x'te sabit
  file_picker: 10.3.10
  go_router: ^17.3.0
  flutter_svg: ^2.2.0
  crop_your_image: ^1.1.0
  # SONDAJ (7 Ağu 2026): görsel editör. Saf Dart — native modül yok, AGP 9'da
  # kırılan paketlerimizin hepsi native yüzünden kırılmıştı. Derleme geçmezse
  # bu satır GERİ ALINIR; ffmpeg tabanlı alternatifler zaten elendi (emekli
  # paket + GPL lisansı + 39-109 MB boyut).
  pro_image_editor: ^13.3.0
  # SONDAJ (7 Ağu 2026): video editör (trim + sıkıştırma). Motor: Android
  # Media3 Transformer 1.10.1 / iOS-macOS AVFoundation — ffmpeg YOK, GPL YOK.
  # AGP 9 kanıtı: PR #172 (7 Tem 2026) "keeps it building under AGP 9+",
  # örnek uygulamanın gradle.properties'i bizimkiyle birebir aynı
  # (builtInKotlin=false, newDsl=false). Web'de trim desteklenmiyor →
  # lib/video_islem_stub.dart bu paketi HİÇ import etmez.
  pro_video_editor: ^2.11.1
  # Marka ikonu FONTU (SimpleIcons.ttf) için gerekli — bağımlılık KALMALI.
  # Ama Dart tarafında `SimpleIcons` sınıfı KULLANILMAZ: paket 3.442 ikonu
  # `static const Map<String, IconData> values` haritasında topladığı için
  # sınıfı bir kez import etmek ikon budayıcının 3.442 glifin TAMAMINI
  # "kullanılıyor" saymasına yol açıyordu (1,46 MB fontun yalnız %6,8'i
  # kırpılıyordu). Kullandığımız 18 ikon lib/ikonlar/sosyal_ikonlar.dart
  # içinde yerel `const IconData` olarak tanımlı; font 6.044 bayta iniyor.
  # Ayrıntı ve regresyon kilidi: test/sosyal_ikonlar_test.dart
  simple_icons: ^16.23.0
  url_launcher: ^6.3.2
  # Telefonun kendi paylaşım sayfası (WhatsApp, e-posta, Instagram...)
  share_plus: ^10.1.4
  pointer_interceptor: ^0.10.1+2
  visibility_detector: ^0.4.0+2
  # Sesli/görüntülü arama (WebRTC). SÜRÜM KİLİTLİ (^ YOK): 1.6.0 sondajı
  # geçti — AGP 9 ile derleniyor, MIT lisanslı, arm64 APK'ya +11,5 MiB
  # ekliyor. Bir üst yama sürümü native Android/iOS kodu taşıdığı için
  # kendiliğinden yükselmesi derlemeyi sessizce kırabilir; yükseltme
  # BİLİNÇLİ bir karar olsun.
  #
  # Medya DTLS-SRTP ile UÇTAN UCA şifreli akar; sunucu yalnız SDP/ICE
  # alışverişine aracılık eder ve onları da diske yazmaz
  # (backend/ARAMA-API-SOZLESMESI.md §0).
  flutter_webrtc: 1.6.0
  lottie: ^3.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices.
  flutter_lints: ^6.0.0

# Uygulama başlatıcı ikonu: marka logosu (siyah zemin + DIZIJPG).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/google_g.svg
    - assets/tepkiler/
    # Giden/gelen arama zil (ringback) sesi. 450 Hz, 2 sn cal/4 sn sus, mono
    # 8 kHz WAV; audioplayers ReleaseMode.loop ile donguye alinir.
    - assets/sesler/
    # Ülke bayrakları (profil ülke satırı). 116 PNG, toplam ~42 KB.
    # Emoji bayrak KULLANILMIYOR: Windows hiç çizmiyor, eski Android'de eksik.
    - assets/bayraklar/

  # Marka fontu: Poppins (Latin + Türkçe). Latin-dışı diller sistem fontuna düşer.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
