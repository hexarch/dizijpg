name: dizijpg
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# DİKKAT: sürümü artırınca lib/api.dart'taki Api.surum'u da güncelle.
version: 1.112.0+178

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  intl: any
  # Push bildirimleri (yalnız Android/iOS; web'de devre dışı)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Google ile giriş: Android id_token, web'de GIS düğmesinin id_token'ı
  # → /auth/google
  google_sign_in: ^6.3.0
  # Webde Google'ın KENDİ düğmesi (`renderButton`) için DOĞRUDAN bağımlılık —
  # paketin kendi belgesi bunu şart koşuyor. Web dışı derlemelere girmez;
  # kod da `google_kapisi.dart` içinde koşullu import ile ayrılmıştır.
  google_sign_in_web: ^0.12.4+4
  # Bağlantı türü (Wi-Fi / mobil veri) → veri tasarrufu kararları
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^18.0.1
  # Sesli mesaj: kayıt + oynatma
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  # Android SİSTEM Fotoğraf Seçici'si (ACTION_PICK_IMAGES) için DOĞRUDAN
  # gerekli: `image_picker_android.useAndroidPhotoPicker` VARSAYILAN OLARAK
  # FALSE ve o bayrak açılmazsa paket ACTION_GET_CONTENT'e düşer
  # (image_picker_android-0.8.13+19/lib/image_picker_android.dart:23 +
  # ImagePickerDelegate.java:317). Yalnız `foto_secici_io.dart` içinden,
  # koşullu içe aktarmayla kullanılır. Sürüm KİLİTLENMEZ: image_picker'ın
  # kendi çözdüğü uygulamayla aynı sürüm olmalı.
  image_picker_android: ^0.8.13+19
  image_picker_platform_interface: ^2.11.1
  video_player: ^2.13.0
  # 11.x AGP 9'da Kotlin'i kendisi uygulamıyor (builtInKotlin=false ile derlenmiyor); 10.x'te sabit
  file_picker: 10.3.10
  go_router: ^17.3.0
  flutter_svg: ^2.2.0
  crop_your_image: ^1.1.0
  # SONDAJ (7 Ağu 2026): görsel editör. Saf Dart — native modül yok, AGP 9'da
  # kırılan paketlerimizin hepsi native yüzünden kırılmıştı. Derleme geçmezse
  # bu satır GERİ ALINIR; ffmpeg tabanlı alternatifler zaten elendi (emekli
  # paket + GPL lisansı + 39-109 MB boyut).
  pro_image_editor: ^13.3.0
  # SONDAJ (7 Ağu 2026): video editör (trim + sıkıştırma). Motor: Android
  # Media3 Transformer 1.10.1 / iOS-macOS AVFoundation — ffmpeg YOK, GPL YOK.
  # AGP 9 kanıtı: PR #172 (7 Tem 2026) "keeps it building under AGP 9+",
  # örnek uygulamanın gradle.properties'i bizimkiyle birebir aynı
  # (builtInKotlin=false, newDsl=false). Web'de trim desteklenmiyor →
  # lib/video_islem_stub.dart bu paketi HİÇ import etmez.
  pro_video_editor: ^2.11.1
  # Marka ikonu FONTU (SimpleIcons.ttf) için gerekli — bağımlılık KALMALI.
  # Ama Dart tarafında `SimpleIcons` sınıfı KULLANILMAZ: paket 3.442 ikonu
  # `static const Map<String, IconData> values` haritasında topladığı için
  # sınıfı bir kez import etmek ikon budayıcının 3.442 glifin TAMAMINI
  # "kullanılıyor" saymasına yol açıyordu (1,46 MB fontun yalnız %6,8'i
  # kırpılıyordu). Kullandığımız 18 ikon lib/ikonlar/sosyal_ikonlar.dart
  # içinde yerel `const IconData` olarak tanımlı; font 6.044 bayta iniyor.
  # Ayrıntı ve regresyon kilidi: test/sosyal_ikonlar_test.dart
  simple_icons: ^16.23.0
  url_launcher: ^6.3.2
  # Android/iOS fragman gömme (YouTube uygulamasına kaçmadan). Birinci
  # parti; webde koşullu import yüzünden bu dosyalar derlenmez.
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.1
  webview_flutter_wkwebview: ^3.23.0
  # Telefonun kendi paylaşım sayfası (WhatsApp, e-posta, Instagram...)
  share_plus: ^10.1.4
  pointer_interceptor: ^0.10.1+2
  visibility_detector: ^0.4.0+2
  # YouTube iframe (fragman_gom_web.dart). Transitive duruyordu; doğrudan
  # import edildiği için bağımlılık listesinde de dursun.
  web: ^1.1.1
  # Sesli/görüntülü arama (WebRTC). SÜRÜM KİLİTLİ (^ YOK): 1.6.0 sondajı
  # geçti — AGP 9 ile derleniyor, MIT lisanslı, arm64 APK'ya +11,5 MiB
  # ekliyor. Bir üst yama sürümü native Android/iOS kodu taşıdığı için
  # kendiliğinden yükselmesi derlemeyi sessizce kırabilir; yükseltme
  # BİLİNÇLİ bir karar olsun.
  #
  # Medya DTLS-SRTP ile UÇTAN UCA şifreli akar; sunucu yalnız SDP/ICE
  # alışverişine aracılık eder ve onları da diske yazmaz
  # (backend/ARAMA-API-SOZLESMESI.md §0).
  flutter_webrtc: 1.6.0
  lottie: ^3.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # CSP satır içi betik hash bekçisi (test/csp_satir_ici_hash_test.dart).
  # Geçişli bağımlılık olarak zaten geliyordu ama TEST doğrudan import ediyor;
  # bildirilmemiş import bir gün üst paket onu bırakınca sessizce kırılırdı.
  crypto: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices.
  flutter_lints: ^6.0.0

# Uygulama başlatıcı ikonu: marka logosu (siyah zemin + DIZIJPG).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/google_g.svg
    - assets/tepkiler/
    # Giden/gelen arama zil (ringback) sesi. 450 Hz, 2 sn cal/4 sn sus, mono
    # 8 kHz WAV; audioplayers ReleaseMode.loop ile donguye alinir.
    - assets/sesler/
    # Ülke bayrakları (profil ülke satırı). 116 PNG, toplam ~42 KB.
    # Emoji bayrak KULLANILMIYOR: Windows hiç çizmiyor, eski Android'de eksik.
    - assets/bayraklar/

    # --- ALTYAZI FONTLARI: 29 aile / 56 dosya, 3,39 MB ham — 20 Agu 2026 ---
    # NEDEN `assets:` ALTINDA, `fonts:` ALTINDA DEGIL (OLCULDU, TAHMIN DEGIL):
    # `fonts:` altindaki her aile ACILISTA TOPLUCA iner. Flutter web motoru
    # FontManifest.json'i okuyup butun aileleri `fontCollection.loadAssetFonts`
    # ile cekiyor; "kullanilinca insin" diye bir sey YOK.
    # Kanit (20 Agu 2026): pubspec'e hicbir Dart kodunun kullanmadigi 3 deneme
    # fontu eklendi, derlenip `python3 -m http.server` ile yayinlandi; sunucu
    # erisim gunlugunde ucu de acilista indi — ustelik AssetManifest.bin.json'DAN
    # ONCE, yani ilk kareyi bloke eden yolda. 30 aile `fonts:` altinda birakilinca
    # olculen acilis yuku: 56 dosya, 3.557.480 bayt ham / 1.586.787 bayt brotli.
    # `assets:` girdileri TEMBELDIR: pakete girer ama acilista INMEZ. Font yalniz
    # kullanici onu sectiginde `lib/altyazi_font.dart` icindeki FontLoader ile
    # yuklenir — acilis maliyeti 0.
    # BURAYI `fonts:` ALTINA GERI TASIMAYIN; 1,5 MB'lik acilis gerilemesi demek.
    #
    # Dosyalarin uretimi: google/fonts deposundan (hepsi OFL 1.1, lisanslar
    # assets/fonts/LISANSLAR/ altinda), degisken olanlar fontTools.varLib.instancer
    # ile wght=400/600 statik ornege cevrildi, sonra pyftsubset ile Latin+Latin-Ext
    # (U+0000-00FF,U+0100-017F,U+0180-024F,U+2000-206F,U+20A0-20BF,U+2122) alt
    # kumesi + --no-hinting. Turkce ı İ ğ Ğ ş Ş ç Ç ö Ö ü Ü 56 dosyanin hepsinde
    # alt kumeleme SONRASI dogrulandi. Anton/Bebas Neue tek agirlikli (yalniz 400),
    # PT Serif'te 600 yok -> 700. Dosya adlari lib/altyazi_font.dart'taki
    # haritayla BIREBIR eslesmeli; test/altyazi_font_test.dart bunu dogruluyor.
    - assets/fonts/altyazi/

  # Marka fontu: Poppins (Latin + Türkçe). Latin-dışı diller sistem fontuna düşer.
  #
  # --- ALTI AĞIRLIK DA GEREKLİ: SİLMEYİN (19 Ağu 2026, PageSpeed incelemesi) ---
  # Flutter web CanvasKit, burada tanımlı BÜTÜN fontları ilk kareden ÖNCE indirir
  # (FontManifest.json -> fontCollection.loadAssetFonts). PageSpeed bu yüzden altı
  # TTF'i birden `High` öncelikli, toplam ~385 KB (brotli) olarak görüyor. Ağırlık
  # silmek cazip görünüyor; ÖLÇÜLDÜ, hiçbiri boşta değil:
  #
  #   w400 Regular   : `grep FontWeight.w400 lib` YALNIZ 2 sonuç verir AMA bu
  #                    yanıltıcıdır — w400, Material'ın body*/display*/headline*/
  #                    titleLarge varsayılanıdır (Typography.englishLike2021),
  #                    yani stil verilmemiş HER metin bu dosyayı kullanır.
  #   w500 Medium    : 10 açık kullanım + Material'ın titleMedium/titleSmall/
  #                    labelLarge/labelMedium/labelSmall varsayılanı. Yani her
  #                    ListTile başlığı, her TextButton/OutlinedButton etiketi,
  #                    sekme etiketleri. Silinirse uygulamanın tüm düğme ve liste
  #                    yazıları inceleşir — "10 kullanım, atarız" TUZAK budur.
  #   w600 SemiBold  : 34 açık kullanım; biri tema.dart'taki navigationBarTheme
  #                    etiket stili, yani alt menü her ekranda buna basıyor.
  #   w700 Bold      : 93 açık kullanım.
  #   w800 ExtraBold : 118 açık kullanım (EN ÇOK); ikisi tema.dart'ta —
  #                    appBarTheme başlığı ve filledButtonTheme metni.
  #                    Uygulamanın baskın vurgu ağırlığı.
  #   w900 Black     : 20 açık kullanım, 15 dosyada; hepsi büyük punto vurgu
  #                    (profil sayaçları, izleme istatistiği 34 px, karşılama
  #                    24 px). Silinse metin KAYBOLMAZ (CanvasKit en yakın
  #                    ağırlığa, w800'e düşürür) ama w800 zaten baskın ağırlık
  #                    olduğu için başlık/sayaç ile gövde vurgusu arasındaki
  #                    hiyerarşi TAMAMEN çöker. 62,8 KB için kötü takas.
  #
  # ASIL İSRAF AĞIRLIK DEĞİL, DEVANAGARI: Poppins-Regular.ttf'in 160.316 baytının
  # 126.288'i `glyf`; cmap'te doğrudan eşlenen Latin glifleri bunun yalnız 17.740
  # baytı, Devanagari temel glifleri 8.888 bayt. Kalan ~100 KB, cmap'te olmayan
  # (GSUB ile ulaşılan) Devanagari birleşik/conjunct glifleri. Latin'e subset
  # edilirse altı dosya ~385 KB -> ~120 KB'ye inerdi. YAPILMADI: Hindi (dil_hi)
  # ve Marathi (dil_mr) desteklendiği için o iki dil sistem fontuna düşerdi —
  # ürün kararı, ölçüm değil. Yapılacaksa pyftsubset + gözle doğrulama gerekir.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900


  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

