finitiv; datele sunt șterse imediat, iar copiile din backupuri în cel mult 14 zile. Jurnalele de erori se șterg automat după 30 de zile.","Îți poți exporta datele ca ZIP din setări; arhiva este trimisă la adresa ta de e-mail.","Securitate","Datele circulă prin conexiuni criptate (HTTPS) și sunt stocate pe servere cu acces restricționat.","Confidențialitatea copiilor","dizi.jpg nu se adresează copiilor sub 13 ani.","Drepturile tale","Conform KVKK și GDPR ai dreptul să îți accesezi, corectezi, ștergi și transferi datele. Pentru acestea scrie-ne: {}","Modificări","Dacă această politică se schimbă, noua versiune va fi publicată pe această pagină, iar data va fi actualizată.","Prin înregistrare accepți {}.","Apeluri vocale și video","Conținutul apelurilor nu este niciodată înregistrat. Audio și video circulă criptate cap-la-cap (DTLS-SRTP) între dispozitive; serverele noastre nu pot decripta, asculta sau stoca acest trafic.","Se păstrează doar metadatele apelului: cu cine, în ce direcție, când și cât a durat. Aceste înregistrări sunt șterse automat după 90 de zile.","Dacă nu se poate stabili o conexiune directă, audio și video trec criptate printr-un server releu (TURN). Nici acesta nu poate decripta sau înregistra conținutul.","Microfonul este folosit doar în timpul unui apel vocal sau video, iar camera doar în timpul unui apel video. Ambele sunt oprite la finalul apelului."],"nl":["Privacybeleid","Laatst bijgewerkt: {}","Dit beleid legt uit welke gegevens worden verzameld, hoe ze worden gebruikt en welke rechten je hebt wanneer je de dizi.jpg-app en de website dizijpg.com gebruikt.","Gegevens die we verzamelen","Account: e-mailadres, gebruikersnaam en wachtwoord. Wachtwoorden worden onomkeerbaar gehasht opgeslagen; gastaccounts kunnen zonder e-mail worden gebruikt.","Profiel: gegevens die je zelf kiest toe te voegen, zoals avatar, omslagfoto, bio en land.","Gebruik: je kijkgeschiedenis, beoordelingen, reacties, lijsten, reacties-emoji's en favorieten.","Berichten: je tekst-, beeld- en spraakberichten worden op onze servers opgeslagen. Berichten zijn niet end-to-end versleuteld; ze worden alleen bij een melding voor moderatie bekeken.","Geüploade media: foto's, GIF's, video's en spraakopnamen die je toevoegt aan je profiel, reacties en berichten.","Technisch: IP-adres, geschatte locatie (land/stad), apparaatplatform, app-versie en foutlogboeken. Deze worden bewaard voor beveiliging en probleemoplossing.","Meldingen: voor pushmeldingen bewaren we je apparaattoken en taalvoorkeur. Je kunt meldingen altijd uitschakelen in de instellingen van je apparaat.","Hoe we je gegevens gebruiken","We gebruiken je gegevens alleen om de dienst te leveren, je account te beschermen, meldingen te sturen, fouten op te lossen en misbruik te voorkomen. We verkopen je gegevens niet en delen ze met niemand voor reclame.","Cookies en lokale opslag","We gebruiken lokale opslag alleen om je ingelogd te houden en voorkeuren zoals taal en thema te onthouden. Er zijn geen advertentie- of trackingcookies.","Diensten van derden","Serie- en filmgegevens komen van TMDB, informatie over streamingdiensten van JustWatch. Pushmeldingen worden bezorgd via Google Firebase en het siteverkeer wordt beschermd door Cloudflare. Voor deze diensten gelden hun eigen privacybeleid.","Bewaren en verwijderen","Je gegevens worden bewaard zolang je account bestaat. Met \"Mijn account verwijderen\" in de instellingen kun je je account definitief verwijderen; je gegevens worden direct gewist, kopieën in back-ups uiterlijk binnen 14 dagen. Foutlogboeken worden na 30 dagen automatisch verwijderd.","Je kunt je gegevens via de instellingen als ZIP exporteren; het archief wordt naar je e-mailadres gestuurd.","Beveiliging","Gegevens worden verzonden via versleutelde verbindingen (HTTPS) en opgeslagen op servers met beperkte toegang.","Privacy van kinderen","dizi.jpg is niet bedoeld voor kinderen onder de 13 jaar.","Je rechten","Onder KVKK en GDPR heb je het recht om je gegevens in te zien, te corrigeren, te verwijderen en over te dragen. Schrijf ons hiervoor: {}","Wijzigingen","Als dit beleid wijzigt, wordt de nieuwe versie op deze pagina gepubliceerd en wordt de datum bijgewerkt.","Door je te registreren accepteer je het {}.","Spraak- en video-oproepen","De inhoud van gesprekken wordt nooit opgenomen. Audio en video gaan end-to-end versleuteld (DTLS-SRTP) tussen de apparaten; onze servers kunnen dit verkeer niet ontsleutelen, afluisteren of bewaren.","Alleen metadata van de oproep worden bewaard: met wie, in welke richting, wanneer en hoe lang. Deze gegevens worden na 90 dagen automatisch verwijderd.","Als er geen directe verbinding mogelijk is, gaan audio en video versleuteld via een relayserver (TURN). Ook die kan de inhoud niet ontsleutelen of opnemen.","De microfoon wordt alleen tijdens een spraak- of video-oproep gebruikt en de camera alleen tijdens een video-oproep. Beide gaan uit zodra de oproep eindigt."],"th":["นโยบายความเป็นส่วนตัว","อัปเดตล่าสุด: {}","นโยบายนี้อธิบายว่ามีการเก็บข้อมูลอะไรบ้าง นำไปใช้อย่างไร และคุณมีสิทธิ์อะไรบ้างเมื่อใช้แอป dizi.jpg และเว็บไซต์ dizijpg.com","ข้อมูลที่เราเก็บ","บัญชี: ที่อยู่อีเมล ชื่อผู้ใช้ และรหัสผ่าน รหัสผ่านถูกเก็บเป็นแฮชที่ย้อนกลับไม่ได้ บัญชีผู้เยี่ยมชมใช้ได้โดยไม่ต้องมีอีเมล","โปรไฟล์: ข้อมูลที่คุณเลือกเพิ่มเอง เช่น อวตาร ภาพปก ประวัติย่อ และประเทศ","การใช้งาน: ประวัติการดู คะแนน ความคิดเห็น รายการ รีแอ็กชัน และรายการโปรดของคุณ","ข้อความ: ข้อความตัวอักษร รูปภาพ และเสียงของคุณถูกเก็บบนเซิร์ฟเวอร์ของเรา ข้อความไม่ได้เข้ารหัสแบบต้นทางถึงปลายทาง จะถูกตรวจดูเพื่อการดูแลเนื้อหาก็ต่อเมื่อมีการรายงานเท่านั้น","สื่อที่อัปโหลด: รูปภาพ GIF วิดีโอ และเสียงบันทึกที่คุณเพิ่มในโปรไฟล์ ความคิดเห็น และข้อความ","ข้อมูลทางเทคนิค: ที่อยู่ IP ตำแหน่งโดยประมาณ (ระดับประเทศ/เมือง) แพลตฟอร์มอุปกรณ์ เวอร์ชันแอป และบันทึกข้อผิดพลาด เก็บไว้เพื่อความปลอดภัยและการแก้ไขปัญหา","การแจ้งเตือน: สำหรับการแจ้งเตือนแบบพุช เราเก็บโทเคนอุปกรณ์และภาษาที่คุณเลือก คุณปิดการแจ้งเตือนได้ทุกเมื่อในการตั้งค่าอุปกรณ์","เราใช้ข้อมูลอย่างไร","เราใช้ข้อมูลของคุณเพื่อให้บริการ ปกป้องบัญชี ส่งการแจ้งเตือน แก้ไขข้อผิดพลาด และป้องกันการใช้งานในทางที่ผิดเท่านั้น เราไม่ขายข้อมูลของคุณ และไม่แชร์ให้ใครเพื่อการโฆษณา","คุกกี้และพื้นที่จัดเก็บในเครื่อง","เราใช้พื้นที่จัดเก็บในเครื่องเพียงเพื่อให้คุณล็อกอินค้างไว้ และจดจำการตั้งค่าอย่างภาษาและธีม ไม่มีคุกกี้โฆษณาหรือติดตามใด ๆ","บริการของบุคคลที่สาม","ข้อมูลซีรีส์และภาพยนตร์มาจาก TMDB ข้อมูลแพลตฟอร์มสตรีมมิงมาจาก JustWatch การแจ้งเตือนแบบพุชส่งผ่าน Google Firebase และทราฟฟิกของเว็บไซต์ได้รับการปกป้องโดย Cloudflare บริการเหล่านี้อยู่ภายใต้นโยบายความเป็นส่วนตัวของตนเอง","การเก็บรักษาและการลบ","ข้อมูลของคุณถูกเก็บไว้ตราบเท่าที่บัญชียังอยู่ คุณลบบัญชีถาวรได้ด้วย \"ลบบัญชีของฉัน\" ในการตั้งค่า ข้อมูลถูกลบทันที ส่วนสำเนาในข้อมูลสำรองถูกลบภายใน 14 วันเป็นอย่างช้า บันทึกข้อผิดพลาดถูกลบอัตโนมัติหลัง 30 วัน","คุณส่งออกข้อมูลเป็น ZIP ได้จากการตั้งค่า ไฟล์เก็บถาวรจะถูกส่งไปยังที่อยู่อีเมลของคุณ","ความปลอดภัย","ข้อมูลถูกส่งผ่านการเชื่อมต่อที่เข้ารหัส (HTTPS) และเก็บบนเซิร์ฟเวอร์ที่จำกัดการเข้าถึง","ความเป็นส่วนตัวของเด็ก","dizi.jpg ไม่ได้มีไว้สำหรับเด็กอายุต่ำกว่า 13 ปี","สิทธิ์ของคุณ","ตาม KVKK และ GDPR คุณมีสิทธิ์เข้าถึง แก้ไข ลบ และโอนย้ายข้อมูลของคุณ ติดต่อเราได้ที่: {}","การเปลี่ยนแปลง","หากนโยบายนี้เปลี่ยนแปลง เวอร์ชันใหม่จะถูกเผยแพร่ในหน้านี้และวันที่จะถูกอัปเดต","เมื่อสมัครสมาชิก แสดงว่าคุณยอมรับ{}","สายเสียงและสายวิดีโอ","เนื้อหาการสนทนาไม่ถูกบันทึกเลย เสียงและวิดีโอถูกเข้ารหัสแบบต้นทางถึงปลายทาง (DTLS-SRTP) ระหว่างอุปกรณ์ เซิร์ฟเวอร์ของเราถอดรหัส ดักฟัง หรือจัดเก็บข้อมูลนี้ไม่ได้","เก็บเฉพาะข้อมูลกำกับการโทรเท่านั้น ได้แก่ คู่สนทนา ทิศทาง เวลา และระยะเวลา บันทึกเหล่านี้จะถูกลบอัตโนมัติหลัง 90 วัน","หากเชื่อมต่อโดยตรงไม่ได้ เสียงและวิดีโอจะผ่านเซิร์ฟเวอร์รีเลย์ (TURN) ในสถานะที่เข้ารหัสไว้ เซิร์ฟเวอร์รีเลย์ก็ถอดรหัสหรือบันทึกเนื้อหาไม่ได้เช่นกัน","ไมโครโฟนถูกใช้เฉพาะระหว่างสายเสียงหรือสายวิดีโอ และกล้องเฉพาะระหว่างสายวิดีโอ ทั้งคู่จะถูกปิดเมื่อวางสาย"],"gu":["ગોપનીયતા નીતિ","છેલ્લું અપડેટ: {}","આ નીતિ સમજાવે છે કે dizi.jpg ઍપ અને dizijpg.com સાઇટ વાપરતી વખતે કયો ડેટા એકત્ર થાય છે, કેવી રીતે વપરાય છે અને તારા હક શું છે.","અમે એકત્ર કરીએ છીએ તે ડેટા","ખાતું: ઇમેઇલ સરનામું, યુઝરનેમ અને પાસવર્ડ. પાસવર્ડ પાછા વાંચી ન શકાય તેવા હૅશ રૂપે સચવાય છે; ગેસ્ટ ખાતાં ઇમેઇલ વગર પણ વાપરી શકાય છે.","પ્રોફાઇલ: અવતાર, કવર ઇમેજ, બાયો અને દેશ જેવી તું જાતે ઉમેરવાનું પસંદ કરે તે માહિતી.","વપરાશ: તારો જોવાનો ઇતિહાસ, રેટિંગ, ટિપ્પણીઓ, યાદીઓ, રિએક્શન અને મનપસંદ.","સંદેશા: તારા લખાણ, ઇમેજ અને વૉઇસ સંદેશા અમારા સર્વર પર સચવાય છે. સંદેશા એન્ડ-ટુ-એન્ડ એન્ક્રિપ્ટેડ નથી; રિપોર્ટ થાય તો જ મોડરેશન માટે જોવાય છે.","અપલોડ કરેલો મીડિયા: પ્રોફાઇલ, ટિપ્પણીઓ અને સંદેશામાં ઉમેરેલા ફોટા, GIF, વીડિયો અને વૉઇસ રેકોર્ડિંગ.","ટેક્નિકલ: IP સરનામું, અંદાજિત સ્થાન (દેશ/શહેર સ્તરે), ડિવાઇસ પ્લેટફોર્મ, ઍપ વર્ઝન અને એરર લૉગ. આ સુરક્ષા અને ખામી સુધારવા માટે રખાય છે.","નોટિફિકેશન: પુશ નોટિફિકેશન માટે તારા ડિવાઇસનો ટોકન અને ભાષાની પસંદગી સચવાય છે. ડિવાઇસનાં સેટિંગ્સમાંથી ગમે ત્યારે નોટિફિકેશન બંધ કરી શકે છે.","અમે ડેટા કેવી રીતે વાપરીએ છીએ","તારો ડેટા ફક્ત સેવા આપવા, ખાતું સુરક્ષિત રાખવા, નોટિફિકેશન મોકલવા, ખામીઓ સુધારવા અને દુરુપયોગ અટકાવવા વપરાય છે. અમે તારો ડેટા વેચતા નથી અને જાહેરાત માટે કોઈની સાથે શેર કરતા નથી.","કૂકીઝ અને લોકલ સ્ટોરેજ","લોકલ સ્ટોરેજ ફક્ત તને લૉગ-ઇન રાખવા અને ભાષા/થીમ જેવી પસંદગીઓ યાદ રાખવા વપરાય છે. કોઈ જાહેરાત કે ટ્રેકિંગ કૂકી નથી.","તૃતીય-પક્ષ સેવાઓ","સિરીઝ અને ફિલ્મોનો ડેટા TMDB પરથી અને સ્ટ્રીમિંગ પ્લેટફોર્મની માહિતી JustWatch પરથી આવે છે. પુશ નોટિફિકેશન Google Firebase દ્વારા પહોંચે છે અને સાઇટનો ટ્રાફિક Cloudflare સુરક્ષિત રાખે છે. આ સેવાઓ પર તેમની પોતાની ગોપનીયતા નીતિઓ લાગુ પડે છે.","સંગ્રહ અને કાઢી નાખવું","તારું ખાતું હોય ત્યાં સુધી તારો ડેટા રહે છે. સેટિંગ્સમાં \"મારું ખાતું કાઢી નાખો\" થી ખાતું કાયમ માટે કાઢી શકે છે; ડેટા તરત અને બૅકઅપની નકલો વધુમાં વધુ ૧૪ દિવસમાં ભૂંસાય છે. એરર લૉગ ૩૦ દિવસ પછી આપમેળે ભૂંસાય છે.","સેટિંગ્સમાંથી તારો ડેટા ZIP રૂપે નિકાસ કરી શકે છે; આર્કાઇવ તારા ઇમેઇલ સરનામે મોકલાય છે.","સુરક્ષા","ડેટા એન્ક્રિપ્ટેડ કનેક્શન (HTTPS) થી જાય છે અને મર્યાદિત ઍક્સેસવાળા સર્વર પર સચવાય છે.","બાળકોની ગોપનીયતા","dizi.jpg ૧૩ વર્ષથી નાનાં બાળકો માટે નથી.","તારા હક","KVKK અને GDPR હેઠળ તને તારા ડેટામાં પ્રવેશ, સુધારો, કાઢી નાખવાનો અને ટ્રાન્સફરનો હક છે. આ માટે અમને લખ: {}","ફેરફારો","આ નીતિ બદલાય તો નવી આવૃત્તિ આ જ પાના પર પ્રકાશિત થશે અને તારીખ અપડેટ થશે.","નોંધણી કરીને તું {} સ્વીકારે છે.","વૉઇસ અને વિડિયો કૉલ","કૉલની સામગ્રી ક્યારેય રેકોર્ડ થતી નથી. ઑડિયો અને વિડિયો ઉપકરણો વચ્ચે એન્ડ-ટુ-એન્ડ એન્ક્રિપ્ટેડ (DTLS-SRTP) વહે છે; અમારા સર્વર્સ આ ટ્રાફિકને ડિક્રિપ્ટ, સાંભળી કે સંગ્રહી શકતા નથી.","ફક્ત કૉલ મેટાડેટા રાખવામાં આવે છે: કોની સાથે, કઈ દિશામાં, ક્યારે અને કેટલો સમય. આ રેકોર્ડ 90 દિવસ પછી આપમેળે કાઢી નાખવામાં આવે છે.","સીધું કનેક્શન શક્ય ન હોય તો ઑડિયો અને વિડિયો એન્ક્રિપ્ટેડ સ્વરૂપે રિલે સર્વર (TURN) મારફતે પસાર થાય છે. રિલે સર્વર પણ સામગ્રી ડિક્રિપ્ટ કે રેકોર્ડ કરી શકતું નથી.","માઇક્રોફોન ફક્ત વૉઇસ કે વિડિયો કૉલ દરમિયાન અને કૅમેરા ફક્ત વિડિયો કૉલ દરમિયાન વપરાય છે. કૉલ પૂરો થતાં બંને બંધ થઈ જાય છે."],"kn":["ಗೌಪ್ಯತಾ ನೀತಿ","ಕೊನೆಯ ಅಪ್‌ಡೇಟ್: {}","dizi.jpg ಆ್ಯಪ್ ಮತ್ತು dizijpg.com ಸೈಟ್ ಬಳಸುವಾಗ ಯಾವ ಡೇಟಾ ಸಂಗ್ರಹವಾಗುತ್ತದೆ, ಹೇಗೆ ಬಳಕೆಯಾಗುತ್ತದೆ ಮತ್ತು ನಿನ್ನ ಹಕ್ಕುಗಳೇನು ಎಂಬುದನ್ನು ಈ ನೀತಿ ವಿವರಿಸುತ್ತದೆ.","ನಾವು ಸಂಗ್ರಹಿಸುವ ಡೇಟಾ","ಖಾತೆ: ಇಮೇಲ್ ವಿಳಾಸ, ಬಳಕೆದಾರ ಹೆಸರು ಮತ್ತು ಪಾಸ್‌ವರ್ಡ್. ಪಾಸ್‌ವರ್ಡ್‌ಗಳು ಹಿಂತಿರುಗಿಸಲಾಗದ ಹ್ಯಾಶ್ ರೂಪದಲ್ಲಿ ಸಂಗ್ರಹವಾಗುತ್ತವೆ; ಅತಿಥಿ ಖಾತೆಗಳನ್ನು ಇಮೇಲ್ ಇಲ್ಲದೆಯೂ ಬಳಸಬಹುದು.","ಪ್ರೊಫೈಲ್: ಅವತಾರ್, ಕವರ್ ಚಿತ್ರ, ಬಯೋ ಮತ್ತು ದೇಶದಂತಹ ನೀನು ಸೇರಿಸಲು ಆರಿಸುವ ಮಾಹಿತಿ.","ಬಳಕೆ: ನಿನ್ನ ವೀಕ್ಷಣೆ ಇತಿಹಾಸ, ರೇಟಿಂಗ್‌ಗಳು, ಕಾಮೆಂಟ್‌ಗಳು, ಪಟ್ಟಿಗಳು, ರಿಯಾಕ್ಷನ್‌ಗಳು ಮತ್ತು ಮೆಚ್ಚಿನವು.","ಸಂದೇಶಗಳು: ನಿನ್ನ ಪಠ್ಯ, ಚಿತ್ರ ಮತ್ತು ಧ್ವನಿ ಸಂದೇಶಗಳು ನಮ್ಮ ಸರ್ವರ್‌ಗಳಲ್ಲಿ ಸಂಗ್ರಹವಾಗುತ್ತವೆ. ಸಂದೇಶಗಳಿಗೆ ಎಂಡ್-ಟು-ಎಂಡ್ ಎನ್‌ಕ್ರಿಪ್ಶನ್ ಇಲ್ಲ; ವರದಿಯಾದರೆ ಮಾತ್ರ ಮಾಡರೇಶನ್‌ಗಾಗಿ ನೋಡಲಾಗುತ್ತದೆ.","ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ ಮೀಡಿಯಾ: ಪ್ರೊಫೈಲ್, ಕಾಮೆಂಟ್ ಮತ್ತು ಸಂದೇಶಗಳಿಗೆ ನೀನು ಸೇರಿಸುವ ಫೋಟೋಗಳು, GIF, ವೀಡಿಯೊಗಳು ಮತ್ತು ಧ್ವನಿ ರೆಕಾರ್ಡಿಂಗ್‌ಗಳು.","ತಾಂತ್ರಿಕ: IP ವಿಳಾಸ, ಅಂದಾಜು ಸ್ಥಳ (ದೇಶ/ನಗರ ಮಟ್ಟ), ಸಾಧನದ ಪ್ಲಾಟ್‌ಫಾರ್ಮ್, ಆ್ಯಪ್ ಆವೃತ್ತಿ ಮತ್ತು ದೋಷ ದಾಖಲೆಗಳು. ಇವು ಭದ್ರತೆ ಮತ್ತು ದೋಷ ಸರಿಪಡಿಸುವಿಕೆಗಾಗಿ ಇಡಲಾಗುತ್ತವೆ.","ಅಧಿಸೂಚನೆಗಳು: ಪುಶ್ ಅಧಿಸೂಚನೆಗಳಿಗಾಗಿ ನಿನ್ನ ಸಾಧನದ ಟೋಕನ್ ಮತ್ತು ಭಾಷಾ ಆಯ್ಕೆ ಸಂಗ್ರಹವಾಗುತ್ತವೆ. ಸಾಧನದ ಸೆಟ್ಟಿಂಗ್ಸ್‌ನಿಂದ ಯಾವಾಗ ಬೇಕಾದರೂ ಅಧಿಸೂಚನೆ ಆಫ್ ಮಾಡಬಹುದು.","ಡೇಟಾವನ್ನು ಹೇಗೆ ಬಳಸುತ್ತೇವೆ","ನಿನ್ನ ಡೇಟಾವನ್ನು ಸೇವೆ ನೀಡಲು, ಖಾತೆ ರಕ್ಷಿಸಲು, ಅಧಿಸೂಚನೆ ಕಳುಹಿಸಲು, ದೋಷ ಸರಿಪಡಿಸಲು ಮತ್ತು ದುರ್ಬಳಕೆ ತಡೆಯಲು ಮಾತ್ರ ಬಳಸುತ್ತೇವೆ. ನಿನ್ನ ಡೇಟಾವನ್ನು ಮಾರುವುದಿಲ್ಲ; ಜಾಹೀರಾತಿಗಾಗಿ ಯಾರೊಂದಿಗೂ ಹಂಚುವುದಿಲ್ಲ.","ಕುಕೀಗಳು ಮತ್ತು ಲೋಕಲ್ ಸ್ಟೋರೇಜ್","ನಿನ್ನನ್ನು ಲಾಗಿನ್‌ನಲ್ಲಿ ಇಡಲು ಮತ್ತು ಭಾಷೆ/ಥೀಮ್‌ನಂತಹ ಆಯ್ಕೆಗಳನ್ನು ನೆನಪಿಡಲು ಮಾತ್ರ ಲೋಕಲ್ ಸ್ಟೋರೇಜ್ ಬಳಸುತ್ತೇವೆ. ಜಾಹೀರಾತು ಅಥವಾ ಟ್ರ್ಯಾಕಿಂಗ್ ಕುಕೀಗಳಿಲ್ಲ.","ಮೂರನೇ ವ್ಯಕ್ತಿಯ ಸೇವೆಗಳು","ಸರಣಿ ಮತ್ತು ಚಲನಚಿತ್ರಗಳ ಡೇಟಾ TMDB ಯಿಂದ, ಸ್ಟ್ರೀಮಿಂಗ್ ವೇದಿಕೆಗಳ ಮಾಹಿತಿ JustWatch ನಿಂದ ಬರುತ್ತದೆ. ಪುಶ್ ಅಧಿಸೂಚನೆಗಳು Google Firebase ಮೂಲಕ ತಲುಪುತ್ತವೆ; ಸೈಟ್ ಟ್ರಾಫಿಕ್ ಅನ್ನು Cloudflare ರಕ್ಷಿಸುತ್ತದೆ. ಈ ಸೇವೆಗಳಿಗೆ ಅವುಗಳದೇ ಗೌಪ್ಯತಾ ನೀತಿಗಳು ಅನ್ವಯಿಸುತ್ತವೆ.","ಸಂಗ್ರಹಣೆ ಮತ್ತು ಅಳಿಸುವಿಕೆ","ನಿನ್ನ ಖಾತೆ ಇರುವವರೆಗೆ ನಿನ್ನ ಡೇಟಾ ಇರುತ್ತದೆ. ಸೆಟ್ಟಿಂಗ್ಸ್‌ನ \"ನನ್ನ ಖಾತೆಯನ್ನು ಅಳಿಸಿ\" ಮೂಲಕ ಖಾತೆಯನ್ನು ಶಾಶ್ವತವಾಗಿ ಅಳಿಸಬಹುದು; ಡೇಟಾ ತಕ್ಷಣ, ಬ್ಯಾಕಪ್‌ಗಳಲ್ಲಿನ ಪ್ರತಿಗಳು ಗರಿಷ್ಠ 14 ದಿನಗಳಲ್ಲಿ ಅಳಿಸಲ್ಪಡುತ್ತವೆ. ದೋಷ ದಾಖಲೆಗಳು 30 ದಿನಗಳ ನಂತರ ತಾವಾಗಿಯೇ ಅಳಿಸಲ್ಪಡುತ್ತವೆ.","ಸೆಟ್ಟಿಂಗ್ಸ್‌ನಿಂದ ನಿನ್ನ ಡೇಟಾವನ್ನು ZIP ರೂಪದಲ್ಲಿ ರಫ್ತು ಮಾಡಬಹುದು; ಆರ್ಕೈವ್ ನಿನ್ನ ಇಮೇಲ್ ವಿಳಾಸಕ್ಕೆ ಕಳುಹಿಸಲಾಗುತ್ತದೆ.","ಭದ್ರತೆ","ಡೇಟಾ ಎನ್‌ಕ್ರಿಪ್ಟ್ ಆದ ಸಂಪರ್ಕಗಳ (HTTPS) ಮೂಲಕ ಸಾಗುತ್ತದೆ; ಸೀಮಿತ ಪ್ರವೇಶದ ಸರ್ವರ್‌ಗಳಲ್ಲಿ ಸಂಗ್ರಹವಾಗುತ್ತದೆ.","ಮಕ್ಕಳ ಗೌಪ್ಯತೆ","dizi.jpg 13 ವರ್ಷದೊಳಗಿನ ಮಕ್ಕಳಿಗಾಗಿ ಅಲ್ಲ.","ನಿನ್ನ ಹಕ್ಕುಗಳು","KVKK ಮತ್ತು GDPR ಪ್ರಕಾರ ನಿನ್ನ ಡೇಟಾವನ್ನು ಪಡೆಯುವ, ಸರಿಪಡಿಸುವ, ಅಳಿಸುವ ಮತ್ತು ವರ್ಗಾಯಿಸುವ ಹಕ್ಕು ನಿನಗಿದೆ. ಇದಕ್ಕಾಗಿ ನಮಗೆ ಬರೆ: {}","ಬದಲಾವಣೆಗಳು","ಈ ನೀತಿ ಬದಲಾದರೆ ಹೊಸ ಆವೃತ್ತಿ ಇದೇ ಪುಟದಲ್ಲಿ ಪ್ರಕಟವಾಗಿ ದಿನಾಂಕ ಅಪ್‌ಡೇಟ್ ಆಗುತ್ತದೆ.","ನೋಂದಣಿ ಮಾಡುವ ಮೂಲಕ ನೀನು {} ಒಪ್ಪಿಕೊಳ್ಳುತ್ತೀಯ.","ಧ್ವನಿ ಮತ್ತು ವೀಡಿಯೊ ಕರೆಗಳು","ಕರೆಯ ವಿಷಯವನ್ನು ಎಂದಿಗೂ ರೆಕಾರ್ಡ್ ಮಾಡಲಾಗುವುದಿಲ್ಲ. ಆಡಿಯೊ ಮತ್ತು ವೀಡಿಯೊ ಸಾಧನಗಳ ನಡುವೆ ಎಂಡ್-ಟು-ಎಂಡ್ ಎನ್‌ಕ್ರಿಪ್ಟ್ (DTLS-SRTP) ಆಗಿ ಹರಿಯುತ್ತವೆ; ನಮ್ಮ ಸರ್ವರ್‌ಗಳು ಇದನ್ನು ಡೀಕ್ರಿಪ್ಟ್ ಮಾಡಲು, ಕೇಳಲು ಅಥವಾ ಸಂಗ್ರಹಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ.","ಕರೆಯ ಮೆಟಾಡೇಟಾ ಮಾತ್ರ ಇರಿಸಲಾಗುತ್ತದೆ: ಯಾರೊಂದಿಗೆ, ಯಾವ ದಿಕ್ಕಿನಲ್ಲಿ, ಯಾವಾಗ ಮತ್ತು ಎಷ್ಟು ಸಮಯ. ಈ ದಾಖಲೆಗಳು 90 ದಿನಗಳ ನಂತರ ಸ್ವಯಂಚಾಲಿತವಾಗಿ ಅಳಿಸಲಾಗುತ್ತವೆ.","ನೇರ ಸಂಪರ್ಕ ಸಾಧ್ಯವಾಗದಿದ್ದರೆ ಆಡಿಯೊ ಮತ್ತು ವೀಡಿಯೊ ಎನ್‌ಕ್ರಿಪ್ಟ್ ಆದ ಸ್ಥಿತಿಯಲ್ಲಿ ರಿಲೇ ಸರ್ವರ್ (TURN) ಮೂಲಕ ಹಾದುಹೋಗುತ್ತವೆ. ರಿಲೇ ಸರ್ವರ್ ಕೂಡ ವಿಷಯವನ್ನು ಡೀಕ್ರಿಪ್ಟ್ ಅಥವಾ ರೆಕಾರ್ಡ್ ಮಾಡಲಾಗದು.","ಮೈಕ್ರೊಫೋನ್ ಧ್ವನಿ ಅಥವಾ ವೀಡಿಯೊ ಕರೆಯ ಸಮಯದಲ್ಲಿ ಮಾತ್ರ, ಕ್ಯಾಮೆರಾ ವೀಡಿಯೊ ಕರೆಯ ಸಮಯದಲ್ಲಿ ಮಾತ್ರ ಬಳಕೆಯಾಗುತ್ತದೆ. ಕರೆ ಮುಗಿದ ಕೂಡಲೇ ಎರಡೂ ಆಫ್ ಆಗುತ್ತವೆ."],"ml":["സ്വകാര്യതാ നയം","അവസാന അപ്ഡേറ്റ്: {}","dizi.jpg ആപ്പും dizijpg.com സൈറ്റും ഉപയോഗിക്കുമ്പോൾ ഏതെല്ലാം ഡാറ്റ ശേഖരിക്കുന്നു, എങ്ങനെ ഉപയോഗിക്കുന്നു, നിന്റെ അവകാശങ്ങൾ എന്തൊക്കെ എന്നിവ ഈ നയം വിശദീകരിക്കുന്നു.","ഞങ്ങൾ ശേഖരിക്കുന്ന ഡാറ്റ","അക്കൗണ്ട്: ഇമെയിൽ വിലാസം, യൂസർനെയിം, പാസ്‌വേഡ്. പാസ്‌വേഡുകൾ തിരിച്ചെടുക്കാനാവാത്ത ഹാഷ് രൂപത്തിലാണ് സൂക്ഷിക്കുന്നത്; ഗസ്റ്റ് അക്കൗണ്ടുകൾ ഇമെയിൽ ഇല്ലാതെയും ഉപയോഗിക്കാം.","പ്രൊഫൈൽ: അവതാർ, കവർ ചിത്രം, ബയോ, രാജ്യം എന്നിങ്ങനെ നീ ചേർക്കാൻ തിരഞ്ഞെടുക്കുന്ന വിവരങ്ങൾ.","ഉപയോഗം: നിന്റെ കാണൽ ചരിത്രം, റേറ്റിംഗുകൾ, കമന്റുകൾ, ലിസ്റ്റുകൾ, റിയാക്ഷനുകൾ, പ്രിയപ്പെട്ടവ.","സന്ദേശങ്ങൾ: നിന്റെ ടെക്സ്റ്റ്, ചിത്ര, വോയ്സ് സന്ദേശങ്ങൾ ഞങ്ങളുടെ സെർവറുകളിൽ സൂക്ഷിക്കുന്നു. സന്ദേശങ്ങൾക്ക് എൻഡ്-ടു-എൻഡ് എൻക്രിപ്ഷൻ ഇല്ല; റിപ്പോർട്ട് ചെയ്താൽ മാത്രം മോഡറേഷനായി പരിശോധിക്കും.","അപ്‌ലോഡ് ചെയ്ത മീഡിയ: പ്രൊഫൈലിലും കമന്റുകളിലും സന്ദേശങ്ങളിലും നീ ചേർക്കുന്ന ഫോട്ടോകൾ, GIF, വീഡിയോകൾ, വോയ്സ് റെക്കോർഡിംഗുകൾ.","സാങ്കേതികം: IP വിലാസം, ഏകദേശ സ്ഥാനം (രാജ്യം/നഗരം തലത്തിൽ), ഉപകരണ പ്ലാറ്റ്ഫോം, ആപ്പ് പതിപ്പ്, പിശക് ലോഗുകൾ. ഇവ സുരക്ഷയ്ക്കും തകരാർ പരിഹാരത്തിനുമായി സൂക്ഷിക്കുന്നു.","അറിയിപ്പുകൾ: പുഷ് അറിയിപ്പുകൾക്കായി നിന്റെ ഉപകരണ ടോക്കണും ഭാഷാ തിരഞ്ഞെടുപ്പും സൂക്ഷിക്കുന്നു. ഉപകരണ ക്രമീകരണങ്ങളിൽ നിന്ന് എപ്പോൾ വേണമെങ്കിലും അറിയിപ്പുകൾ ഓഫാക്കാം.","ഡാറ്റ എങ്ങനെ ഉപയോഗിക്കുന്നു","സേവനം നൽകാനും അക്കൗണ്ട് സംരക്ഷിക്കാനും അറിയിപ്പുകൾ അയയ്ക്കാനും പിശകുകൾ പരിഹരിക്കാനും ദുരുപയോഗം തടയാനും മാത്രമാണ് നിന്റെ ഡാറ്റ ഉപയോഗിക്കുന്നത്. നിന്റെ ഡാറ്റ വിൽക്കുന്നില്ല; പരസ്യത്തിനായി ആരുമായും പങ്കിടുന്നില്ല.","കുക്കികളും ലോക്കൽ സ്റ്റോറേജും","നിന്നെ ലോഗിൻ ആയി നിലനിർത്താനും ഭാഷ/തീം പോലുള്ള മുൻഗണനകൾ ഓർക്കാനും മാത്രമാണ് ലോക്കൽ സ്റ്റോറേജ് ഉപയോഗിക്കുന്നത്. പരസ്യ അല്ലെങ്കിൽ ട്രാക്കിംഗ് കുക്കികൾ ഇല്ല.","മൂന്നാം കക്ഷി സേവനങ്ങൾ","സീരീസുകളുടെയും സിനിമകളുടെയും ഡാറ്റ TMDB-യിൽ നിന്നും സ്ട്രീമിംഗ് പ്ലാറ്റ്ഫോം വിവരങ്ങൾ JustWatch-ൽ നിന്നും വരുന്നു. പുഷ് അറിയിപ്പുകൾ Google Firebase വഴി എത്തുന്നു; സൈറ്റ് ട്രാഫിക്ക് Cloudflare സംരക്ഷിക്കുന്നു. ഈ സേവനങ്ങൾക്ക് അവയുടെ സ്വന്തം സ്വകാര്യതാ നയങ്ങൾ ബാധകമാണ്.","സൂക്ഷിക്കലും നീക്കം ചെയ്യലും","നിന്റെ അക്കൗണ്ട് ഉള്ളിടത്തോളം ഡാറ്റയും ഉണ്ടാകും. ക്രമീകരണങ്ങളിലെ \"എന്റെ അക്കൗണ്ട് ഇല്ലാതാക്കുക\" വഴി അക്കൗണ്ട് ശാശ്വതമായി ഇല്ലാതാക്കാം; ഡാറ്റ ഉടനെയും ബാക്കപ്പുകളിലെ പകർപ്പുകൾ പരമാവധി 14 ദിവസത്തിനുള്ളിലും മായ്ക്കപ്പെടും. പിശക് ലോഗുകൾ 30 ദിവസത്തിന് ശേഷം സ്വയമേവ മായ്ക്കപ്പെടും.","ക്രമീകരണങ്ങളിൽ നിന്ന് നിന്റെ ഡാറ്റ ZIP ആയി എക്സ്പോർട്ട് ചെയ്യാം; ആർക്കൈവ് നിന്റെ ഇമെയിൽ വിലാസത്തിലേക്ക് അയയ്ക്കും.","സുരക്ഷ","ഡാറ്റ എൻക്രിപ്റ്റഡ് കണക്ഷനുകൾ (HTTPS) വഴി സഞ്ചരിക്കുന്നു; പരിമിത ആക്സസ് ഉള്ള സെർവറുകളിൽ സൂക്ഷിക്കുന്നു.","കുട്ടികളുടെ സ്വകാര്യത","dizi.jpg 13 വയസ്സിന് താഴെയുള്ള കുട്ടികൾക്കുള്ളതല്ല.","നിന്റെ അവകാശങ്ങൾ","KVKK, GDPR പ്രകാരം നിന്റെ ഡാറ്റ ആക്സസ് ചെയ്യാനും തിരുത്താനും ഇല്ലാതാക്കാനും മാറ്റാനും നിനക്ക് അവകാശമുണ്ട്. ഇതിനായി ഞങ്ങൾക്ക് എഴുതൂ: {}","മാറ്റങ്ങൾ","ഈ നയം മാറിയാൽ പുതിയ പതിപ്പ് ഇതേ പേജിൽ പ്രസിദ്ധീകരിച്ച് തീയതി പുതുക്കും.","രജിസ്റ്റർ ചെയ്യുന്നതിലൂടെ നീ {} അംഗീകരിക്കുന്നു.","വോയ്‌സ്, വീഡിയോ കോളുകൾ","കോളിന്റെ ഉള്ളടക്കം ഒരിക്കലും റെക്കോർഡ് ചെയ്യുന്നില്ല. ഓഡിയോയും വീഡിയോയും ഉപകരണങ്ങൾക്കിടയിൽ എൻഡ്-ടു-എൻഡ് എൻക്രിപ്റ്റ് ചെയ്ത് (DTLS-SRTP) ഒഴുകുന്നു; ഞങ്ങളുടെ സെർവറുകൾക്ക് ഇത് ഡീക്രിപ്റ്റ് ചെയ്യാനോ കേൾക്കാനോ സൂക്ഷിക്കാനോ കഴിയില്ല.","കോൾ മെറ്റാഡേറ്റ മാത്രമേ സൂക്ഷിക്കുന്നുള്ളൂ: ആരുമായി, ഏത് ദിശയിൽ, എപ്പോൾ, എത്ര നേരം. ഈ രേഖകൾ 90 ദിവസത്തിനു ശേഷം സ്വയമേവ ഇല്ലാതാകും.","നേരിട്ടുള്ള കണക്ഷൻ സാധ്യമല്ലെങ്കിൽ ഓഡിയോയും വീഡിയോയും എൻക്രിപ്റ്റ് ചെയ്ത നിലയിൽ ഒരു റിലേ സെർവർ (TURN) വഴി കടന്നുപോകും. റിലേ സെർവറിനും ഉള്ളടക്കം ഡീക്രിപ്റ്റ് ചെയ്യാനോ റെക്കോർഡ് ചെയ്യാനോ കഴിയില്ല.","മൈക്രോഫോൺ വോയ്‌സ് അല്ലെങ്കിൽ വീഡിയോ കോൾ സമയത്തും ക്യാമറ വീഡിയോ കോൾ സമയത്തും മാത്രമേ ഉപയോഗിക്കൂ. കോൾ കഴിഞ്ഞാൽ രണ്ടും ഓഫാകും."],"pa":["ਪਰਦੇਦਾਰੀ ਨੀਤੀ","ਆਖਰੀ ਅੱਪਡੇਟ: {}","ਇਹ ਨੀਤੀ ਦੱਸਦੀ ਹੈ ਕਿ dizi.jpg ਐਪ ਅਤੇ dizijpg.com ਸਾਈਟ ਵਰਤਣ ਵੇਲੇ ਕਿਹੜਾ ਡਾਟਾ ਇਕੱਠਾ ਹੁੰਦਾ ਹੈ, ਕਿਵੇਂ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ ਅਤੇ ਤੇਰੇ ਹੱਕ ਕੀ ਹਨ।","ਅਸੀਂ ਇਕੱਠਾ ਕਰਦੇ ਡਾਟਾ","ਖਾਤਾ: ਈਮੇਲ ਪਤਾ, ਯੂਜ਼ਰਨੇਮ ਅਤੇ ਪਾਸਵਰਡ। ਪਾਸਵਰਡ ਵਾਪਸ ਨਾ ਪੜ੍ਹੇ ਜਾ ਸਕਣ ਵਾਲੇ ਹੈਸ਼ ਰੂਪ ਵਿੱਚ ਰੱਖੇ ਜਾਂਦੇ ਹਨ; ਮਹਿਮਾਨ ਖਾਤੇ ਬਿਨਾਂ ਈਮੇਲ ਵੀ ਵਰਤੇ ਜਾ ਸਕਦੇ ਹਨ।","ਪ੍ਰੋਫਾਈਲ: ਅਵਤਾਰ, ਕਵਰ ਤਸਵੀਰ, ਬਾਇਓ ਅਤੇ ਦੇਸ਼ ਵਰਗੀ ਜਾਣਕਾਰੀ ਜੋ ਤੂੰ ਖੁਦ ਜੋੜਨੀ ਚੁਣੇਂ।","ਵਰਤੋਂ: ਤੇਰਾ ਦੇਖਣ ਦਾ ਇਤਿਹਾਸ, ਰੇਟਿੰਗ, ਟਿੱਪਣੀਆਂ, ਸੂਚੀਆਂ, ਰਿਐਕਸ਼ਨ ਅਤੇ ਮਨਪਸੰਦ।","ਸੁਨੇਹੇ: ਤੇਰੇ ਲਿਖਤੀ, ਤਸਵੀਰੀ ਅਤੇ ਆਵਾਜ਼ੀ ਸੁਨੇਹੇ ਸਾਡੇ ਸਰਵਰਾਂ 'ਤੇ ਰੱਖੇ ਜਾਂਦੇ ਹਨ। ਸੁਨੇਹੇ ਐਂਡ-ਟੂ-ਐਂਡ ਇਨਕ੍ਰਿਪਟਡ ਨਹੀਂ ਹਨ; ਸਿਰਫ਼ ਰਿਪੋਰਟ ਹੋਣ 'ਤੇ ਮੋਡਰੇਸ਼ਨ ਲਈ ਵੇਖੇ ਜਾਂਦੇ ਹਨ।","ਅੱਪਲੋਡ ਕੀਤਾ ਮੀਡੀਆ: ਪ੍ਰੋਫਾਈਲ, ਟਿੱਪਣੀਆਂ ਅਤੇ ਸੁਨੇਹਿਆਂ ਵਿੱਚ ਜੋੜੀਆਂ ਫੋਟੋਆਂ, GIF, ਵੀਡੀਓ ਅਤੇ ਆਵਾਜ਼ੀ ਰਿਕਾਰਡਿੰਗਾਂ।","ਤਕਨੀਕੀ: IP ਪਤਾ, ਅੰਦਾਜ਼ਨ ਟਿਕਾਣਾ (ਦੇਸ਼/ਸ਼ਹਿਰ ਪੱਧਰ), ਡਿਵਾਈਸ ਪਲੇਟਫਾਰਮ, ਐਪ ਵਰਜ਼ਨ ਅਤੇ ਐਰਰ ਲਾਗ। ਇਹ ਸੁਰੱਖਿਆ ਅਤੇ ਖਾਮੀਆਂ ਠੀਕ ਕਰਨ ਲਈ ਰੱਖੇ ਜਾਂਦੇ ਹਨ।","ਸੂਚਨਾਵਾਂ: ਪੁਸ਼ ਸੂਚਨਾਵਾਂ ਲਈ ਤੇਰੇ ਡਿਵਾਈਸ ਦਾ ਟੋਕਨ ਅਤੇ ਭਾਸ਼ਾ ਦੀ ਪਸੰਦ ਰੱਖੀ ਜਾਂਦੀ ਹੈ। ਡਿਵਾਈਸ ਦੀਆਂ ਸੈਟਿੰਗਾਂ ਵਿੱਚੋਂ ਕਦੇ ਵੀ ਸੂਚਨਾਵਾਂ ਬੰਦ ਕਰ ਸਕਦਾ ਹੈਂ।","ਅਸੀਂ ਡਾਟਾ ਕਿਵੇਂ ਵਰਤਦੇ ਹਾਂ","ਤੇਰਾ ਡਾਟਾ ਸਿਰਫ਼ ਸੇਵਾ ਦੇਣ, ਖਾਤਾ ਸੁਰੱਖਿਅਤ ਰੱਖਣ, ਸੂਚਨਾਵਾਂ ਭੇਜਣ, ਖਾਮੀਆਂ ਠੀਕ ਕਰਨ ਅਤੇ ਦੁਰਵਰਤੋਂ ਰੋਕਣ ਲਈ ਵਰਤਦੇ ਹਾਂ। ਅਸੀਂ ਤੇਰਾ ਡਾਟਾ ਨਾ ਵੇਚਦੇ ਹਾਂ, ਨਾ ਇਸ਼ਤਿਹਾਰਬਾਜ਼ੀ ਲਈ ਕਿਸੇ ਨਾਲ ਸਾਂਝਾ ਕਰਦੇ ਹਾਂ।","ਕੂਕੀਜ਼ ਅਤੇ ਲੋਕਲ ਸਟੋਰੇਜ","ਲੋਕਲ ਸਟੋਰੇਜ ਸਿਰਫ਼ ਤੈਨੂੰ ਲਾਗਇਨ ਰੱਖਣ ਅਤੇ ਭਾਸ਼ਾ/ਥੀਮ ਵਰਗੀਆਂ ਪਸੰਦਾਂ ਯਾਦ ਰੱਖਣ ਲਈ ਵਰਤੀ ਜਾਂਦੀ ਹੈ। ਕੋਈ ਇਸ਼ਤਿਹਾਰੀ ਜਾਂ ਟ੍ਰੈਕਿੰਗ ਕੂਕੀ ਨਹੀਂ ਹੈ।","ਤੀਜੀ-ਧਿਰ ਸੇਵਾਵਾਂ","ਸੀਰੀਜ਼ ਅਤੇ ਫਿਲਮਾਂ ਦਾ ਡਾਟਾ TMDB ਤੋਂ ਅਤੇ ਸਟ੍ਰੀਮਿੰਗ ਪਲੇਟਫਾਰਮਾਂ ਦੀ ਜਾਣਕਾਰੀ JustWatch ਤੋਂ ਆਉਂਦੀ ਹੈ। ਪੁਸ਼ ਸੂਚਨਾਵਾਂ Google Firebase ਰਾਹੀਂ ਪਹੁੰਚਦੀਆਂ ਹਨ ਅਤੇ ਸਾਈਟ ਦੇ ਟ੍ਰੈਫਿਕ ਦੀ ਰਾਖੀ Cloudflare ਕਰਦਾ ਹੈ। ਇਨ੍ਹਾਂ ਸੇਵਾਵਾਂ 'ਤੇ ਉਨ੍ਹਾਂ ਦੀਆਂ ਆਪਣੀਆਂ ਪਰਦੇਦਾਰੀ ਨੀਤੀਆਂ ਲਾਗੂ ਹੁੰਦੀਆਂ ਹਨ।","ਸੰਭਾਲ ਅਤੇ ਮਿਟਾਉਣਾ","ਤੇਰਾ ਡਾਟਾ ਓਨਾ ਚਿਰ ਰਹਿੰਦਾ ਹੈ ਜਿੰਨਾ ਚਿਰ ਤੇਰਾ ਖਾਤਾ ਹੈ। ਸੈਟਿੰਗਾਂ ਵਿੱਚ \"ਮੇਰਾ ਖਾਤਾ ਮਿਟਾਓ\" ਨਾਲ ਖਾਤਾ ਹਮੇਸ਼ਾ ਲਈ ਮਿਟਾ ਸਕਦਾ ਹੈਂ; ਡਾਟਾ ਤੁਰੰਤ ਅਤੇ ਬੈਕਅੱਪ ਦੀਆਂ ਕਾਪੀਆਂ ਵੱਧ ਤੋਂ ਵੱਧ 14 ਦਿਨਾਂ ਵਿੱਚ ਮਿਟ ਜਾਂਦੀਆਂ ਹਨ। ਐਰਰ ਲਾਗ 30 ਦਿਨਾਂ ਬਾਅਦ ਆਪੇ ਮਿਟ ਜਾਂਦੇ ਹਨ।","ਸੈਟਿੰਗਾਂ ਵਿੱਚੋਂ ਆਪਣਾ ਡਾਟਾ ZIP ਰੂਪ ਵਿੱਚ ਨਿਰਯਾਤ ਕਰ ਸਕਦਾ ਹੈਂ; ਆਰਕਾਈਵ ਤੇਰੇ ਈਮੇਲ ਪਤੇ 'ਤੇ ਭੇਜਿਆ ਜਾਂਦਾ ਹੈ।","ਸੁਰੱਖਿਆ","ਡਾਟਾ ਇਨਕ੍ਰਿਪਟਡ ਕਨੈਕਸ਼ਨਾਂ (HTTPS) ਰਾਹੀਂ ਜਾਂਦਾ ਹੈ ਅਤੇ ਸੀਮਤ ਪਹੁੰਚ ਵਾਲੇ ਸਰਵਰਾਂ 'ਤੇ ਰੱਖਿਆ ਜਾਂਦਾ ਹੈ।","ਬੱਚਿਆਂ ਦੀ ਪਰਦੇਦਾਰੀ","dizi.jpg 13 ਸਾਲ ਤੋਂ ਛੋਟੇ ਬੱਚਿਆਂ ਲਈ ਨਹੀਂ ਹੈ।","ਤੇਰੇ ਹੱਕ","KVKK ਅਤੇ GDPR ਤਹਿਤ ਤੈਨੂੰ ਆਪਣੇ ਡਾਟੇ ਤੱਕ ਪਹੁੰਚ, ਸੁਧਾਰ, ਮਿਟਾਉਣ ਅਤੇ ਤਬਦੀਲ ਕਰਨ ਦਾ ਹੱਕ ਹੈ। ਇਸ ਲਈ ਸਾਨੂੰ ਲਿਖ: {}","ਤਬਦੀਲੀਆਂ","ਇਹ ਨੀਤੀ ਬਦਲੇ ਤਾਂ ਨਵਾਂ ਰੂਪ ਇਸੇ ਪੰਨੇ 'ਤੇ ਪ੍ਰਕਾਸ਼ਿਤ ਹੋਵੇਗਾ ਅਤੇ ਤਾਰੀਖ ਅੱਪਡੇਟ ਹੋਵੇਗੀ।","ਰਜਿਸਟਰ ਕਰਕੇ ਤੂੰ {} ਸਵੀਕਾਰ ਕਰਦਾ ਹੈਂ।","ਵੌਇਸ ਅਤੇ ਵੀਡੀਓ ਕਾਲਾਂ","ਕਾਲ ਦੀ ਸਮੱਗਰੀ ਕਦੇ ਰਿਕਾਰਡ ਨਹੀਂ ਕੀਤੀ ਜਾਂਦੀ। ਆਡੀਓ ਅਤੇ ਵੀਡੀਓ ਡਿਵਾਈਸਾਂ ਵਿਚਕਾਰ ਐਂਡ-ਟੂ-ਐਂਡ ਐਨਕ੍ਰਿਪਟਡ (DTLS-SRTP) ਵਹਿੰਦੇ ਹਨ; ਸਾਡੇ ਸਰਵਰ ਇਸ ਨੂੰ ਡੀਕ੍ਰਿਪਟ, ਸੁਣ ਜਾਂ ਸਟੋਰ ਨਹੀਂ ਕਰ ਸਕਦੇ।","ਸਿਰਫ਼ ਕਾਲ ਮੈਟਾਡੇਟਾ ਰੱਖਿਆ ਜਾਂਦਾ ਹੈ: ਕਿਸ ਨਾਲ, ਕਿਸ ਦਿਸ਼ਾ ਵਿੱਚ, ਕਦੋਂ ਅਤੇ ਕਿੰਨੀ ਦੇਰ। ਇਹ ਰਿਕਾਰਡ 90 ਦਿਨਾਂ ਬਾਅਦ ਆਪਣੇ ਆਪ ਮਿਟ ਜਾਂਦੇ ਹਨ।","ਜੇ ਸਿੱਧਾ ਕਨੈਕਸ਼ਨ ਸੰਭਵ ਨਾ ਹੋਵੇ ਤਾਂ ਆਡੀਓ ਅਤੇ ਵੀਡੀਓ ਐਨਕ੍ਰਿਪਟਡ ਰੂਪ ਵਿੱਚ ਰਿਲੇ ਸਰਵਰ (TURN) ਰਾਹੀਂ ਲੰਘਦੇ ਹਨ। ਰਿਲੇ ਸਰਵਰ ਵੀ ਸਮੱਗਰੀ ਡੀਕ੍ਰਿਪਟ ਜਾਂ ਰਿਕਾਰਡ ਨਹੀਂ ਕਰ ਸਕਦਾ।","ਮਾਈਕ੍ਰੋਫੋਨ ਸਿਰਫ਼ ਵੌਇਸ ਜਾਂ ਵੀਡੀਓ ਕਾਲ ਦੌਰਾਨ ਅਤੇ ਕੈਮਰਾ ਸਿਰਫ਼ ਵੀਡੀਓ ਕਾਲ ਦੌਰਾਨ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ। ਕਾਲ ਖ਼ਤਮ ਹੁੰਦੇ ਹੀ ਦੋਵੇਂ ਬੰਦ ਹੋ ਜਾਂਦੇ ਹਨ।"],"ms":["Dasar Privasi","Kemas kini terakhir: {}","Dasar ini menerangkan data apa yang dikumpul, bagaimana ia digunakan dan apakah hak kamu apabila menggunakan aplikasi dizi.jpg dan laman dizijpg.com.","Data yang Kami Kumpul","Akaun: alamat e-mel, nama pengguna dan kata laluan. Kata laluan disimpan sebagai cincangan yang tidak boleh dipulihkan; akaun tetamu boleh digunakan tanpa e-mel.","Profil: maklumat yang kamu pilih untuk tambah, seperti avatar, imej muka depan, bio dan negara.","Penggunaan: sejarah tontonan, penilaian, komen, senarai, reaksi dan kegemaran kamu.","Mesej: mesej teks, imej dan suara kamu disimpan di pelayan kami. Mesej tidak disulitkan hujung-ke-hujung; ia hanya disemak untuk tujuan moderasi jika dilaporkan.","Media yang dimuat naik: foto, GIF, video dan rakaman suara yang kamu tambah pada profil, komen dan mesej.","Teknikal: alamat IP, lokasi anggaran (peringkat negara/bandar), platform peranti, versi aplikasi dan log ralat. Ini disimpan untuk keselamatan dan pembaikan masalah.","Pemberitahuan: untuk pemberitahuan tolak, kami menyimpan token peranti dan pilihan bahasa kamu. Kamu boleh mematikan pemberitahuan pada bila-bila masa dalam tetapan peranti.","Cara Kami Menggunakan Data","Kami menggunakan data kamu hanya untuk menyediakan perkhidmatan, melindungi akaun, menghantar pemberitahuan, membetulkan ralat dan mencegah penyalahgunaan. Kami tidak menjual data kamu dan tidak berkongsi dengan sesiapa untuk tujuan iklan.","Kuki dan Storan Setempat","Storan setempat hanya digunakan untuk mengekalkan log masuk kamu dan mengingati pilihan seperti bahasa dan tema. Tiada kuki iklan atau penjejakan.","Perkhidmatan Pihak Ketiga","Data siri dan filem datang daripada TMDB, maklumat platform penstriman daripada JustWatch. Pemberitahuan tolak dihantar melalui Google Firebase dan trafik laman dilindungi oleh Cloudflare. Perkhidmatan ini tertakluk pada dasar privasi masing-masing.","Penyimpanan dan Pemadaman","Data kamu disimpan selagi akaun kamu wujud. Melalui \"Padam Akaun Saya\" dalam tetapan, kamu boleh memadam akaun secara kekal; data dipadam serta-merta, salinan dalam sandaran selewat-lewatnya dalam 14 hari. Log ralat dipadam secara automatik selepas 30 hari.","Kamu boleh mengeksport data sebagai ZIP daripada tetapan; arkib dihantar ke alamat e-mel kamu.","Keselamatan","Data dihantar melalui sambungan tersulit (HTTPS) dan disimpan di pelayan dengan akses terhad.","Privasi Kanak-kanak","dizi.jpg bukan untuk kanak-kanak bawah 13 tahun.","Hak Kamu","Di bawah KVKK dan GDPR, kamu berhak mengakses, membetulkan, memadam dan memindahkan data kamu. Untuk itu, tulis kepada kami: {}","Perubahan","Jika dasar ini berubah, versi baharu akan diterbitkan di halaman ini dan tarikhnya dikemas kini.","Dengan mendaftar, kamu menerima {}.","Panggilan Suara dan Video","Kandungan panggilan tidak pernah dirakam. Audio dan video mengalir dengan penyulitan hujung ke hujung (DTLS-SRTP) antara peranti; pelayan kami tidak dapat menyahsulit, mendengar atau menyimpan trafik ini.","Hanya metadata panggilan disimpan: dengan siapa, arah mana, bila dan berapa lama. Rekod ini dipadam secar ቪዲዮ ጥሪዎች","የጥሪ ይዘት ፈጽሞ አይቀዳም። ድምፅና ቪዲዮ በመሣሪያዎች መካከል ከጫፍ እስከ ጫፍ ተመስጥሮ (DTLS-SRTP) ይተላለፋሉ፤ አገልጋዮቻችን ይህን ትራፊክ መፍታት፣ ማዳመጥ ወይም ማከማቸት አይችሉም።","የሚቀመጠው የጥሪ ሜታዳታ ብቻ ነው፦ ከማን ጋር፣ በየትኛው አቅጣጫ፣ መቼና ለምን ያህል ጊዜ። እነዚህ መዝገቦች ከ90 ቀናት በኋላ በራስ-ሰር ይሰረዛሉ።","ቀጥተኛ ግንኙነት ካልተቻለ ድምፅና ቪዲዮ ተመስጥረው በማስተላለፊያ አገልጋይ (TURN) ያልፋሉ። ማስተላለፊያው ደግሞ ይዘቱን መፍታት ወይም መቅዳት አይችልም።","ማይክሮፎን የሚሠራው በድምፅ ወይም በቪዲዮ ጥሪ ወቅት ብቻ ሲሆን ካሜራ ደግሞ በቪዲዮ ጥሪ ወቅት ብቻ ነው። ጥሪው ሲያልቅ ሁለቱም ይጠፋሉ።"],"az":["Məxfilik Siyasəti","Son yenilənmə: {}","Bu siyasət dizi.jpg tətbiqindən və dizijpg.com saytından istifadə edərkən hansı məlumatların toplandığını, necə istifadə olunduğunu və hansı hüquqlara sahib olduğunu izah edir.","Topladığımız Məlumatlar","Hesab: e-poçt ünvanı, istifadəçi adı və şifrə. Şifrələr geri qaytarıla bilməyən heş şəklində saxlanılır; qonaq hesablar e-poçtsuz istifadə oluna bilər.","Profil: avatar, örtük şəkli, bio və ölkə kimi əlavə etməyi seçdiyin məlumatlar.","İstifadə: izləmə tarixçən, qiymətləndirmələrin, şərhlərin, siyahıların, reaksiyaların və sevimlilərin.","Mesajlar: yazılı, şəkilli və səsli mesajların serverlərimizdə saxlanılır. Mesajlar uçdan-uca şifrələnmir; yalnız şikayət edildikdə moderasiya məqsədilə nəzərdən keçirilir.","Yüklənən media: profilinə, şərhlərinə və mesajlarına əlavə etdiyin foto, GIF, video və səs yazıları.","Texniki: IP ünvanı, təxmini yer (ölkə/şəhər səviyyəsində), cihaz platforması, tətbiq versiyası və xəta qeydləri. Bunlar təhlükəsizlik və nasazlıqların aradan qaldırılması üçün saxlanılır.","Bildirişlər: push bildirişləri üçün cihaz tokenin və dil seçimin saxlanılır. Bildirişləri istənilən vaxt cihazının parametrlərindən söndürə bilərsən.","Məlumatlardan Necə İstifadə Edirik","Məlumatlarından yalnız xidməti təqdim etmək, hesabını qorumaq, bildiriş göndərmək, xətaları düzəltmək və sui-istifadənin qarşısını almaq üçün istifadə edirik. Məlumatlarını satmırıq və reklam məqsədilə heç kimlə paylaşmırıq.","Kukilər və Lokal Yaddaş","Lokal yaddaşdan yalnız sessiyanı açıq saxlamaq və dil/tema kimi seçimlərini yadda saxlamaq üçün istifadə edirik. Reklam və ya izləmə kukiləri yoxdur.","Üçüncü Tərəf Xidmətləri","Serial və film məlumatları TMDB-dən, izləmə platforması məlumatları JustWatch-dan alınır. Push bildirişləri Google Firebase vasitəsilə çatdırılır, sayt trafiki Cloudflare tərəfindən qorunur. Bu xidmətlər öz məxfilik siyasətlərinə tabedir.","Saxlama və Silinmə","Məlumatların hesabın mövcud olduğu müddətdə saxlanılır. Parametrlərdəki \"Hesabımı Sil\" ilə hesabını həmişəlik silə bilərsən; məlumatların dərhal, ehtiyat nüsxələrdəki kopyaları isə ən geci 14 gün ərzində silinir. Xəta qeydləri 30 gündən sonra avtomatik silinir.","Məlumatlarını Parametrlərdən ZIP şəklində ixrac edə bilərsən; arxiv e-poçt ünvanına göndərilir.","Təhlükəsizlik","Məlumatlar şifrələnmiş bağlantı (HTTPS) üzərindən ötürülür və girişi məhdud serverlərdə saxlanılır.","Uşaqların Məxfiliyi","dizi.jpg 13 yaşdan kiçik uşaqlar üçün nəzərdə tutulmayıb.","Hüquqların","KVKK və GDPR çərçivəsində məlumatlarına giriş, düzəliş, silinmə və köçürmə hüququna sahibsən. Bu hüquqlar üçün bizə yaza bilərsən: {}","Dəyişikliklər","Bu siyasət dəyişərsə, yeni versiya bu səhifədə dərc olunacaq və yenilənmə tarixi təzələnəcək.","Qeydiyyatdan keçməklə {} qəbul etmiş olursan.","Səsli və Video Zənglər","Zənglərin məzmunu heç vaxt qeyd edilmir. Səs və video cihazlar arasında uçdan-uca şifrələnmiş (DTLS-SRTP) ötürülür; serverlərimiz bu trafiki nə deşifrə edə, nə dinləyə, nə də saxlaya bilər.","Yalnız zəng metadatası saxlanılır: kiminlə, hansı istiqamətdə, nə vaxt və nə qədər davam etdiyi. Bu qeydlər 90 gün sonra avtomatik silinir.","Birbaşa bağlantı qurmaq mümkün olmasa, səs və video şifrələnmiş halda ötürücü serverdən (TURN) keçir. Ötürücü server də məzmunu deşifrə və ya qeyd edə bilmir.","Mikrofon yalnız səsli və ya video zəng zamanı, kamera isə yalnız video zəng zamanı istifadə olunur. Zəng bitəndə hər ikisi söndürülür."],"el":["Πολιτική Απορρήτου","Τελευταία ενημέρωση: {}","Αυτή η πολιτική εξηγεί ποια δεδομένα συλλέγονται, πώς χρησιμοποιούνται και ποια είναι τα δικαιώματά σου όταν χρησιμοποιείς την εφαρμογή dizi.jpg και τον ιστότοπο dizijpg.com.","Δεδομένα που συλλέγουμε","Λογαριασμός: διεύθυνση email, όνομα χρήστη και κωδικός πρόσβασης. Οι κωδικοί αποθηκεύονται ως μη αναστρέψιμο hash· οι λογαριασμοί επισκέπτη μπορούν να χρησιμοποιηθούν χωρίς email.","Προφίλ: πληροφορίες που επιλέγεις να προσθέσεις, όπως avatar, εικόνα εξωφύλλου, βιογραφικό και χώρα.","Χρήση: το ιστορικό προβολών σου, οι βαθμολογίες, τα σχόλια, οι λίστες, οι αντιδράσεις και τα αγαπημένα σου.","Μηνύματα: τα μηνύματα κειμένου, εικόνας και φωνής σου αποθηκεύονται στους διακομιστές μας. Τα μηνύματα δεν έχουν κρυπτογράφηση από άκρο σε άκρο· εξετάζονται μόνο αν αναφερθούν, για λόγους εποπτείας.","Ανεβασμένα πολυμέσα: φωτογραφίες, GIF, βίντεο και ηχογραφήσεις που προσθέτεις στο προφίλ, στα σχόλια και στα μηνύματά σου.","Τεχνικά: διεύθυνση IP, κατά προσέγγιση τοποθεσία (επίπεδο χώρας/πόλης), πλατφόρμα συσκευής, έκδοση εφαρμογής και αρχεία σφαλμάτων. Διατηρούνται για ασφάλεια και διόρθωση προβλημάτων.","Ειδοποιήσεις: για τις push ειδοποιήσεις αποθηκεύουμε το token της συσκευής σου και τη γλώσσα που προτιμάς. Μπορείς να απενεργοποιήσεις τις ειδοποιήσεις όποτε θες από τις ρυθμίσεις της συσκευής.","Πώς χρησιμοποιούμε τα δεδομένα σου","Χρησιμοποιούμε τα δεδομένα σου μόνο για να παρέχουμε την υπηρεσία, να προστατεύουμε τον λογαριασμό σου, να στέλνουμε ειδοποιήσεις, να διορθώνουμε σφάλματα και να αποτρέπουμε την κατάχρηση. Δεν πουλάμε τα δεδομένα σου και δεν τα μοιραζόμαστε με κανέναν για διαφημιστικούς σκοπούς.","Cookies και τοπική αποθήκευση","Χρησιμοποιούμε τοπική αποθήκευση μόνο για να παραμένεις συνδεδεμένος και να θυμόμαστε προτιμήσεις όπως γλώσσα και θέμα. Δεν υπάρχουν διαφημιστικά cookies ή cookies παρακολούθησης.","Υπηρεσίες τρίτων","Τα δεδομένα σειρών και ταινιών προέρχονται από το TMDB, οι πληροφορίες πλατφορμών streaming από το JustWatch. Οι push ειδοποιήσεις παραδίδονται μέσω Google Firebase και την κίνηση του ιστότοπου προστατεύει το Cloudflare. Οι υπηρεσίες αυτές διέπονται από τις δικές τους πολιτικές απορρήτου.","Διατήρηση και διαγραφή","Τα δεδομένα σου διατηρούνται όσο υπάρχει ο λογαριασμός σου. Με το «Διαγραφή λογαριασμού» στις ρυθμίσεις μπορείς να διαγράψεις οριστικά τον λογαριασμό· τα δεδομένα διαγράφονται αμέσως και τα αντίγραφά τους στα αντίγραφα ασφαλείας το αργότερο σε 14 ημέρες. Τα αρχεία σφαλμάτων διαγράφονται αυτόματα μετά από 30 ημέρες.","Μπορείς να εξαγάγεις τα δεδομένα σου ως ZIP από τις ρυθμίσεις· το αρχείο αποστέλλεται στη διεύθυνση email σου.","Ασφάλεια","Τα δεδομένα μεταφέρονται μέσω κρυπτογραφημένων συνδέσεων (HTTPS) και αποθηκεύονται σε διακομιστές με περιορισμένη πρόσβαση.","Απόρρητο παιδιών","Το dizi.jpg δεν απευθύνεται σε παιδιά κάτω των 13 ετών.","Τα δικαιώματά σου","Βάσει KVKK και GDPR έχεις δικαίωμα πρόσβασης, διόρθωσης, διαγραφής και μεταφοράς των δεδομένων σου. Για αυτά γράψε μας: {}","Αλλαγές","Αν αλλάξει αυτή η πολιτική, η νέα έκδοση θα δημοσιευτεί σε αυτή τη σελίδα και θα ενημερωθεί η ημερομηνία.","Με την εγγραφή σου αποδέχεσαι την {}.","Φωνητικές κλήσεις και βιντεοκλήσεις","Το περιεχόμενο των κλήσεων δεν καταγράφεται ποτέ. Ο ήχος και το βίντεο ταξιδεύουν κρυπτογραφημένα από άκρο σε άκρο (DTLS-SRTP) μεταξύ των συσκευών· οι διακομιστές μας δεν μπορούν να τα αποκρυπτογραφήσουν, να τα ακούσουν ή να τα αποθηκεύσουν.","Διατηρούνται μόνο τα μεταδεδομένα της κλήσης: με ποιον, προς ποια κατεύθυνση, πότε και πόσο διήρκεσε. Αυτές οι εγγραφές διαγράφονται αυτόματα μετά από 90 ημέρες.","Αν δεν είναι δυνατή η απευθείας σύνδεση, ήχος και βίντεο περνούν κρυπτογραφημένα από έναν διακομιστή αναμετάδοσης (TURN). Ούτε αυτός μπορεί να αποκρυπτογραφήσει ή να καταγράψει το περιεχόμενο.","Το μικρόφωνο χρησιμοποιείται μόνο κατά τη διάρκεια φωνητικής κλήσης ή βιντεοκλήσης και η κάμερα μόνο κατά τη διάρκεια βιντεοκλήσης. Και τα δύο απενεργοποιούνται όταν τελειώσει η κλήση."],"hu":["Adatvédelmi Szabályzat","Utolsó frissítés: {}","Ez a szabályzat elmagyarázza, milyen adatokat gyűjtünk, hogyan használjuk őket, és milyen jogaid vannak, amikor a dizi.jpg alkalmazást és a dizijpg.com oldalt használod.","Milyen adatokat gyűjtünk","Fiók: e-mail-cím, felhasználónév és jelszó. A jelszavakat visszafejthetetlen hash formában tároljuk; a vendégfiókok e-mail nélkül is használhatók.","Profil: az általad megadott adatok, például avatár, borítókép, bemutatkozás és ország.","Használat: a megtekintési előzményeid, értékeléseid, hozzászólásaid, listáid, reakcióid és kedvenceid.","Üzenetek: a szöveges, képes és hangüzeneteidet a szervereinken tároljuk. Az üzenetek nem végpontok közötti titkosításúak; csak bejelentés esetén, moderálási célból tekintjük meg őket.","Feltöltött média: a profilodhoz, hozzászólásaidhoz és üzeneteidhez adott fotók, GIF-ek, videók és hangfelvételek.","Technikai: IP-cím, hozzávetőleges hely (ország/város szinten), eszközplatform, alkalmazásverzió és hibanaplók. Ezeket biztonsági és hibajavítási célból őrizzük.","Értesítések: a push értesítésekhez tároljuk az eszközöd tokenjét és a nyelvi beállításodat. Az értesítéseket bármikor kikapcsolhatod az eszköz beállításaiban.","Hogyan használjuk az adataidat","Az adataidat kizárólag a szolgáltatás nyújtására, a fiókod védelmére, értesítések küldésére, hibák javítására és a visszaélések megelőzésére használjuk. Az adataidat nem adjuk el, és reklámcélból senkivel sem osztjuk meg.","Sütik és helyi tárhely","A helyi tárhelyet csak arra használjuk, hogy bejelentkezve maradj, és megjegyezzük a beállításaidat, például a nyelvet és a témát. Nincsenek reklám- vagy nyomkövető sütik.","Harmadik féltől származó szolgáltatások","A sorozat- és filmadatok a TMDB-től, a streamingplatform-információk a JustWatch-tól származnak. A push értesítéseket a Google Firebase kézbesíti, az oldal forgalmát a Cloudflare védi. Ezekre a szolgáltatásokra a saját adatvédelmi szabályzataik vonatkoznak.","Tárolás és törlés","Az adataidat addig tároljuk, amíg a fiókod létezik. A beállításokban a „Fiókom törlése\" gombbal véglegesen törölheted a fiókodat; az adataid azonnal, a biztonsági mentésekben lévő másolataik legkésőbb 14 napon belül törlődnek. A hibanaplók 30 nap után automatikusan törlődnek.","Az adataidat ZIP formátumban exportálhatod a beállításokból; az archívumot az e-mail-címedre küldjük.","Biztonság","Az adatok titkosított kapcsolaton (HTTPS) keresztül utaznak, és korlátozott hozzáférésű szervereken tároljuk őket.","Gyermekek adatvédelme","A dizi.jpg nem 13 év alatti gyerekeknek készült.","A jogaid","A KVKK és a GDPR alapján jogod van az adataidhoz hozzáférni, azokat helyesbíteni, törölni és áthelyezni. Ezekben az ügyekben írj nekünk: {}","Változások","Ha ez a szabályzat változik, az új verziót ezen az oldalon tesszük közzé, és frissítjük a dátumot.","A regisztrációval elfogadod: {}.","Hang- és videohívások","A hívások tartalmát soha nem rögzítjük. A hang és a kép végponttól végpontig titkosítva (DTLS-SRTP) halad az eszközök között; szervereink ezt a forgalmat nem tudják visszafejteni, lehallgatni vagy tárolni.","Csak a hívás metaadatait tároljuk: kivel, milyen irányban, mikor és meddig tartott. Ezek a bejegyzések 90 nap után automatikusan törlődnek.","Ha közvetlen kapcsolat nem hozható létre, a hang és a kép titkosítva halad át egy továbbító kiszolgálón (TURN). Az sem tudja visszafejteni vagy rögzíteni a tartalmat.","A mikrofont csak hang- vagy videohívás közben, a kamerát csak videohívás közben használjuk. A hívás végén mindkettő kikapcsol."],"cs":["Zásady ochrany soukromí","Poslední aktualizace: {}","Tyto zásady vysvětlují, jaká data se shromažďují, jak se používají a jaká máš práva, když používáš aplikaci dizi.jpg a web dizijpg.com.","Jaká data shromažďujeme","Účet: e-mailová adresa, uživatelské jméno a heslo. Hesla se ukládají jako nevratný hash; hostovské účty lze používat bez e-mailu.","Profil: údaje, které se rozhodneš přidat, např. avatar, úvodní obrázek, bio a zemi.","Používání: tvá historie sledování, hodnocení, komentáře, seznamy, reakce a oblíbené.","Zprávy: tvé textové, obrazové a hlasové zprávy jsou uloženy na našich serverech. Zprávy nejsou šifrované end-to-end; prohlížejí se jen při nahlášení, pro účely moderace.","Nahraná média: fotky, GIFy, videa a hlasové nahrávky, které přidáš do profilu, komentářů a zpráv.","Technické údaje: IP adresa, přibližná poloha (země/město), platforma zařízení, verze aplikace a záznamy chyb. Uchovávají se kvůli bezpečnosti a ladění.","Oznámení: pro push oznámení ukládáme token tvého zařízení a zvolený jazyk. Oznámení můžeš kdykoli vypnout v nastavení zařízení.","Jak tvá data používáme","Tvá data používáme výhradně k poskytování služby, ochraně účtu, zasílání oznámení, opravám chyb a předcházení zneužití. Tvá data neprodáváme a nikomu je nepředáváme pro reklamní účely.","Cookies a místní úložiště","Místní úložiště používáme jen k tomu, abychom tě udrželi přihlášeného a zapamatovali si předvolby jako jazyk a motiv. Žádné reklamní ani sledovací cookies nejsou.","Služby třetích stran","Data o seriálech a filmech pocházejí z TMDB, informace o streamovacích platformách z JustWatch. Push oznámení doručuje Google Firebase a provoz webu chrání Cloudflare. Tyto služby se řídí vlastními zásadami ochrany soukromí.","Uchovávání a mazání","Tvá data se uchovávají, dokud existuje tvůj účet. Přes „Smazat můj účet\" v nastavení můžeš účet trvale smazat; data se vymažou okamžitě a jejich kopie v zálohách nejpozději do 14 dnů. Záznamy chyb se automaticky mažou po 30 dnech.","Svá data si můžeš z nastavení exportovat jako ZIP; archiv ti přijde na e-mail.","Zabezpečení","Data se přenášejí šifrovaným spojením (HTTPS) a ukládají na serverech s omezeným přístupem.","Soukromí dětí","dizi.jpg není určen dětem mladším 13 let.","Tvá práva","Podle KVKK a GDPR máš právo na přístup ke svým datům, jejich opravu, výmaz a přenos. V těchto věcech nám napiš: {}","Změny","Pokud se tyto zásady změní, nová verze bude zveřejněna na této stránce a datum se aktualizuje.","Registrací přijímáš {}.","Hlasové hovory a videohovory","Obsah hovorů se nikdy nenahrává. Zvuk i obraz putují mezi zařízeními koncově šifrované (DTLS-SRTP); naše servery tento provoz nedokážou dešifrovat, poslouchat ani uchovávat.","Uchovávají se pouze metadata hovoru: s kým, jakým směrem, kdy a jak dlouho trval. Tyto záznamy se po 90 dnech automaticky mažou.","Pokud přímé spojení nelze navázat, zvuk a obraz projdou šifrované přes přenosový server (TURN). Ani ten obsah nedokáže dešifrovat ani nahrát.","Mikrofon se používá jen během hlasového nebo videohovoru a kamera jen během videohovoru. Po skončení hovoru se oba vypnou."],"sv":["Integritetspolicy","Senast uppdaterad: {}","Den här policyn förklarar vilka uppgifter som samlas in, hur de används och vilka rättigheter du har när du använder appen dizi.jpg och webbplatsen dizijpg.com.","Uppgifter vi samlar in","Konto: e-postadress, användarnamn och lösenord. Lösenord lagras oåterkalleligt hashade; gästkonton kan användas utan e-post.","Profil: uppgifter du själv väljer att lägga till, som avatar, omslagsbild, bio och land.","Användning: din tittarhistorik, dina betyg, kommentarer, listor, reaktioner och favoriter.","Meddelanden: dina text-, bild- och röstmeddelanden lagras på våra servrar. Meddelanden är inte totalsträckskrypterade; de granskas endast vid en anmälan, i modereringssyfte.","Uppladdade medier: foton, GIF:ar, videor och röstinspelningar som du lägger till i din profil, dina kommentarer och meddelanden.","Tekniskt: IP-adress, ungefärlig plats (land/stad), enhetsplattform, appversion och felloggar. Dessa sparas för säkerhet och felsökning.","Aviseringar: för pushaviseringar sparar vi din enhetstoken och ditt språkval. Du kan när som helst stänga av aviseringar i enhetens inställningar.","Hur vi använder dina uppgifter","Vi använder dina uppgifter enbart för att tillhandahålla tjänsten, skydda ditt konto, skicka aviseringar, åtgärda fel och förhindra missbruk. Vi säljer inte dina uppgifter och delar dem inte med någon i reklamsyfte.","Cookies och lokal lagring","Vi använder lokal lagring endast för att hålla dig inloggad och komma ihåg val som språk och tema. Det finns inga reklam- eller spårningscookies.","Tredjepartstjänster","Serie- och filmdata kommer från TMDB, information om streamingtjänster från JustWatch. Pushaviseringar levereras via Google Firebase och webbplatstrafiken skyddas av Cloudflare. För dessa tjänster gäller deras egna integritetspolicyer.","Lagring och radering","Dina uppgifter sparas så länge ditt konto finns. Med \"Radera mitt konto\" i inställningarna kan du radera kontot permanent; dina uppgifter raderas direkt och kopior i säkerhetskopior senast inom 14 dagar. Felloggar raderas automatiskt efter 30 dagar.","Du kan exportera dina uppgifter som ZIP från inställningarna; arkivet skickas till din e-postadress.","Säkerhet","Uppgifter överförs via krypterade anslutningar (HTTPS) och lagras på servrar med begränsad åtkomst.","Barns integritet","dizi.jpg riktar sig inte till barn under 13 år.","Dina rättigheter","Enligt KVKK och GDPR har du rätt att få tillgång till, rätta, radera och flytta dina uppgifter. Skriv till oss om detta: {}","Ändringar","Om policyn ändras publiceras den nya versionen på den här sidan och datumet uppdateras.","Genom att registrera dig godkänner du {}.","Röst- och videosamtal","Innehållet i samtal spelas aldrig in. Ljud och video färdas totalsträckskrypterat (DTLS-SRTP) mellan enheterna; våra servrar kan varken dekryptera, avlyssna eller lagra denna trafik.","Endast samtalets metadata sparas: med vem, i vilken riktning, när och hur länge. Dessa poster raderas automatiskt efter 90 dagar.","Om en direktanslutning inte kan upprättas passerar ljud och video krypterat via en reläserver (TURN). Inte heller den kan dekryptera eller spela in innehållet.","Mikrofonen används bara under ett röst- eller videosamtal och kameran bara under ett videosamtal. Båda stängs av när samtalet avslutas."],"he":["מדיניות פרטיות","עדכון אחרון: {}","מדיניות זו מסבירה אילו נתונים נאספים, כיצד הם משמשים ומהן הזכויות שלך כשאתה משתמש באפליקציית dizi.jpg ובאתר dizijpg.com.","אילו נתונים אנחנו אוספים","חשבון: כתובת אימייל, שם משתמש וסיסמה. הסיסמאות נשמרות כגיבוב בלתי הפיך; בחשבונות אורח אפשר להשתמש בלי אימייל.","פרופיל: מידע שאתה בוחר להוסיף, כמו אווטאר, תמונת רקע, ביו ומדינה.","שימוש: היסטוריית הצפייה, הדירוגים, התגובות, הרשימות, הריאקציות והמועדפים שלך.","הודעות: הודעות הטקסט, התמונה והקול שלך נשמרות בשרתים שלנו. ההודעות אינן מוצפנות מקצה לקצה; הן נבדקות רק אם הוגש עליהן דיווח, לצורכי פיקוח.","מדיה שהועלתה: תמונות, קובצי GIF, סרטונים והקלטות קול שאתה מוסיף לפרופיל, לתגובות ולהודעות.","נתונים טכניים: כתובת IP, מיקום משוער (מדינה/עיר), פלטפורמת המכשיר, גרסת האפליקציה ויומני שגיאות. אלה נשמרים לצורכי אבטחה ותיקון תקלות.","התראות: לצורך התראות פוש אנחנו שומרים את אסימון המכשיר ואת שפת ההעדפה שלך. אפשר לכבות התראות בכל עת בהגדרות המכשיר.","איך אנחנו משתמשים בנתונים שלך","אנחנו משתמשים בנתונים שלך אך ורק כדי לספק את השירות, להגן על החשבון, לשלוח התראות, לתקן תקלות ולמנוע שימוש לרעה. אנחנו לא מוכרים את הנתונים שלך ולא משתפים אותם עם איש למטרות פרסום.","עוגיות ואחסון מקומי","אנחנו משתמשים באחסון מקומי רק כדי לשמור אותך מחובר ולזכור העדפות כמו שפה וערכת נושא. אין עוגיות פרסום או מעקב.","שירותי צד שלישי","נתוני הסדרות והסרטים מגיעים מ-TMDB, ומידע על פלטפורמות סטרימינג מ-JustWatch. התראות פוש נשלחות דרך Google Firebase, ותעבורת האתר מוגנת על ידי Cloudflare. שירותים אלה כפופים למדיניות הפרטיות שלהם.","שמירה ומחיקה","הנתונים שלך נשמרים כל עוד החשבון קיים. באמצעות \"מחק את החשבון שלי\" בהגדרות אפשר למחוק את החשבון לצמיתות; הנתונים נמחקים מיד, והעותקים בגיבויים בתוך 14 יום לכל היותר. יומני שגיאות נמחקים אוטומטית אחרי 30 יום.","אפשר לייצא את הנתונים שלך כקובץ ZIP מההגדרות; הארכיון נשלח לכתובת האימייל שלך.","אבטחה","הנתונים עוברים בחיבורים מוצפנים (HTTPS) ונשמרים בשרתים עם גישה מוגבלת.","פרטיות ילדים","‏dizi.jpg אינו מיועד לילדים מתחת לגיל 13.","הזכויות שלך","לפי KVKK ו-GDPR יש לך זכות לגשת לנתונים שלך, לתקן אותם, למחוק אותם ולהעביר אותם. בנושאים אלה כתוב לנו: {}","שינויים","אם המדיניות תשתנה, הגרסה החדשה תפורסם בעמוד זה והתאריך יעודכן.","בהרשמה אתה מקבל את {}.","שיחות קוליות ושיחות וידאו","תוכן השיחות לעולם אינו מוקלט. האודיו והווידאו זורמים מוצפנים מקצה לקצה (DTLS-SRTP) בין המכשירים; השרתים שלנו אינם יכולים לפענח, להאזין או לאחסן את התעבורה הזו.","נשמרים רק נתוני העל של השיחה: עם מי, באיזה כיוון, מתי וכמה זמן. רשומות אלה נמחקות אוטומטית לאחר 90 יום.","אם לא ניתן ליצור חיבור ישיר, האודיו והווידאו עוברים מוצפנים דרך שרת ממסר (TURN). גם הוא אינו יכול לפענח או להקליט את התוכן.","המיקרופון פועל רק במהלך שיחה קולית או שיחת וידאו, והמצלמה רק במהלך שיחת וידאו. שניהם נכבים בתום השיחה."],"fil":["Patakaran sa Privacy","Huling na-update: {}","Ipinapaliwanag ng patakarang ito kung anong data ang kinokolekta, paano ito ginagamit, at ano ang mga karapatan mo kapag ginagamit mo ang dizi.jpg app at ang site na dizijpg.com.","Data na Kinokolekta Namin","Account: email address, username, at password. Ang mga password ay iniimbak bilang hash na hindi na maibabalik; magagamit ang guest account kahit walang email.","Profile: impormasyong pinipili mong idagdag, tulad ng avatar, cover image, bio, at bansa.","Paggamit: ang history ng panonood mo, mga rating, komento, listahan, reaksyon, at paborito.","Mga mensahe: ang text, larawan, at voice message mo ay iniimbak sa aming mga server. Hindi end-to-end encrypted ang mga mensahe; sinusuri lang ang mga ito para sa moderation kapag ni-report.","Na-upload na media: mga larawan, GIF, video, at voice recording na idinaragdag mo sa profile, komento, at mensahe.","Teknikal: IP address, tinatayang lokasyon (antas ng bansa/lungsod), platform ng device, bersyon ng app, at mga error log. Iniimbak ang mga ito para sa seguridad at pag-aayos ng problema.","Mga notification: para sa push notification, iniimbak namin ang token ng device mo at piniling wika. Puwede mong i-off ang mga notification anumang oras sa settings ng device.","Paano Namin Ginagamit ang Data","Ginagamit lang namin ang data mo para maibigay ang serbisyo, protektahan ang account, magpadala ng notification, ayusin ang mga error, at pigilan ang pang-aabuso. Hindi namin ibinebenta ang data mo at hindi ibinabahagi kaninuman para sa advertising.","Cookies at Local Storage","Ginagamit lang ang local storage para panatilihin kang naka-login at tandaan ang mga kagustuhan tulad ng wika at tema. Walang advertising o tracking cookies.","Mga Serbisyo ng Third Party","Ang data ng mga serye at pelikula ay galing sa TMDB, ang impormasyon ng streaming platform ay galing sa JustWatch. Ang push notification ay ipinapadala sa pamamagitan ng Google Firebase, at ang trapiko ng site ay pinoprotektahan ng Cloudflare. Saklaw ang mga serbisyong ito ng kani-kanilang patakaran sa privacy.","Pag-iimbak at Pagbura","Nakaimbak ang data mo hangga't umiiral ang account mo. Sa \"Burahin ang Account Ko\" sa settings, permanente mong mabubura ang account; agad na mabubura ang data, at ang mga kopya sa backup ay sa loob ng hindi lalampas sa 14 na araw. Awtomatikong nabubura ang mga error log pagkalipas ng 30 araw.","Puwede mong i-export ang data mo bilang ZIP mula sa settings; ipapadala ang archive sa email address mo.","Seguridad","Dumadaan ang data sa mga naka-encrypt na koneksyon (HTTPS) at nakaimbak sa mga server na limitado ang access.","Privacy ng mga Bata","Ang dizi.jpg ay hindi para sa mga batang wala pang 13 taong gulang.","Mga Karapatan Mo","Sa ilalim ng KVKK at GDPR, may karapatan kang i-access, itama, burahin, at ilipat ang data mo. Para dito, sumulat sa amin: {}","Mga Pagbabago","Kapag nagbago ang patakarang ito, ilalathala ang bagong bersyon sa pahinang ito at ia-update ang petsa.","Sa pagrerehistro, tinatanggap mo ang {}.","Voice at Video Call","Hindi kailanman nirerekord ang laman ng tawag. Ang audio at video ay dumadaloy nang end-to-end encrypted (DTLS-SRTP) sa pagitan ng mga device; hindi ito kayang i-decrypt, pakinggan o itago ng aming mga server.","Metadata lang ng tawag ang itinatago: kanino, anong direksyon, kailan at gaano katagal. Awtomatikong binubura ang mga talaang ito pagkatapos ng 90 araw.","Kapag hindi posible ang direktang koneksyon, dumadaan ang audio at video sa isang relay server (TURN) habang naka-encrypt. Hindi rin kayang i-decrypt o i-record ng relay ang laman.","Ginagamit ang mikropono tuwing voice o video call lang, at ang camera tuwing video call lang. Parehong nakakasara ang mga ito pagkatapos ng tawag."],"sr":["Политика приватности","Последње ажурирање: {}","Ова политика објашњава који се подаци прикупљају, како се користе и која су твоја права када користиш апликацију dizi.jpg и сајт dizijpg.com.","Подаци које прикупљамо","Налог: имејл адреса, корисничко име и лозинка. Лозинке се чувају као неповратни хеш; гостујући налози могу се користити без имејла.","Профил: подаци које сам одлучиш да додаш, попут аватара, насловне слике, биографије и земље.","Коришћење: твоја историја гледања, оцене, коментари, листе, реакције и омиљено.","Поруке: твоје текстуалне, сликовне и гласовне поруке чувају се на нашим серверима. Поруке нису шифроване с краја на крај; прегледају се само ако буду пријављене, ради модерације.","Отпремљени медији: фотографије, GIF-ови, видео-снимци и гласовни снимци које додајеш профилу, коментарима и порукама.","Техничко: IP адреса, приближна локација (на нивоу земље/града), платформа уређаја, верзија апликације и евиденције грешака. Чувају се ради безбедности и отклањања грешака.","Обавештења: за пуш обавештења чувамо токен твог уређаја и изабрани језик. Обавештења можеш било кад искључити у подешавањима уређаја.","Како користимо твоје податке","Твоје податке користимо искључиво за пружање услуге, заштиту налога, слање обавештења, исправљање грешака и спречавање злоупотребе. Не продајемо твоје податке и не делимо их ни са ким у рекламне сврхе.","Колачићи и локално складиште","Локално складиште користимо само да останеш пријављен и да запамтимо изборе попут језика и теме. Нема рекламних ни колачића за праћење.","Услуге трећих страна","Подаци о серијама и филмовима долазе са TMDB, информације о стриминг платформама са JustWatch. Пуш обавештења испоручује Google Firebase, а саобраћај сајта штити Cloudflare. На ове услуге примењују се њихове сопствене политике приватности.","Чување и брисање","Твоји подаци се чувају док твој налог постоји. Преко „Обриши мој налог\" у подешавањима можеш трајно обрисати налог; подаци се бришу одмах, а њихове копије у резервним копијама најкасније за 14 дана. Евиденције грешака аутоматски се бришу после 30 дана.","Своје податке можеш извести као ZIP из подешавања; архива се шаље на твоју имејл адресу.","Безбедност","Подаци путују шифрованим везама (HTTPS) и чувају се на серверима са ограниченим приступом.","Приватност деце","dizi.jpg није намењен деци млађој од 13 година.","Твоја права","Према KVKK и GDPR имаш право на приступ својим подацима, исправку, брисање и пренос. За то нам пиши: {}","Измене","Ако се ова политика промени, нова верзија биће објављена на овој страници, а датум ажуриран.","Регистрацијом прихваташ {}.","Гласовни и видео позиви","Садржај позива се никада не снима. Звук и слика путују између уређаја шифровани с краја на крај (DTLS-SRTP); наши сервери не могу да их дешифрују, прислушкују нити чувају.","Чувају се само метаподаци позива: с ким, у ком смеру, када и колико је трајао. Ови записи се аутоматски бришу после 90 дана.","Ако директна веза није могућа, звук и слика пролазе шифровани кроз релејни сервер (TURN). Ни он не може да дешифрује нити сними садржај.","Микрофон се користи само током гласовног или видео позива, а камера само током видео позива. Оба се искључују када се позив заврши."],"bg":["Политика за поверителност","Последна актуализация: {}","Тази политика обяснява какви данни се събират, как се използват и какви права имаш, когато използваш приложението dizi.jpg и сайта dizijpg.com.","Какви данни събираме","Акаунт: имейл адрес, потребителско име и парола. Паролите се съхраняват като необратим хеш; гост акаунтите могат да се използват без имейл.","Профил: данните, които сам избираш да добавиш — аватар, корица, био и държава.","Използване: твоята история на гледане, оценки, коментари, списъци, реакции и любими.","Съобщения: твоите текстови, снимкови и гласови съобщения се съхраняват на нашите сървъри. Съобщенията не са криптирани от край до край; преглеждат се само при подаден сигнал, с цел модерация.","Качени файлове: снимки, GIF, видеа и гласови записи, които добавяш към профила, коментарите и съобщенията си.","Технически данни: IP адрес, приблизително местоположение (държава/град), платформа на устройството, версия на приложението и записи за грешки. Пазят се за сигурност и отстраняване на проблеми.","Известия: за push известията пазим токена на устройството ти и избрания език. Можеш да изключиш известията по всяко време от настройките на устройството.","Как използваме данните ти","Използваме данните ти единствено за да предоставяме услугата, да пазим акаунта ти, да изпращаме известия, да поправяме грешки и да предотвратяваме злоупотреби. Не продаваме данните ти и не ги споделяме с никого с рекламна цел.","Бисквитки и локално хранилище","Използваме локално хранилище само за да останеш вписан и да помним предпочитания като език и тема. Няма рекламни или проследяващи бисквитки.","Услуги на трети страни","Данните за сериали и филми идват от TMDB, информацията за стрийминг платформите — от JustWatch. Push известията се доставят чрез Google Firebase, а трафикът на сайта се защитава от Cloudflare. За тези услуги важат собствените им политики за поверителност.","Съхранение и изтриване","Данните ти се пазят, докато акаунтът ти съществува. Чрез „Изтрий акаунта ми\" в настройките можеш да изтриеш акаунта завинаги; данните се изтриват веднага, а копията им в резервните копия — най-късно до 14 дни. Записите за грешки се изтриват автоматично след 30 дни.","Можеш да експортираш данните си като ZIP от настройките; архивът се изпраща на имейл адреса ти.","Сигурност","Данните се пренасят по криптирани връзки (HTTPS) и се съхраняват на сървъри с ограничен достъп.","Поверителност на децата","dizi.jpg не е предназначен за деца под 13 години.","Твоите права","Съгласно KVKK и GDPR имаш право на достъп до данните си, коригиране, изтриване и прехвърляне. За тези въпроси ни пиши: {}","Промени","Ако тази политика се промени, новата версия ще бъде публикувана на тази страница и датата ще бъде обновена.","С регистрацията си приемаш {}.","Гласови и видеообаждания","Съдържанието на разговорите никога не се записва. Звукът и видеото се предават между устройствата с шифроване от край до край (DTLS-SRTP); нашите сървъри не могат да ги дешифрират, подслушват или съхраняват.","Съхраняват се само метаданните на обаждането: с кого, в каква посока, кога и колко е продължило. Тези записи се изтриват автоматично след 90 дни.","Ако не може да се установи пряка връзка, звукът и видеото преминават шифровани през ретранслиращ сървър (TURN). И той не може да дешифрира или запише съдържанието.","Микрофонът се използва само по време на гласово или видеообаждане, а камерата само по време на видеообаждане. И двете се изключват след края на разговора."],"da":["Privatlivspolitik","Senest opdateret: {}","Denne politik forklarer, hvilke data der indsamles, hvordan de bruges, og hvilke rettigheder du har, når du bruger appen dizi.jpg og webstedet dizijpg.com.","Data vi indsamler","Konto: e-mailadresse, brugernavn og adgangskode. Adgangskoder gemmes uigenkaldeligt hashet; gæstekonti kan bruges uden e-mail.","Profil: oplysninger du selv vælger at tilføje, som avatar, coverbillede, bio og land.","Brug: din seerhistorik, dine bedømmelser, kommentarer, lister, reaktioner og favoritter.","Beskeder: dine tekst-, billed- og talebeskeder gemmes på vores servere. Beskeder er ikke end-to-end-krypterede; de gennemses kun ved en anmeldelse, til moderation.","Uploadede medier: fotos, GIF'er, videoer og lydoptagelser, som du tilføjer til din profil, dine kommentarer og beskeder.","Teknisk: IP-adresse, omtrentlig placering (land/by), enhedsplatform, appversion og fejllogfiler. Disse gemmes af hensyn til sikkerhed og fejlfinding.","Notifikationer: til push-notifikationer gemmer vi din enhedstoken og dit sprogvalg. Du kan altid slå notifikationer fra i enhedens indstillinger.","Sådan bruger vi dine data","Vi bruger kun dine data til at levere tjenesten, beskytte din konto, sende notifikationer, rette fejl og forhindre misbrug. Vi sælger ikke dine data og deler dem ikke med nogen til reklameformål.","Cookies og lokal lagring","Vi bruger kun lokal lagring til at holde dig logget ind og huske valg som sprog og tema. Der er ingen reklame- eller sporingscookies.","Tredjepartstjenester","Serie- og filmdata kommer fra TMDB, oplysninger om streamingtjenester fra JustWatch. Push-notifikationer leveres via Google Firebase, og webstedets trafik beskyttes af Cloudflare. For disse tjenester gælder deres egne privatlivspolitikker.","Opbevaring og sletning","Dine data gemmes, så længe din konto findes. Med \"Slet min konto\" i indstillingerne kan du slette kontoen permanent; dine data slettes straks, og kopier i sikkerhedskopier senest inden for 14 dage. Fejllogfiler slettes automatisk efter 30 dage.","Du kan eksportere dine data som ZIP fra indstillingerne; arkivet sendes til din e-mailadresse.","Sikkerhed","Data overføres via krypterede forbindelser (HTTPS) og opbevares på servere med begrænset adgang.","Børns privatliv","dizi.jpg henvender sig ikke til børn under 13 år.","Dine rettigheder","I henhold til KVKK og GDPR har du ret til at få adgang til, rette, slette og flytte dine data. Skriv til os om dette: {}","Ændringer","Hvis politikken ændres, offentliggøres den nye version på denne side, og datoen opdateres.","Ved at registrere dig accepterer du {}.","Tale- og videoopkald","Indholdet af opkald optages aldrig. Lyd og video sendes end-to-end-krypteret (DTLS-SRTP) mellem enhederne; vores servere kan hverken dekryptere, aflytte eller gemme denne trafik.","Kun opkaldets metadata gemmes: med hvem, i hvilken retning, hvornår og hvor længe. Disse poster slettes automatisk efter 90 dage.","Hvis en direkte forbindelse ikke kan oprettes, sendes lyd og video krypteret gennem en relæserver (TURN). Den kan heller ikke dekryptere eller optage indholdet.","Mikrofonen bruges kun under et tale- eller videoopkald, og kameraet kun under et videoopkald. Begge slukkes, når opkaldet slutter."],"fi":["Tietosuojakäytäntö","Viimeksi päivitetty: {}","Tämä käytäntö kertoo, mitä tietoja kerätään, miten niitä käytetään ja mitkä ovat oikeutesi, kun käytät dizi.jpg-sovellusta ja dizijpg.com-sivustoa.","Keräämämme tiedot","Tili: sähköpostiosoite, käyttäjänimi ja salasana. Salasanat tallennetaan peruuttamattomana tiivisteenä; vierastilejä voi käyttää ilman sähköpostia.","Profiili: tiedot, jotka itse päätät lisätä, kuten avatar, kansikuva, bio ja maa.","Käyttö: katseluhistoriasi, arviosi, kommenttisi, listasi, reaktiosi ja suosikkisi.","Viestit: teksti-, kuva- ja ääniviestisi tallennetaan palvelimillemme. Viestejä ei ole salattu päästä päähän; niitä tarkastellaan vain moderointia varten, jos niistä tehdään ilmoitus.","Ladattu media: valokuvat, GIFit, videot ja ääninauhoitteet, joita lisäät profiiliisi, kommentteihisi ja viesteihisi.","Tekniset: IP-osoite, likimääräinen sijainti (maa-/kaupunkitasolla), laitealusta, sovellusversio ja virhelokit. Näitä säilytetään turvallisuutta ja vianetsintää varten.","Ilmoitukset: push-ilmoituksia varten tallennamme laitteesi tokenin ja kielivalintasi. Voit poistaa ilmoitukset käytöstä milloin tahansa laitteen asetuksista.","Miten käytämme tietojasi","Käytämme tietojasi vain palvelun tarjoamiseen, tilisi suojaamiseen, ilmoitusten lähettämiseen, virheiden korjaamiseen ja väärinkäytön estämiseen. Emme myy tietojasi emmekä jaa niitä kenellekään mainostarkoituksiin.","Evästeet ja paikallinen tallennustila","Käytämme paikallista tallennustilaa vain pitääksemme sinut kirjautuneena ja muistaaksemme asetukset, kuten kielen ja teeman. Mainos- tai seurantaevästeitä ei ole.","Kolmansien osapuolten palvelut","Sarja- ja elokuvatiedot tulevat TMDB:stä, suoratoistoalustojen tiedot JustWatchista. Push-ilmoitukset toimitetaan Google Firebasen kautta, ja sivuston liikennettä suojaa Cloudflare. Näihin palveluihin sovelletaan niiden omia tietosuojakäytäntöjä.","Säilytys ja poistaminen","Tietosi säilytetään niin kauan kuin tilisi on olemassa. Asetusten \"Poista tilini\" -toiminnolla voit poistaa tilisi pysyvästi; tietosi poistetaan heti ja varmuuskopioissa olevat kopiot viimeistään 14 päivässä. Virhelokit poistuvat automaattisesti 30 päivän kuluttua.","Voit viedä tietosi ZIP-muodossa asetuksista; arkisto lähetetään sähköpostiosoitteeseesi.","Turvallisuus","Tiedot siirretään salattujen yhteyksien (HTTPS) kautta ja tallennetaan palvelimille, joihin on rajoitettu pääsy.","Lasten yksityisyys","dizi.jpg ei ole tarkoitettu alle 13-vuotiaille lapsille.","Oikeutesi","KVKK:n ja GDPR:n nojalla sinulla on oikeus päästä tietoihisi sekä korjata, poistaa ja siirtää niitä. Kirjoita meille näistä asioista: {}","Muutokset","Jos tämä käytäntö muuttuu, uusi versio julkaistaan tällä sivulla ja päivämäärä päivitetään.","Rekisteröitymällä hyväksyt: {}.","Ääni- ja videopuhelut","Puheluiden sisältöä ei koskaan tallenneta. Ääni ja kuva kulkevat laitteiden välillä päästä päähän salattuina (DTLS-SRTP); palvelimemme eivät voi purkaa, kuunnella tai säilyttää tätä liikennettä.","Vain puhelun metatiedot säilytetään: kenen kanssa, kumpaan suuntaan, milloin ja kuinka kauan. Nämä merkinnät poistetaan automaattisesti 90 päivän kuluttua.","Jos suoraa yhteyttä ei saada, ääni ja kuva kulkevat salattuina välityspalvelimen (TURN) kautta. Sekään ei voi purkaa tai tallentaa sisältöä.","Mikrofonia käytetään vain ääni- tai videopuhelun aikana ja kameraa vain videopuhelun aikana. Molemmat sammutetaan puhelun päätyttyä."],"nb":["Personvernerklæring","Sist oppdatert: {}","Denne erklæringen forklarer hvilke data som samles inn når du bruker dizi.jpg-appen og nettstedet dizijpg.com, hvordan de brukes og hvilke rettigheter du har.","Data vi samler inn","Konto: e-postadresse, brukernavn og passord. Passord lagres med irreversibel hashing; gjestekontoer kan brukes uten e-post.","Profil: informasjon du selv velger å legge til, som avatar, forsidebilde, bio og land.","Bruk: visningshistorikken din, vurderingene, kommentarene, listene, reaksjonene og favorittene dine.","Meldinger: tekst-, bilde- og talemeldingene dine lagres på serverne våre. Meldinger er ikke ende-til-ende-krypterte; de gjennomgås kun for moderering hvis de blir rapportert.","Opplastede medier: bilder, GIF-er, videoer og lydopptak du legger til i profilen, kommentarene og meldingene dine.","Teknisk: IP-adresse, omtrentlig posisjon (land-/bynivå), enhetsplattform, appversjon og feillogger. Disse lagres for sikkerhet og feilsøking.","Varsler: enhetstokenet ditt og språkvalget ditt lagres for push-varsler. Du kan når som helst slå av varsler i innstillingene på enheten din.","Hvordan vi bruker dataene","Vi bruker dataene dine kun til å levere tjenesten, beskytte kontoen din, sende varsler, rette feil og forhindre misbruk. Vi selger ikke dataene dine og deler dem ikke med noen for reklameformål.","Informasjonskapsler og lokal lagring","Vi bruker lokal lagring kun for å holde deg innlogget og huske preferansene dine, som språk og tema. Det finnes ingen reklame- eller sporingsinformasjonskapsler.","Tredjepartstjenester","Serie- og filminformasjon hentes fra TMDB, og informasjon om strømmetilbydere fra JustWatch. Push-varsler leveres via Google Firebase, og trafikken til nettstedet beskyttes av Cloudflare. Disse tjenestene har sine egne personvernerklæringer.","Lagring og sletting","Dataene dine lagres så lenge kontoen din er aktiv. Du kan slette kontoen din permanent med \"Slett kontoen min\" i Innstillinger; dataene dine slettes umiddelbart, og kopier i sikkerhetskopier slettes senest innen 14 dager. Feillogger slettes automatisk etter 30 dager.","Du kan eksportere dataene dine som ZIP fra Innstillinger; arkivet sendes til e-postadressen din.","Sikkerhet","Data overføres via kryptert forbindelse (HTTPS) og lagres på servere med begrenset tilgang.","Barns personvern","dizi.jpg er ikke rettet mot barn under 13 år.","Rettighetene dine","I henhold til KVKK og GDPR har du rett til å få innsyn i, rette, slette og overføre dataene dine. Du kan skrive til oss om disse rettighetene: {}","Endringer","Hvis denne erklæringen endres, publiseres den nye versjonen på denne siden, og oppdateringsdatoen fornyes.","Ved å registrere deg godtar du {}.","Tale- og videoanrop","Innholdet i anrop blir aldri tatt opp. Lyd og video går ende-til-ende-kryptert (DTLS-SRTP) mellom enhetene; serverne våre kan verken dekryptere, avlytte eller lagre denne trafikken.","Bare metadata om anropet lagres: med hvem, i hvilken retning, når og hvor lenge. Disse oppføringene slettes automatisk etter 90 dager.","Hvis en direkte tilkobling ikke er mulig, går lyd og video kryptert gjennom en relétjener (TURN). Heller ikke den kan dekryptere eller ta opp innholdet.","Mikrofonen brukes bare under et tale- eller videoanrop, og kameraet bare under et videoanrop. Begge slås av når anropet avsluttes."]};
var ADLAR={"tr":"Türkçe","en":"English","zh":"中文","hi":"हिन्दी","es":"Español","fr":"Français","ar":"العربية","bn":"বাংলা","pt":"Português","ru":"Русский","ur":"اردو","id":"Bahasa Indonesia","de":"Deutsch","ja":"日本語","sw":"Kiswahili","mr":"मराठी","te":"తెలుగు","vi":"Tiếng Việt","ko":"한국어","ta":"தமிழ்","it":"Italiano","fa":"فارسی","pl":"Polski","uk":"Українська","ro":"Română","nl":"Nederlands","th":"ไทย","gu":"ગુજરાતી","kn":"ಕನ್ನಡ","ml":"മലയാളം","pa":"ਪੰਜਾਬੀ","ms":"Bahasa Melayu","my":"မြန်မာ","am":"አማርኛ","az":"Azərbaycanca","el":"Ελληνικά","hu":"Magyar","cs":"Čeština","sv":"Svenska","he":"עברית","fil":"Filipino","sr":"Српски","bg":"Български","da":"Dansk","fi":"Suomi","nb":"Norsk"};
var YAPI=[["tarih",1],["p",2],["h",3],["li",4],["li",5],["li",6],["li",7],["li",8],["li",9],["li",10],["h",29],["li",30],["li",31],["li",32],["li",33],["h",11],["p",12],["h",13],["p",14],["h",15],["p",16],["h",17],["p",18],["p",19],["h",20],["p",21],["h",22],["p",23],["h",24],["p",25],["h",26],["p",27]];
var RTL=['ar','he','fa','ur'];
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function dilSec(){
  try{var k=localStorage.getItem('flutter.dil');
      if(k){k=k.replace(/^"|"$/g,'');if(VERI[k])return k;}}catch(e){}
  var p=new URLSearchParams(location.search).get('dil');
  if(p&&VERI[p])return p;
  var t=(navigator.language||'en').toLowerCase();
  if(VERI[t])return t;
  t=t.split('-')[0];
  if(t==='fil'||t==='tl')return 'fil';
  if(t==='no'||t==='nn')return 'nb';
  return VERI[t]?t:'en';
}
function ciz(dil){
  var m=VERI[dil];
  document.documentElement.lang=dil;
  document.documentElement.dir=RTL.indexOf(dil)>=0?'rtl':'ltr';
  document.getElementById('baslik').textContent=m[0];
  document.title=m[0]+' — dizi.jpg';
  document.getElementById('tarih').textContent=m[1].replace('{}',GUNCELLEME);
  var html='',liste=false;
  for(var i=0;i<YAPI.length;i++){
    var tip=YAPI[i][0],metin=m[YAPI[i][1]];
    if(tip==='tarih')continue;
    if(tip==='li'&&!liste){html+='<ul>';liste=true;}
    if(tip!=='li'&&liste){html+='</ul>';liste=false;}
    var g=esc(metin).replace('{}','<a href="mailto:'+ILETISIM+'">'+ILETISIM+'</a>');
    if(tip==='h')html+='<h2>'+g+'</h2>';
    else if(tip==='p')html+='<p>'+g+'</p>';
    else html+='<li>'+g+'</li>';
  }
  if(liste)html+='</ul>';
  document.getElementById('icerik').innerHTML=html;
}
var sec=document.getElementById('dil');
Object.keys(ADLAR).forEach(function(k){
  var o=document.createElement('option');o.value=k;o.textContent=ADLAR[k];sec.appendChild(o);
});
var aktif=dilSec();
sec.value=aktif;ciz(aktif);
sec.addEventListener('change',function(){ciz(sec.value);});
</script>
