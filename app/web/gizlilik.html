var GUNCELLEME="09.08.2026", ILETISIM="iletisim@dizijpg.com";
var VERI={"tr":["Gizlilik Politikası","Son güncelleme: {}","Bu politika, dizi.jpg uygulamasını ve dizijpg.com sitesini kullandığında hangi verilerin toplandığını, nasıl kullanıldığını ve haklarının neler olduğunu açıklar.","Topladığımız Veriler","Hesap: e-posta adresi, kullanıcı adı ve şifre. Şifreler geri döndürülemez şekilde özetlenerek saklanır; misafir hesaplar e-postasız kullanılabilir.","Profil: avatar, kapak görseli, bio ve ülke gibi eklemeyi seçtiğin bilgiler.","Kullanım: izleme geçmişin, puanların, yorumların, listelerin, tepkilerin ve favorilerin.","Mesajlar: yazılı, görselli ve sesli mesajların sunucularımızda saklanır. Mesajlar uçtan uca şifreli değildir; yalnızca şikayet edilirse moderasyon amacıyla incelenir.","Yüklenen medya: profiline, yorumlarına ve mesajlarına eklediğin fotoğraf, GIF, video ve ses kayıtları.","Teknik: IP adresi, yaklaşık konum (ülke/şehir düzeyi), cihaz platformu, uygulama sürümü ve hata kayıtları. Bunlar güvenlik ve hata ayıklama için tutulur.","Bildirimler: push bildirimleri için cihaz token'ı ve dil tercihin saklanır. Bildirimleri cihazının ayarlarından istediğin zaman kapatabilirsin.","Verileri Nasıl Kullanırız","Verilerini yalnızca hizmeti sunmak, hesabını korumak, bildirim göndermek, hataları gidermek ve kötüye kullanımı önlemek için kullanırız. Verilerini satmayız, reklam amacıyla kimseyle paylaşmayız.","Çerezler ve Yerel Depolama","Yalnızca oturumunu açık tutmak ve dil/tema gibi tercihlerini hatırlamak için yerel depolama kullanırız. Reklam veya izleme çerezi yoktur.","Üçüncü Taraf Hizmetler","Dizi ve film bilgileri TMDB'den, izleme sağlayıcı bilgisi JustWatch'tan alınır. Push bildirimleri Google Firebase üzerinden iletilir, site trafiği Cloudflare tarafından korunur. Bu hizmetler kendi gizlilik politikalarına tabidir.","Saklama ve Silme","Verilerin hesabın açık olduğu sürece saklanır. Ayarlar'daki \"Hesabımı Sil\" ile hesabını kalıcı olarak silebilirsin; verilerin anında, yedeklerdeki kopyaları en geç 14 gün içinde silinir. Hata kayıtları 30 gün sonra otomatik silinir.","Verilerini Ayarlar'dan ZIP olarak dışa aktarabilirsin; arşiv e-posta adresine gönderilir.","Güvenlik","Veriler şifreli bağlantı (HTTPS) üzerinden taşınır ve erişimi sınırlı sunucularda saklanır.","Çocukların Gizliliği","dizi.jpg 13 yaşından küçük çocuklara yönelik değildir.","Hakların","KVKK ve GDPR kapsamında verilerine erişme, düzeltme, silme ve taşıma hakkına sahipsin. Bu haklar için bize yazabilirsin: {}","Değişiklikler","Bu politika değişirse yeni sürümü bu sayfada yayımlanır ve güncelleme tarihi yenilenir.","Kayıt olarak {} kabul etmiş olursun.","Sesli ve Görüntülü Aramalar","Aramaların içeriği kaydedilmez. Ses ve görüntü, cihazlar arasında uçtan uca şifreli (DTLS-SRTP) akar; sunucularımız bu trafiği çözemez, dinleyemez ve saklayamaz.","Yalnızca arama üstverisi tutulur: kiminle, hangi yönde, ne zaman ve ne kadar sürdüğü. Bu kayıtlar 90 gün sonra otomatik silinir.","Doğrudan bağlantı kurulamazsa ses ve görüntü şifreli hâlde bir aktarma sunucusundan (TURN) geçer. Aktarma sunucusu da içeriği çözemez ve kaydetmez.","Mikrofon yalnızca sesli veya görüntülü arama sırasında, kamera ise yalnızca görüntülü arama sırasında kullanılır. Arama bitince ikisi de kapatılır."],"en":["Privacy Policy","Last updated: {}","This policy explains what data is collected, how it is used, and what your rights are when you use the dizi.jpg app and the dizijpg.com website.","Data We Collect","Account: email address, username, and password. Passwords are stored as irreversible hashes; guest accounts can be used without an email.","Profile: information you choose to add, such as your avatar, cover image, bio, and country.","Usage: your watch history, ratings, comments, lists, reactions, and favorites.","Messages: your text, image, and voice messages are stored on our servers. Messages are not end-to-end encrypted; they are only reviewed for moderation purposes if reported.","Uploaded media: photos, GIFs, videos, and audio recordings you add to your profile, comments, and messages.","Technical: IP address, approximate location (country/city level), device platform, app version, and error logs. These are kept for security and debugging.","Notifications: your device token and language preference are stored for push notifications. You can turn off notifications anytime in your device settings.","How We Use Your Data","We use your data only to provide the service, protect your account, send notifications, fix errors, and prevent abuse. We never sell your data or share it with anyone for advertising.","Cookies and Local Storage","We only use local storage to keep you signed in and remember preferences like language and theme. There are no advertising or tracking cookies.","Third-Party Services","Show and movie information comes from TMDB, and streaming provider information from JustWatch. Push notifications are delivered via Google Firebase, and site traffic is protected by Cloudflare. These services are subject to their own privacy policies.","Retention and Deletion","Your data is kept for as long as your account is active. You can permanently delete your account with \"Delete My Account\" in Settings; your data is deleted immediately, and copies in backups within 14 days at the latest. Error logs are automatically deleted after 30 days.","You can export your data as a ZIP from Settings; the archive is sent to your email address.","Security","Data is transferred over an encrypted connection (HTTPS) and stored on servers with restricted access.","Children's Privacy","dizi.jpg is not intended for children under 13.","Your Rights","Under KVKK and GDPR, you have the right to access, correct, delete, and transfer your data. To exercise these rights, you can write to us at: {}","Changes","If this policy changes, the new version will be published on this page and the update date will be refreshed.","By signing up, you agree to {}.","Voice and Video Calls","Call content is never recorded. Audio and video flow end-to-end encrypted (DTLS-SRTP) between devices; our servers cannot decrypt, listen to or store this traffic.","Only call metadata is kept: with whom, in which direction, when and how long it lasted. These records are deleted automatically after 90 days.","If a direct connection cannot be established, audio and video pass through a relay server (TURN) while still encrypted. The relay cannot decrypt or record the content either.","The microphone is used only during a voice or video call, and the camera only during a video call. Both are turned off when the call ends."],"zh":["隐私政策","最近更新：{}","本政策说明你在使用 dizi.jpg 应用和 dizijpg.com 网站时，我们收集哪些数据、如何使用这些数据，以及你拥有哪些权利。","我们收集的数据","账号：电子邮箱、用户名和密码。密码以不可逆的哈希形式存储；访客账号可以不绑定邮箱使用。","个人资料：你自行选择添加的信息，例如头像、封面图、简介和国家/地区。","使用数据：你的观看历史、评分、评论、片单、表情反应和收藏。","消息：你的文字、图片和语音消息保存在我们的服务器上。消息未采用端到端加密；仅在被举报时才会出于审核目的查看。","上传的媒体：你添加到个人资料、评论和消息中的照片、GIF、视频和语音录音。","技术数据：IP 地址、大致位置（国家/城市级别）、设备平台、应用版本和错误日志。这些数据用于安全防护和排查故障。","通知：为发送推送通知，我们会保存你的设备令牌和语言偏好。你可以随时在设备设置中关闭通知。","我们如何使用你的数据","我们仅将你的数据用于提供服务、保护账号、发送通知、修复错误和防止滥用。我们不会出售你的数据，也不会出于广告目的与任何人共享。","Cookie 与本地存储","本地存储仅用于保持你的登录状态，以及记住语言、主题等偏好。没有任何广告或跟踪 Cookie。","第三方服务","剧集和电影数据来自 TMDB，流媒体平台信息来自 JustWatch。推送通知通过 Google Firebase 送达，网站流量由 Cloudflare 保护。这些服务适用其各自的隐私政策。","保存与删除","你的数据在账号存续期间保留。通过设置中的“删除我的账号”可以永久删除账号；数据会立即删除，备份中的副本最迟在 14 天内清除。错误日志在 30 天后自动删除。","你可以在设置中将数据导出为 ZIP；压缩包会发送到你的邮箱。","安全","数据通过加密连接（HTTPS）传输，并存储在访问受限的服务器上。","儿童隐私","dizi.jpg 不面向 13 岁以下的儿童。","你的权利","根据 KVKK 和 GDPR，你有权访问、更正、删除和迁移自己的数据。如需行使这些权利，请联系我们：{}","变更","如本政策发生变更，新版本将发布在本页面，并更新日期。","注册即表示你接受{}。","语音和视频通话","通话内容不会被录制。音频和视频在设备之间以端到端加密（DTLS-SRTP）方式传输；我们的服务器无法解密、监听或保存这些流量。","仅保留通话元数据：与谁、方向、时间和时长。这些记录将在 90 天后自动删除。","如果无法建立直连，音频和视频会以加密状态经过中继服务器（TURN）。中继服务器同样无法解密或记录内容。","麦克风仅在语音或视频通话期间使用，摄像头仅在视频通话期间使用。通话结束后两者都会关闭。"],"hi":["गोपनीयता नीति","आख़िरी अपडेट: {}","यह नीति बताती है कि dizi.jpg ऐप और dizijpg.com साइट इस्तेमाल करते समय कौन सा डेटा इकट्ठा होता है, कैसे इस्तेमाल होता है और तुम्हारे क्या अधिकार हैं।","हम कौन सा डेटा इकट्ठा करते हैं","खाता: ईमेल पता, यूज़रनेम और पासवर्ड। पासवर्ड ऐसे हैश में सहेजे जाते हैं जिन्हें वापस नहीं पढ़ा जा सकता; गेस्ट खाते बिना ईमेल के भी चलते हैं।","प्रोफ़ाइल: वे जानकारियाँ जो तुम खुद जोड़ना चुनते हो, जैसे अवतार, कवर इमेज, बायो और देश।","इस्तेमाल: तुम्हारा देखने का इतिहास, रेटिंग, टिप्पणियाँ, सूचियाँ, रिएक्शन और पसंदीदा।","संदेश: तुम्हारे टेक्स्ट, इमेज और वॉयस संदेश हमारे सर्वर पर सहेजे जाते हैं। संदेश एंड-टू-एंड एन्क्रिप्टेड नहीं हैं; रिपोर्ट होने पर ही मॉडरेशन के लिए देखे जाते हैं।","अपलोड किया मीडिया: फ़ोटो, GIF, वीडियो और वॉयस रिकॉर्डिंग जो तुम प्रोफ़ाइल, टिप्पणियों और संदेशों में जोड़ते हो।","तकनीकी: IP पता, अनुमानित लोकेशन (देश/शहर स्तर), डिवाइस प्लैटफ़ॉर्म, ऐप वर्ज़न और एरर लॉग। ये सुरक्षा और गड़बड़ी ठीक करने के लिए रखे जाते हैं।","सूचनाएँ: पुश सूचनाओं के लिए तुम्हारे डिवाइस का टोकन और भाषा पसंद सहेजी जाती है। सूचनाएँ डिवाइस की सेटिंग्स से कभी भी बंद कर सकते हो।","हम डेटा कैसे इस्तेमाल करते हैं","तुम्हारा डेटा सिर्फ़ सेवा देने, खाता सुरक्षित रखने, सूचनाएँ भेजने, गड़बड़ियाँ ठीक करने और दुरुपयोग रोकने के लिए इस्तेमाल होता है। हम तुम्हारा डेटा न बेचते हैं, न विज्ञापन के लिए किसी से साझा करते हैं।","कुकीज़ और लोकल स्टोरेज","लोकल स्टोरेज सिर्फ़ तुम्हें लॉग-इन रखने और भाषा/थीम जैसी पसंद याद रखने के लिए इस्तेमाल होता है। कोई विज्ञापन या ट्रैकिंग कुकी नहीं है।","थर्ड-पार्टी सेवाएँ","सीरीज़ और फ़िल्मों का डेटा TMDB से और स्ट्रीमिंग प्लैटफ़ॉर्म की जानकारी JustWatch से आती है। पुश सूचनाएँ Google Firebase से पहुँचती हैं और साइट का ट्रैफ़िक Cloudflare सुरक्षित रखता है। इन सेवाओं पर उनकी अपनी गोपनीयता नीतियाँ लागू होती हैं।","संग्रहण और हटाना","तुम्हारा डेटा तब तक रहता है जब तक तुम्हारा खाता है। सेटिंग्स में \"मेरा खाता हटाएँ\" से खाता हमेशा के लिए हटा सकते हो; डेटा तुरंत और बैकअप की प्रतियाँ ज़्यादा से ज़्यादा 14 दिन में मिट जाती हैं। एरर लॉग 30 दिन बाद अपने आप मिट जाते हैं।","सेटिंग्स से अपना डेटा ZIP के रूप में निर्यात कर सकते हो; आर्काइव तुम्हारे ईमेल पते पर भेजा जाता है।","सुरक्षा","डेटा एन्क्रिप्टेड कनेक्शन (HTTPS) से जाता है और सीमित पहुँच वाले सर्वर पर रहता है।","बच्चों की गोपनीयता","dizi.jpg 13 साल से छोटे बच्चों के लिए नहीं है।","तुम्हारे अधिकार","KVKK और GDPR के तहत तुम्हें अपने डेटा तक पहुँच, सुधार, हटाने और स्थानांतरित करने का अधिकार है। इनके लिए हमें लिखो: {}","बदलाव","यह नीति बदलने पर नया संस्करण इसी पेज पर प्रकाशित होगा और तारीख़ अपडेट होगी।","रजिस्टर करके तुम {} स्वीकार करते हो।","वॉइस और वीडियो कॉल","कॉल की सामग्री रिकॉर्ड नहीं की जाती। ऑडियो और वीडियो डिवाइसों के बीच एंड-टू-एंड एन्क्रिप्टेड (DTLS-SRTP) चलते हैं; हमारे सर्वर इस ट्रैफ़िक को डिक्रिप्ट, सुन या संग्रहीत नहीं कर सकते।","केवल कॉल मेटाडेटा रखा जाता है: किसके साथ, किस दिशा में, कब और कितनी देर। ये रिकॉर्ड 90 दिन बाद अपने आप हट जाते हैं।","यदि सीधा कनेक्शन नहीं बन पाता, तो ऑडियो और वीडियो एन्क्रिप्टेड रूप में एक रिले सर्वर (TURN) से गुज़रते हैं। रिले सर्वर भी सामग्री को डिक्रिप्ट या रिकॉर्ड नहीं कर सकता।","माइक्रोफ़ोन केवल वॉइस या वीडियो कॉल के दौरान और कैमरा केवल वीडियो कॉल के दौरान उपयोग होता है। कॉल खत्म होते ही दोनों बंद हो जाते हैं।"],"es":["Política de Privacidad","Última actualización: {}","Esta política explica qué datos se recopilan, cómo se usan y cuáles son tus derechos cuando usas la aplicación dizi.jpg y el sitio dizijpg.com.","Datos que recopilamos","Cuenta: dirección de correo, nombre de usuario y contraseña. Las contraseñas se guardan con un hash irreversible; las cuentas de invitado pueden usarse sin correo.","Perfil: la información que eliges añadir, como avatar, imagen de portada, bio y país.","Uso: tu historial de visualización, puntuaciones, comentarios, listas, reacciones y favoritos.","Mensajes: tus mensajes de texto, imagen y voz se guardan en nuestros servidores. Los mensajes no están cifrados de extremo a extremo; solo se revisan con fines de moderación si alguien los denuncia.","Contenido subido: fotos, GIF, vídeos y grabaciones de voz que añades a tu perfil, comentarios y mensajes.","Datos técnicos: dirección IP, ubicación aproximada (país/ciudad), plataforma del dispositivo, versión de la app y registros de errores. Se conservan por seguridad y para corregir fallos.","Notificaciones: para las notificaciones push guardamos el token de tu dispositivo y tu idioma. Puedes desactivarlas cuando quieras en los ajustes del dispositivo.","Cómo usamos tus datos","Usamos tus datos únicamente para prestar el servicio, proteger tu cuenta, enviar notificaciones, corregir errores y prevenir abusos. No vendemos tus datos ni los compartimos con nadie con fines publicitarios.","Cookies y almacenamiento local","Solo usamos almacenamiento local para mantener tu sesión abierta y recordar preferencias como idioma y tema. No hay cookies de publicidad ni de rastreo.","Servicios de terceros","Los datos de series y películas provienen de TMDB y la información de plataformas de streaming, de JustWatch. Las notificaciones push se envían mediante Google Firebase y el tráfico del sitio está protegido por Cloudflare. Estos servicios se rigen por sus propias políticas de privacidad.","Conservación y eliminación","Tus datos se conservan mientras tu cuenta esté activa. Con \"Eliminar mi cuenta\" en Configuración puedes borrar tu cuenta de forma permanente; tus datos se eliminan al instante y las copias de seguridad, como máximo en 14 días. Los registros de errores se borran automáticamente a los 30 días.","Puedes exportar tus datos como ZIP desde Configuración; el archivo se envía a tu dirección de correo.","Seguridad","Los datos se transmiten por conexiones cifradas (HTTPS) y se almacenan en servidores con acceso restringido.","Privacidad de los menores","dizi.jpg no está dirigido a menores de 13 años.","Tus derechos","Según KVKK y GDPR, tienes derecho a acceder a tus datos, corregirlos, eliminarlos y transferirlos. Para ejercerlos, escríbenos: {}","Cambios","Si esta política cambia, la nueva versión se publicará en esta página y se actualizará la fecha.","Al registrarte aceptas la {}.","Llamadas de voz y vídeo","El contenido de las llamadas nunca se graba. El audio y el vídeo viajan cifrados de extremo a extremo (DTLS-SRTP) entre los dispositivos; nuestros servidores no pueden descifrar, escuchar ni almacenar ese tráfico.","Solo se guardan los metadatos de la llamada: con quién, en qué dirección, cuándo y cuánto duró. Estos registros se eliminan automáticamente a los 90 días.","Si no se puede establecer una conexión directa, el audio y el vídeo pasan cifrados por un servidor de retransmisión (TURN). Ese servidor tampoco puede descifrar ni grabar el contenido.","El micrófono solo se usa durante una llamada de voz o vídeo, y la cámara solo durante una videollamada. Ambos se apagan al terminar la llamada."],"fr":["Politique de Confidentialité","Dernière mise à jour : {}","Cette politique explique quelles données sont collectées, comment elles sont utilisées et quels sont tes droits lorsque tu utilises l'application dizi.jpg et le site dizijpg.com.","Données que nous collectons","Compte : adresse e-mail, nom d'utilisateur et mot de passe. Les mots de passe sont stockés sous forme de hachage irréversible ; les comptes invités peuvent être utilisés sans e-mail.","Profil : les informations que tu choisis d'ajouter, comme l'avatar, l'image de couverture, la bio et le pays.","Utilisation : ton historique de visionnage, tes notes, commentaires, listes, réactions et favoris.","Messages : tes messages texte, image et vocaux sont stockés sur nos serveurs. Les messages ne sont pas chiffrés de bout en bout ; ils ne sont consultés qu'en cas de signalement, à des fins de modération.","Médias envoyés : photos, GIF, vidéos et enregistrements vocaux que tu ajoutes à ton profil, tes commentaires et tes messages.","Données techniques : adresse IP, localisation approximative (pays/ville), plateforme de l'appareil, version de l'application et journaux d'erreurs. Elles sont conservées pour la sécurité et le débogage.","Notifications : pour les notifications push, nous conservons le jeton de ton appareil et ta langue. Tu peux les désactiver à tout moment dans les réglages de l'appareil.","Comment nous utilisons tes données","Nous utilisons tes données uniquement pour fournir le service, protéger ton compte, envoyer des notifications, corriger les erreurs et prévenir les abus. Nous ne vendons pas tes données et ne les partageons avec personne à des fins publicitaires.","Cookies et stockage local","Nous utilisons le stockage local uniquement pour garder ta session ouverte et mémoriser tes préférences comme la langue et le thème. Il n'y a aucun cookie publicitaire ni de suivi.","Services tiers","Les données des séries et films proviennent de TMDB, les informations sur les plateformes de streaming de JustWatch. Les notifications push sont acheminées par Google Firebase et le trafic du site est protégé par Cloudflare. Ces services sont soumis à leurs propres politiques de confidentialité.","Conservation et suppression","Tes données sont conservées tant que ton compte existe. Avec « Supprimer mon compte » dans les Réglages, tu peux supprimer ton compte définitivement ; tes données sont effacées immédiatement et leurs copies dans les sauvegardes sous 14 jours au plus tard. Les journaux d'erreurs sont supprimés automatiquement après 30 jours.","Tu peux exporter tes données au format ZIP depuis les Réglages ; l'archive est envoyée à ton adresse e-mail.","Sécurité","Les données transitent par des connexions chiffrées (HTTPS) et sont stockées sur des serveurs à accès restreint.","Confidentialité des enfants","dizi.jpg ne s'adresse pas aux enfants de moins de 13 ans.","Tes droits","En vertu de la KVKK et du GDPR, tu as le droit d'accéder à tes données, de les corriger, de les supprimer et de les transférer. Pour cela, écris-nous : {}","Modifications","Si cette politique change, la nouvelle version sera publiée sur cette page et la date sera mise à jour.","En t'inscrivant, tu acceptes la {}.","Appels audio et vidéo","Le contenu des appels n’est jamais enregistré. L’audio et la vidéo circulent chiffrés de bout en bout (DTLS-SRTP) entre les appareils ; nos serveurs ne peuvent ni déchiffrer, ni écouter, ni conserver ce trafic.","Seules les métadonnées de l’appel sont conservées : avec qui, dans quel sens, quand et pendant combien de temps. Ces enregistrements sont supprimés automatiquement au bout de 90 jours.","Si une connexion directe est impossible, l’audio et la vidéo transitent chiffrés par un serveur relais (TURN). Ce relais ne peut pas non plus déchiffrer ni enregistrer le contenu.","Le microphone n’est utilisé que pendant un appel audio ou vidéo, et la caméra uniquement pendant un appel vidéo. Les deux sont coupés à la fin de l’appel."],"ar":["سياسة الخصوصية","آخر تحديث: {}","توضّح هذه السياسة ما البيانات التي تُجمع وكيف تُستخدم وما حقوقك عند استخدام تطبيق dizi.jpg وموقع dizijpg.com.","البيانات التي نجمعها","الحساب: عنوان البريد الإلكتروني واسم المستخدم وكلمة المرور. تُحفظ كلمات المرور بتجزئة لا يمكن عكسها؛ ويمكن استخدام حسابات الضيوف دون بريد إلكتروني.","الملف الشخصي: المعلومات التي تختار إضافتها مثل الصورة الرمزية وصورة الغلاف والنبذة والبلد.","الاستخدام: سجل مشاهدتك وتقييماتك وتعليقاتك وقوائمك وتفاعلاتك ومفضلاتك.","الرسائل: تُحفظ رسائلك النصية والمصوّرة والصوتية على خوادمنا. الرسائل غير مشفّرة من طرف إلى طرف؛ ولا تُراجع إلا عند الإبلاغ عنها ولأغراض الإشراف فقط.","الوسائط المرفوعة: الصور وملفات GIF والفيديوهات والتسجيلات الصوتية التي تضيفها إلى ملفك الشخصي وتعليقاتك ورسائلك.","البيانات التقنية: عنوان IP والموقع التقريبي (البلد/المدينة) ومنصة الجهاز وإصدار التطبيق وسجلات الأخطاء. تُحفظ هذه لأغراض الأمان وإصلاح الأعطال.","الإشعارات: من أجل الإشعارات الفورية نحفظ رمز جهازك ولغتك المفضّلة. يمكنك إيقاف الإشعارات في أي وقت من إعدادات جهازك.","كيف نستخدم بياناتك","نستخدم بياناتك فقط لتقديم الخدمة وحماية حسابك وإرسال الإشعارات وإصلاح الأخطاء ومنع إساءة الاستخدام. لا نبيع بياناتك ولا نشاركها مع أي جهة لأغراض إعلانية.","ملفات تعريف الارتباط والتخزين المحلي","نستخدم التخزين المحلي فقط لإبقائك مسجّل الدخول وتذكّر تفضيلاتك مثل اللغة والمظهر. لا توجد ملفات تعريف ارتباط إعلانية أو تتبّعية.","خدمات الجهات الخارجية","تأتي بيانات المسلسلات والأفلام من TMDB، ومعلومات منصات المشاهدة من JustWatch. تُرسل الإشعارات الفورية عبر Google Firebase، وتحمي Cloudflare حركة الموقع. تخضع هذه الخدمات لسياسات الخصوصية الخاصة بها.","الاحتفاظ والحذف","تُحفظ بياناتك ما دام حسابك قائمًا. يمكنك حذف حسابك نهائيًا عبر \"حذف حسابي\" في الإعدادات؛ تُحذف بياناتك فورًا وتُحذف نسخها في النسخ الاحتياطية خلال 14 يومًا كحد أقصى. وتُحذف سجلات الأخطاء تلقائيًا بعد 30 يومًا.","يمكنك تصدير بياناتك بصيغة ZIP من الإعدادات؛ ويُرسل الأرشيف إلى بريدك الإلكتروني.","الأمان","تُنقل البيانات عبر اتصالات مشفّرة (HTTPS) وتُخزّن على خوادم بوصول مقيّد.","خصوصية الأطفال","‏dizi.jpg غير موجّه للأطفال دون 13 عامًا.","حقوقك","بموجب KVKK وGDPR يحق لك الوصول إلى بياناتك وتصحيحها وحذفها ونقلها. لهذه الأمور راسلنا على: {}","التغييرات","إذا تغيّرت هذه السياسة، تُنشر النسخة الجديدة في هذه الصفحة ويُحدّث التاريخ.","بتسجيلك فإنك توافق على {}.","المكالمات الصوتية والمرئية","لا يتم تسجيل محتوى المكالمات إطلاقًا. ينتقل الصوت والفيديو مشفرين من طرف إلى طرف (DTLS-SRTP) بين الأجهزة؛ ولا تستطيع خوادمنا فك تشفير هذه البيانات أو الاستماع إليها أو تخزينها.","يتم الاحتفاظ ببيانات المكالمة الوصفية فقط: مع من، وفي أي اتجاه، ومتى، وكم استغرقت. تُحذف هذه السجلات تلقائيًا بعد 90 يومًا.","إذا تعذر إنشاء اتصال مباشر، يمر الصوت والفيديو مشفرين عبر خادم ترحيل (TURN). ولا يستطيع خادم الترحيل أيضًا فك تشفير المحتوى أو تسجيله.","يُستخدم الميكروفون فقط أثناء المكالمة الصوتية أو المرئية، وتُستخدم الكاميرا فقط أثناء مكالمة الفيديو. ويتم إيقافهما معًا عند انتهاء المكالمة."],"bn":["গোপনীয়তা নীতি","সর্বশেষ আপডেট: {}","এই নীতিতে ব্যাখ্যা করা হয়েছে dizi.jpg অ্যাপ ও dizijpg.com সাইট ব্যবহারের সময় কোন ডেটা সংগ্রহ করা হয়, কীভাবে ব্যবহার হয় এবং তোমার অধিকারগুলো কী।","আমরা যে ডেটা সংগ্রহ করি","অ্যাকাউন্ট: ইমেইল ঠিকানা, ইউজারনেম ও পাসওয়ার্ড। পাসওয়ার্ড অপরিবর্তনীয় হ্যাশ আকারে রাখা হয়; গেস্ট অ্যাকাউন্ট ইমেইল ছাড়াই ব্যবহার করা যায়।","প্রোফাইল: অবতার, কভার ছবি, বায়ো ও দেশের মতো যেসব তথ্য তুমি নিজে যোগ করতে চাও।","ব্যবহার: তোমার দেখার ইতিহাস, রেটিং, মন্তব্য, তালিকা, রিঅ্যাকশন ও পছন্দের তালিকা।","বার্তা: তোমার লেখা, ছবি ও ভয়েস বার্তা আমাদের সার্ভারে সংরক্ষিত থাকে। বার্তা এন্ড-টু-এন্ড এনক্রিপ্টেড নয়; শুধু রিপোর্ট হলে মডারেশনের জন্য দেখা হয়।","আপলোড করা মিডিয়া: প্রোফাইল, মন্তব্য ও বার্তায় যোগ করা ছবি, GIF, ভিডিও ও ভয়েস রেকর্ডিং।","প্রযুক্তিগত: IP ঠিকানা, আনুমানিক অবস্থান (দেশ/শহর পর্যায়ে), ডিভাইস প্ল্যাটফর্ম, অ্যাপ সংস্করণ ও এরর লগ। এগুলো নিরাপত্তা ও ত্রুটি সারানোর জন্য রাখা হয়।","নোটিফিকেশন: পুশ নোটিফিকেশনের জন্য তোমার ডিভাইস টোকেন ও ভাষার পছন্দ রাখা হয়। ডিভাইসের সেটিংস থেকে যেকোনো সময় নোটিফিকেশন বন্ধ করতে পারো।","ডেটা আমরা কীভাবে ব্যবহার করি","তোমার ডেটা শুধু সেবা দেওয়া, অ্যাকাউন্ট সুরক্ষা, নোটিফিকেশন পাঠানো, ত্রুটি সারানো ও অপব্যবহার ঠেকানোর জন্য ব্যবহার করি। তোমার ডেটা বিক্রি করি না, বিজ্ঞাপনের জন্য কারও সঙ্গে শেয়ারও করি না।","কুকি ও লোকাল স্টোরেজ","লোকাল স্টোরেজ শুধু তোমাকে লগইন রাখা এবং ভাষা/থিমের মতো পছন্দ মনে রাখার জন্য ব্যবহার হয়। কোনো বিজ্ঞাপনী বা ট্র্যাকিং কুকি নেই।","তৃতীয় পক্ষের সেবা","সিরিজ ও সিনেমার ডেটা আসে TMDB থেকে, স্ট্রিমিং প্ল্যাটফর্মের তথ্য JustWatch থেকে। পুশ নোটিফিকেশন Google Firebase-এর মাধ্যমে পৌঁছায় আর সাইটের ট্রাফিক Cloudflare সুরক্ষিত রাখে। এসব সেবার নিজস্ব গোপনীয়তা নীতি প্রযোজ্য।","সংরক্ষণ ও মুছে ফেলা","তোমার অ্যাকাউন্ট যতদিন আছে, ডেটাও ততদিন থাকে। সেটিংসের \"আমার অ্যাকাউন্ট মুছুন\" দিয়ে অ্যাকাউন্ট স্থায়ীভাবে মুছতে পারো; ডেটা সঙ্গে সঙ্গে আর ব্যাকআপের কপি সর্বোচ্চ ১৪ দিনের মধ্যে মুছে যায়। এরর লগ ৩০ দিন পর স্বয়ংক্রিয়ভাবে মুছে যায়।","সেটিংস থেকে তোমার ডেটা ZIP আকারে এক্সপোর্ট করতে পারো; আর্কাইভ তোমার ইমেইল ঠিকানায় পাঠানো হয়।","নিরাপত্তা","ডেটা এনক্রিপ্টেড সংযোগে (HTTPS) যায় এবং সীমিত প্রবেশাধিকারের সার্ভারে রাখা হয়।","শিশুদের গোপনীয়তা","dizi.jpg ১৩ বছরের কম বয়সী শিশুদের জন্য নয়।","তোমার অধিকার","KVKK ও GDPR অনুযায়ী তোমার ডেটায় প্রবেশ, সংশোধন, মুছে ফেলা ও স্থানান্তরের অধিকার আছে। এসবের জন্য আমাদের লেখো: {}","পরিবর্তন","এই নীতি বদলালে নতুন সংস্করণ এই পাতায় প্রকাশ হবে এবং তারিখ আপডেট হবে।","নিবন্ধন করে তুমি {} মেনে নিচ্ছ।","ভয়েস ও ভিডিও কল","কলের বিষয়বস্তু কখনও রেকর্ড করা হয় না। অডিও ও ভিডিও ডিভাইসের মধ্যে এন্ড-টু-এন্ড এনক্রিপ্টেড (DTLS-SRTP) অবস্থায় চলে; আমাদের সার্ভার এই ট্রাফিক ডিক্রিপ্ট, শুনতে বা সংরক্ষণ করতে পারে না।","শুধু কল মেটাডেটা রাখা হয়: কার সাথে, কোন দিকে, কখন এবং কত সময় ধরে। এই রেকর্ডগুলো 90 দিন পরে স্বয়ংক্রিয়ভাবে মুছে যায়।","সরাসরি সংযোগ সম্ভব না হলে অডিও ও ভিডিও এনক্রিপ্টেড অবস্থায় একটি রিলে সার্ভারের (TURN) মধ্য দিয়ে যায়। রিলে সার্ভারও বিষয়বস্তু ডিক্রিপ্ট বা রেকর্ড করতে পারে না।","মাইক্রোফোন শুধু ভয়েস বা ভিডিও কলের সময় এবং ক্যামেরা শুধু ভিডিও কলের সময় ব্যবহার হয়। কল শেষ হলে দুটোই বন্ধ হয়ে যায়।"],"pt":["Política de Privacidade","Última atualização: {}","Esta política explica quais dados são coletados, como são usados e quais são os seus direitos ao usar o aplicativo dizi.jpg e o site dizijpg.com.","Dados que coletamos","Conta: endereço de e-mail, nome de usuário e senha. As senhas são armazenadas com hash irreversível; contas de convidado podem ser usadas sem e-mail.","Perfil: informações que você escolhe adicionar, como avatar, imagem de capa, bio e país.","Uso: seu histórico de exibição, notas, comentários, listas, reações e favoritos.","Mensagens: suas mensagens de texto, imagem e voz ficam armazenadas em nossos servidores. As mensagens não têm criptografia de ponta a ponta; elas só são analisadas, para fins de moderação, se forem denunciadas.","Mídia enviada: fotos, GIF, vídeos e gravações de voz que você adiciona ao seu perfil, comentários e mensagens.","Dados técnicos: endereço IP, localização aproximada (país/cidade), plataforma do dispositivo, versão do aplicativo e registros de erros. São mantidos por segurança e para correção de falhas.","Notificações: para notificações push, guardamos o token do seu dispositivo e seu idioma. Você pode desativá-las quando quiser nas configurações do dispositivo.","Como usamos seus dados","Usamos seus dados apenas para fornecer o serviço, proteger sua conta, enviar notificações, corrigir erros e prevenir abusos. Não vendemos seus dados nem os compartilhamos com ninguém para fins publicitários.","Cookies e armazenamento local","Usamos armazenamento local apenas para manter você conectado e lembrar preferências como idioma e tema. Não há cookies de publicidade nem de rastreamento.","Serviços de terceiros","Os dados de séries e filmes vêm do TMDB e as informações de plataformas de streaming, do JustWatch. As notificações push são entregues pelo Google Firebase e o tráfego do site é protegido pela Cloudflare. Esses serviços seguem suas próprias políticas de privacidade.","Retenção e exclusão","Seus dados são mantidos enquanto sua conta existir. Com \"Excluir minha conta\" nas Configurações, você pode excluir sua conta permanentemente; seus dados são apagados na hora e as cópias em backups, em até 14 dias. Os registros de erros são apagados automaticamente após 30 dias.","Você pode exportar seus dados como ZIP nas Configurações; o arquivo é enviado para o seu e-mail.","Segurança","Os dados trafegam por conexões criptografadas (HTTPS) e ficam em servidores com acesso restrito.","Privacidade de crianças","O dizi.jpg não é destinado a menores de 13 anos.","Seus direitos","De acordo com a KVKK e o GDPR, você tem direito de acessar, corrigir, excluir e transferir seus dados. Para isso, escreva para: {}","Alterações","Se esta política mudar, a nova versão será publicada nesta página e a data será atualizada.","Ao se cadastrar, você aceita a {}.","Chamadas de voz e vídeo","O conteúdo das chamadas nunca é gravado. Áudio e vídeo trafegam com criptografia de ponta a ponta (DTLS-SRTP) entre os dispositivos; nossos servidores não conseguem descriptografar, ouvir ou armazenar esse tráfego.","Somente os metadados da chamada são guardados: com quem, em qual direção, quando e quanto durou. Esses registros são apagados automaticamente após 90 dias.","Se não for possível estabelecer uma conexão direta, áudio e vídeo passam criptografados por um servidor de retransmissão (TURN). Esse servidor também não consegue descriptografar nem gravar o conteúdo.","O microfone é usado apenas durante uma chamada de voz ou vídeo, e a câmera apenas durante uma videochamada. Ambos são desligados quando a chamada termina."],"ru":["Политика конфиденциальности","Последнее обновление: {}","Эта политика объясняет, какие данные собираются, как они используются и какие у тебя есть права при использовании приложения dizi.jpg и сайта dizijpg.com.","Какие данные мы собираем","Аккаунт: адрес электронной почты, имя пользователя и пароль. Пароли хранятся в виде необратимого хеша; гостевыми аккаунтами можно пользоваться без почты.","Профиль: сведения, которые ты добавляешь по желанию, — аватар, обложка, био и страна.","Использование: твоя история просмотров, оценки, комментарии, списки, реакции и избранное.","Сообщения: твои текстовые, графические и голосовые сообщения хранятся на наших серверах. Сообщения не защищены сквозным шифрованием; их просматривают только при жалобе, в целях модерации.","Загруженные файлы: фото, GIF, видео и голосовые записи, которые ты добавляешь в профиль, комментарии и сообщения.","Технические данные: IP-адрес, приблизительное местоположение (страна/город), платформа устройства, версия приложения и журналы ошибок. Они хранятся для безопасности и отладки.","Уведомления: для push-уведомлений мы храним токен твоего устройства и выбранный язык. Уведомления можно в любой момент отключить в настройках устройства.","Как мы используем твои данные","Мы используем твои данные только для работы сервиса, защиты аккаунта, отправки уведомлений, исправления ошибок и предотвращения злоупотреблений. Мы не продаём твои данные и не передаём их никому в рекламных целях.","Cookie и локальное хранилище","Локальное хранилище используется только для того, чтобы не разлогинивать тебя и запоминать настройки вроде языка и темы. Рекламных и отслеживающих cookie нет.","Сторонние сервисы","Данные о сериалах и фильмах поступают из TMDB, сведения о стриминговых платформах — из JustWatch. Push-уведомления доставляются через Google Firebase, трафик сайта защищает Cloudflare. На эти сервисы распространяются их собственные политики конфиденциальности.","Хранение и удаление","Твои данные хранятся, пока существует аккаунт. Через «Удалить аккаунт» в настройках можно удалить аккаунт навсегда; данные стираются сразу, а их копии в резервных копиях — не позднее чем через 14 дней. Журналы ошибок автоматически удаляются через 30 дней.","Ты можешь выгрузить свои данные в виде ZIP из настроек; архив придёт на твою электронную почту.","Безопасность","Данные передаются по зашифрованным соединениям (HTTPS) и хранятся на серверах с ограниченным доступом.","Конфиденциальность детей","dizi.jpg не предназначен для детей младше 13 лет.","Твои права","Согласно KVKK и GDPR ты имеешь право на доступ к своим данным, их исправление, удаление и перенос. По этим вопросам напиши нам: {}","Изменения","Если политика изменится, новая версия будет опубликована на этой странице, а дата обновления — изменена.","Регистрируясь, ты принимаешь {}.","Голосовые и видеозвонки","Содержимое звонков не записывается. Аудио и видео передаются между устройствами со сквозным шифрованием (DTLS-SRTP); наши серверы не могут расшифровать, прослушать или сохранить этот трафик.","Хранятся только метаданные звонка: с кем, в каком направлении, когда и сколько он длился. Эти записи автоматически удаляются через 90 дней.","Если прямое соединение установить не удаётся, аудио и видео проходят через ретранслирующий сервер (TURN) в зашифрованном виде. Ретранслятор тоже не может расшифровать или записать содержимое.","Микрофон используется только во время голосового или видеозвонка, а камера — только во время видеозвонка. По окончании звонка оба отключаются."],"ur":["رازداری کی پالیسی","آخری اپڈیٹ: {}","یہ پالیسی بتاتی ہے کہ dizi.jpg ایپ اور dizijpg.com سائٹ استعمال کرتے وقت کون سا ڈیٹا جمع کیا جاتا ہے، کیسے استعمال ہوتا ہے اور تمہارے کیا حقوق ہیں۔","ہم کون سا ڈیٹا جمع کرتے ہیں","اکاؤنٹ: ای میل ایڈریس، صارف نام اور پاس ورڈ۔ پاس ورڈ ناقابلِ واپسی ہیش کی صورت میں محفوظ ہوتے ہیں؛ مہمان اکاؤنٹ بغیر ای میل کے استعمال کیے جا سکتے ہیں۔","پروفائل: وہ معلومات جو تم خود شامل کرنا چاہو، جیسے اوتار، کور تصویر، بایو اور ملک۔","استعمال: تمہاری دیکھنے کی ہسٹری، ریٹنگز، تبصرے، فہرستیں، ری ایکشنز اور پسندیدہ۔","پیغامات: تمہارے تحریری، تصویری اور صوتی پیغامات ہمارے سرورز پر محفوظ ہوتے ہیں۔ پیغامات اینڈ ٹو اینڈ انکرپٹڈ نہیں ہیں؛ صرف رپورٹ ہونے پر ماڈریشن کے لیے دیکھے جاتے ہیں۔","اپ لوڈ کردہ میڈیا: تصاویر، GIF، ویڈیوز اور صوتی ریکارڈنگز جو تم پروفائل، تبصروں اور پیغامات میں شامل کرتے ہو۔","تکنیکی ڈیٹا: IP ایڈریس، تخمینی مقام (ملک/شہر)، ڈیوائس پلیٹ فارم، ایپ ورژن اور ایرر لاگز۔ یہ سکیورٹی اور خرابیاں دور کرنے کے لیے رکھے جاتے ہیں۔","اطلاعات: پش اطلاعات کے لیے ہم تمہاری ڈیوائس کا ٹوکن اور زبان کی ترجیح محفوظ رکھتے ہیں۔ تم جب چاہو ڈیوائس کی سیٹنگز سے اطلاعات بند کر سکتے ہو۔","ہم تمہارا ڈیٹا کیسے استعمال کرتے ہیں","ہم تمہارا ڈیٹا صرف سروس فراہم کرنے، اکاؤنٹ محفوظ رکھنے، اطلاعات بھیجنے، خرابیاں دور کرنے اور غلط استعمال روکنے کے لیے استعمال کرتے ہیں۔ ہم تمہارا ڈیٹا نہ بیچتے ہیں اور نہ اشتہاری مقاصد کے لیے کسی سے شیئر کرتے ہیں۔","کوکیز اور لوکل اسٹوریج","لوکل اسٹوریج صرف تمہیں لاگ ان رکھنے اور زبان و تھیم جیسی ترجیحات یاد رکھنے کے لیے استعمال ہوتی ہے۔ کوئی اشتہاری یا ٹریکنگ کوکی نہیں ہے۔","تیسرے فریق کی سروسز","سیریز اور فلموں کا ڈیٹا TMDB سے اور اسٹریمنگ پلیٹ فارمز کی معلومات JustWatch سے آتی ہیں۔ پش اطلاعات Google Firebase کے ذریعے پہنچائی جاتی ہیں اور سائٹ کی ٹریفک کو Cloudflare محفوظ رکھتا ہے۔ یہ سروسز اپنی اپنی رازداری پالیسیوں کے تابع ہیں۔","ذخیرہ اور حذف","تمہارا ڈیٹا اس وقت تک محفوظ رہتا ہے جب تک تمہارا اکاؤنٹ موجود ہے۔ سیٹنگز میں \"میرا اکاؤنٹ حذف کریں\" سے اکاؤنٹ مستقل طور پر حذف کر سکتے ہو؛ ڈیٹا فوراً اور بیک اپ میں موجود نقول زیادہ سے زیادہ 14 دن میں حذف ہو جاتی ہیں۔ ایرر لاگز 30 دن بعد خودکار طور پر حذف ہو جاتے ہیں۔","تم سیٹنگز سے اپنا ڈیٹا ZIP کی صورت میں ایکسپورٹ کر سکتے ہو؛ آرکائیو تمہارے ای میل ایڈریس پر بھیجا جاتا ہے۔","سکیورٹی","ڈیٹا انکرپٹڈ کنکشنز (HTTPS) کے ذریعے منتقل ہوتا ہے اور محدود رسائی والے سرورز پر محفوظ رہتا ہے۔","بچوں کی رازداری","‏dizi.jpg تیرہ (13) سال سے کم عمر بچوں کے لیے نہیں ہے۔","تمہارے حقوق","KVKK اور GDPR کے تحت تمہیں اپنے ڈیٹا تک رسائی، درستی، حذف اور منتقلی کا حق حاصل ہے۔ ان امور کے لیے ہمیں لکھو: {}","تبدیلیاں","اگر یہ پالیسی تبدیل ہو تو نیا ورژن اسی صفحے پر شائع ہوگا اور تاریخ اپڈیٹ کر دی جائے گی۔","رجسٹر ہو کر تم {} قبول کرتے ہو۔","وائس اور ویڈیو کالیں","کال کا مواد کبھی ریکارڈ نہیں کیا جاتا۔ آڈیو اور ویڈیو آلات کے درمیان اینڈ ٹو اینڈ خفیہ کاری (DTLS-SRTP) کے ساتھ چلتے ہیں؛ ہمارے سرورز اس ٹریفک کو ڈی کرپٹ، سن یا محفوظ نہیں کر سکتے۔","صرف کال میٹا ڈیٹا رکھا جاتا ہے: کس کے ساتھ، کس سمت میں، کب اور کتنی دیر۔ یہ ریکارڈ 90 دن بعد خود بخود حذف ہو جاتے ہیں۔","اگر براہِ راست رابطہ نہ بن سکے تو آڈیو اور ویڈیو خفیہ حالت میں ایک ریلے سرور (TURN) سے گزرتے ہیں۔ ریلے سرور بھی مواد کو ڈی کرپٹ یا ریکارڈ نہیں کر سکتا۔","مائیکروفون صرف وائس یا ویڈیو کال کے دوران اور کیمرہ صرف ویڈیو کال کے دوران استعمال ہوتا ہے۔ کال ختم ہوتے ہی دونوں بند ہو جاتے ہیں۔"],"id":["Kebijakan Privasi","Terakhir diperbarui: {}","Kebijakan ini menjelaskan data apa yang dikumpulkan, bagaimana digunakan, dan apa saja hakmu saat memakai aplikasi dizi.jpg dan situs dizijpg.com.","Data yang Kami Kumpulkan","Akun: alamat email, nama pengguna, dan kata sandi. Kata sandi disimpan sebagai hash yang tidak bisa dibalik; akun tamu bisa dipakai tanpa email.","Profil: informasi yang kamu pilih untuk ditambahkan, seperti avatar, gambar sampul, bio, dan negara.","Penggunaan: riwayat tontonan, penilaian, komentar, daftar, reaksi, dan favoritmu.","Pesan: pesan teks, gambar, dan suaramu disimpan di server kami. Pesan tidak terenkripsi end-to-end; hanya ditinjau untuk moderasi jika dilaporkan.","Media yang diunggah: foto, GIF, video, dan rekaman suara yang kamu tambahkan ke profil, komentar, dan pesan.","Teknis: alamat IP, perkiraan lokasi (tingkat negara/kota), platform perangkat, versi aplikasi, dan log kesalahan. Ini disimpan untuk keamanan dan perbaikan masalah.","Notifikasi: untuk notifikasi push, kami menyimpan token perangkatmu dan pilihan bahasa. Kamu bisa mematikan notifikasi kapan saja dari pengaturan perangkat.","Cara Kami Menggunakan Data","Kami memakai datamu hanya untuk menyediakan layanan, melindungi akun, mengirim notifikasi, memperbaiki kesalahan, dan mencegah penyalahgunaan. Kami tidak menjual datamu dan tidak membagikannya kepada siapa pun untuk iklan.","Cookie dan Penyimpanan Lokal","Penyimpanan lokal hanya dipakai untuk menjagamu tetap masuk dan mengingat preferensi seperti bahasa dan tema. Tidak ada cookie iklan atau pelacakan.","Layanan Pihak Ketiga","Data serial dan film berasal dari TMDB, informasi platform streaming dari JustWatch. Notifikasi push dikirim lewat Google Firebase, dan lalu lintas situs dilindungi Cloudflare. Layanan ini tunduk pada kebijakan privasi masing-masing.","Penyimpanan dan Penghapusan","Datamu disimpan selama akunmu ada. Lewat \"Hapus Akun Saya\" di pengaturan, kamu bisa menghapus akun secara permanen; data langsung dihapus, salinan di cadangan paling lambat dalam 14 hari. Log kesalahan otomatis terhapus setelah 30 hari.","Kamu bisa mengekspor datamu sebagai ZIP dari pengaturan; arsipnya dikirim ke alamat emailmu.","Keamanan","Data dikirim lewat koneksi terenkripsi (HTTPS) dan disimpan di server dengan akses terbatas.","Privasi Anak","dizi.jpg tidak ditujukan untuk anak di bawah 13 tahun.","Hakmu","Berdasarkan KVKK dan GDPR, kamu berhak mengakses, memperbaiki, menghapus, dan memindahkan datamu. Untuk itu, tulis kepada kami: {}","Perubahan","Jika kebijakan ini berubah, versi baru akan dipublikasikan di halaman ini dan tanggalnya diperbarui.","Dengan mendaftar, kamu menerima {}.","Panggilan Suara dan Video","Isi panggilan tidak pernah direkam. Audio dan video mengalir terenkripsi ujung ke ujung (DTLS-SRTP) antar perangkat; server kami tidak dapat mendekripsi, mendengarkan, atau menyimpan lalu lintas ini.","Hanya metadata panggilan yang disimpan: dengan siapa, ke arah mana, kapan, dan berapa lama. Catatan ini dihapus otomatis setelah 90 hari.","Jika koneksi langsung tidak dapat dibuat, audio dan video melewati server relai (TURN) dalam keadaan terenkripsi. Server relai juga tidak dapat mendekripsi atau merekam isinya.","Mikrofon hanya digunakan selama panggilan suara atau video, dan kamera hanya selama panggilan video. Keduanya dimatikan saat panggilan berakhir."],"de":["Datenschutzerklärung","Zuletzt aktualisiert: {}","Diese Erklärung beschreibt, welche Daten erhoben werden, wie sie verwendet werden und welche Rechte du hast, wenn du die dizi.jpg-App und die Website dizijpg.com nutzt.","Welche Daten wir erheben","Konto: E-Mail-Adresse, Benutzername und Passwort. Passwörter werden unumkehrbar gehasht gespeichert; Gastkonten können ohne E-Mail genutzt werden.","Profil: Angaben, die du freiwillig hinzufügst, etwa Avatar, Titelbild, Bio und Land.","Nutzung: dein Verlauf, deine Bewertungen, Kommentare, Listen, Reaktionen und Favoriten.","Nachrichten: deine Text-, Bild- und Sprachnachrichten werden auf unseren Servern gespeichert. Nachrichten sind nicht Ende-zu-Ende-verschlüsselt; sie werden nur bei einer Meldung zu Moderationszwecken eingesehen.","Hochgeladene Medien: Fotos, GIF, Videos und Sprachaufnahmen, die du deinem Profil, deinen Kommentaren und Nachrichten hinzufügst.","Technisches: IP-Adresse, ungefährer Standort (Land/Stadt), Geräteplattform, App-Version und Fehlerprotokolle. Diese Daten dienen der Sicherheit und Fehlerbehebung.","Benachrichtigungen: für Push-Benachrichtigungen speichern wir dein Geräte-Token und deine Spracheinstellung. Du kannst Benachrichtigungen jederzeit in den Geräteeinstellungen deaktivieren.","Wie wir deine Daten verwenden","Wir verwenden deine Daten ausschließlich, um den Dienst bereitzustellen, dein Konto zu schützen, Benachrichtigungen zu senden, Fehler zu beheben und Missbrauch zu verhindern. Wir verkaufen deine Daten nicht und geben sie nicht zu Werbezwecken weiter.","Cookies und lokaler Speicher","Wir nutzen lokalen Speicher nur, um dich angemeldet zu halten und Einstellungen wie Sprache und Design zu merken. Es gibt keine Werbe- oder Tracking-Cookies.","Dienste von Drittanbietern","Serien- und Filmdaten stammen von TMDB, Streaming-Anbieter-Daten von JustWatch. Push-Benachrichtigungen werden über Google Firebase zugestellt, der Website-Verkehr wird von Cloudflare geschützt. Für diese Dienste gelten deren eigene Datenschutzerklärungen.","Speicherung und Löschung","Deine Daten werden gespeichert, solange dein Konto besteht. Über \"Konto löschen\" in den Einstellungen kannst du dein Konto dauerhaft löschen; deine Daten werden sofort gelöscht, Kopien in Backups spätestens nach 14 Tagen. Fehlerprotokolle werden nach 30 Tagen automatisch gelöscht.","Du kannst deine Daten in den Einstellungen als ZIP exportieren; das Archiv wird an deine E-Mail-Adresse gesendet.","Sicherheit","Daten werden über verschlüsselte Verbindungen (HTTPS) übertragen und auf Servern mit beschränktem Zugriff gespeichert.","Datenschutz von Kindern","dizi.jpg richtet sich nicht an Kinder unter 13 Jahren.","Deine Rechte","Nach KVKK und GDPR hast du das Recht, auf deine Daten zuzugreifen, sie zu berichtigen, zu löschen und zu übertragen. Schreib uns dazu einfach: {}","Änderungen","Wenn sich diese Erklärung ändert, wird die neue Fassung auf dieser Seite veröffentlicht und das Aktualisierungsdatum erneuert.","Mit der Registrierung akzeptierst du die {}.","Sprach- und Videoanrufe","Anrufinhalte werden niemals aufgezeichnet. Audio und Video fließen Ende-zu-Ende-verschlüsselt (DTLS-SRTP) zwischen den Geräten; unsere Server können diesen Datenverkehr weder entschlüsseln noch mithören oder speichern.","Es werden nur Anruf-Metadaten gespeichert: mit wem, in welche Richtung, wann und wie lange. Diese Einträge werden nach 90 Tagen automatisch gelöscht.","Wenn keine direkte Verbindung möglich ist, laufen Audio und Video verschlüsselt über einen Relay-Server (TURN). Auch dieser kann die Inhalte weder entschlüsseln noch aufzeichnen.","Das Mikrofon wird nur während eines Sprach- oder Videoanrufs verwendet, die Kamera nur während eines Videoanrufs. Beide werden nach dem Anruf ausgeschaltet."],"ja":["プライバシーポリシー","最終更新：{}","このポリシーでは、dizi.jpg アプリと dizijpg.com サイトの利用時にどのようなデータが収集され、どのように使われ、あなたにどんな権利があるかを説明します。","収集するデータ","アカウント：メールアドレス、ユーザー名、パスワード。パスワードは復元できないハッシュとして保存されます。ゲストアカウントはメールなしでも利用できます。","プロフィール：アバター、カバー画像、自己紹介、国など、あなたが任意で追加する情報。","利用状況：視聴履歴、評価、コメント、リスト、リアクション、お気に入り。","メッセージ：テキスト・画像・ボイスメッセージは当社のサーバーに保存されます。メッセージはエンドツーエンド暗号化されていません。通報された場合にのみ、モデレーションのために確認されます。","アップロードしたメディア：プロフィール、コメント、メッセージに追加した写真、GIF、動画、音声録音。","技術データ：IP アドレス、おおよその位置（国・都市レベル）、端末プラットフォーム、アプリのバージョン、エラーログ。これらはセキュリティと不具合修正のために保持されます。","通知：プッシュ通知のために端末トークンと言語設定を保存します。通知は端末の設定からいつでもオフにできます。","データの使いみち","あなたのデータは、サービスの提供、アカウントの保護、通知の送信、不具合の修正、不正利用の防止のためだけに使用します。データを販売したり、広告目的で第三者と共有したりすることはありません。","Cookie とローカルストレージ","ローカルストレージは、ログイン状態の維持と、言語やテーマなどの設定を記憶するためだけに使います。広告用・追跡用の Cookie はありません。","第三者サービス","ドラマや映画のデータは TMDB から、配信プラットフォーム情報は JustWatch から取得しています。プッシュ通知は Google Firebase 経由で配信され、サイトのトラフィックは Cloudflare が保護しています。これらのサービスには各社のプライバシーポリシーが適用されます。","保存と削除","あなたのデータはアカウントが存在する間保存されます。設定の「アカウントを削除」でアカウントを完全に削除できます。データは即時に、バックアップ内のコピーも遅くとも 14 日以内に削除されます。エラーログは 30 日後に自動削除されます。","設定からデータを ZIP としてエクスポートできます。アーカイブはあなたのメールアドレスに送信されます。","セキュリティ","データは暗号化された接続（HTTPS)で転送され、アクセスが制限されたサーバーに保存されます。","子どものプライバシー","dizi.jpg は 13 歳未満の子ども向けではありません。","あなたの権利","KVKK と GDPR に基づき、あなたには自分のデータへのアクセス、訂正、削除、移転の権利があります。ご希望の場合はこちらまでご連絡ください：{}","変更","このポリシーが変更された場合、新しい版をこのページで公開し、日付を更新します。","登録すると、{}に同意したことになります。","音声通話とビデオ通話","通話の内容は記録されません。音声と映像は端末間でエンドツーエンド暗号化（DTLS-SRTP）されて流れ、当社のサーバーはこの通信を復号も、傍受も、保存もできません。","保存されるのは通話のメタデータのみです（相手、方向、日時、通話時間）。これらの記録は90日後に自動的に削除されます。","直接接続できない場合、音声と映像は暗号化されたまま中継サーバー（TURN）を経由します。中継サーバーも内容を復号したり記録したりはできません。","マイクは音声通話またはビデオ通話中のみ、カメラはビデオ通話中のみ使用されます。通話が終わると両方ともオフになります。"],"sw":["Sera ya Faragha","Sasisho la mwisho: {}","Sera hii inaeleza data gani hukusanywa, jinsi inavyotumika na haki zako ni zipi unapotumia programu ya dizi.jpg na tovuti ya dizijpg.com.","Data Tunayokusanya","Akaunti: anwani ya barua pepe, jina la mtumiaji na nenosiri. Manenosiri huhifadhiwa kama heshi isiyoweza kurejeshwa; akaunti za mgeni zinaweza kutumika bila barua pepe.","Wasifu: taarifa unazochagua kuongeza, kama avatari, picha ya jalada, wasifu mfupi na nchi.","Matumizi: historia yako ya kutazama, ukadiriaji, maoni, orodha, riaksheni na vipendwa.","Ujumbe: ujumbe wako wa maandishi, picha na sauti huhifadhiwa kwenye seva zetu. Ujumbe haujasimbwa kutoka mwanzo hadi mwisho; hukaguliwa tu kwa madhumuni ya usimamizi endapo utaripotiwa.","Media zilizopakiwa: picha, GIF, video na rekodi za sauti unazoongeza kwenye wasifu, maoni na ujumbe wako.","Kiufundi: anwani ya IP, mahali pa makadirio (kiwango cha nchi/jiji), jukwaa la kifaa, toleo la programu na kumbukumbu za hitilafu. Hizi huhifadhiwa kwa usalama na kurekebisha matatizo.","Arifa: kwa arifa za papo hapo tunahifadhi tokeni ya kifaa chako na lugha uliyochagua. Unaweza kuzima arifa wakati wowote kwenye mipangilio ya kifaa.","Jinsi Tunavyotumia Data Yako","Tunatumia data yako tu kutoa huduma, kulinda akaunti yako, kutuma arifa, kurekebisha hitilafu na kuzuia matumizi mabaya. Hatuuzi data yako wala kuishiriki na yeyote kwa madhumuni ya matangazo.","Vidakuzi na Hifadhi ya Ndani","Tunatumia hifadhi ya ndani tu kukuweka umeingia na kukumbuka mapendeleo kama lugha na mandhari. Hakuna vidakuzi vya matangazo wala vya ufuatiliaji.","Huduma za Wahusika Wengine","Data ya vipindi na filamu hutoka TMDB, taarifa za majukwaa ya kutiririsha kutoka JustWatch. Arifa za papo hapo huwasilishwa kupitia Google Firebase, na trafiki ya tovuti hulindwa na Cloudflare. Huduma hizi zinafuata sera zao za faragha.","Uhifadhi na Ufutaji","Data yako huhifadhiwa muda wote akaunti yako ipo. Kupitia \"Futa Akaunti Yangu\" kwenye mipangilio unaweza kufuta akaunti kabisa; data yako hufutwa mara moja, na nakala kwenye hifadhi rudufu ndani ya siku 14 zaidi. Kumbukumbu za hitilafu hufutwa kiotomatiki baada ya siku 30.","Unaweza kuhamisha data yako kama ZIP kutoka kwenye mipangilio; jalada hutumwa kwa anwani yako ya barua pepe.","Usalama","Data husafirishwa kupitia miunganisho iliyosimbwa (HTTPS) na kuhifadhiwa kwenye seva zenye ufikiaji mdogo.","Faragha ya Watoto","dizi.jpg haikusudiwi watoto walio chini ya miaka 13.","Haki Zako","Chini ya KVKK na GDPR una haki ya kufikia, kusahihisha, kufuta na kuhamisha data yako. Kwa haya tuandikie: {}","Mabadiliko","Sera hii ikibadilika, toleo jipya litachapishwa kwenye ukurasa huu na tarehe itasasishwa.","Kwa kujisajili unakubali {}.","Simu za Sauti na Video","Maudhui ya simu hayarekodiwi kamwe. Sauti na video husafiri kati ya vifaa zikiwa zimesimbwa kwa njia ya mwisho-hadi-mwisho (DTLS-SRTP); seva zetu haziwezi kuzifungua, kuzisikiliza wala kuzihifadhi.","Metadata pekee ya simu huhifadhiwa: na nani, mwelekeo gani, lini na kwa muda gani. Kumbukumbu hizi hufutwa kiotomatiki baada ya siku 90.","Ikiwa muunganisho wa moja kwa moja hauwezekani, sauti na video hupita kwenye seva ya kupitisha (TURN) zikiwa zimesimbwa. Seva hiyo pia haiwezi kufungua wala kurekodi maudhui.","Kipaza sauti hutumika tu wakati wa simu ya sauti au video, na kamera tu wakati wa simu ya video. Vyote viwili huzimwa simu inapoisha."],"mr":["गोपनीयता धोरण","शेवटचे अपडेट: {}","dizi.jpg अ‍ॅप आणि dizijpg.com साइट वापरताना कोणता डेटा गोळा होतो, तो कसा वापरला जातो आणि तुझे हक्क काय आहेत, हे हे धोरण सांगते.","आम्ही गोळा करतो तो डेटा","खाते: ईमेल पत्ता, यूजरनेम आणि पासवर्ड. पासवर्ड परत वाचता न येणाऱ्या हॅश स्वरूपात ठेवले जातात; गेस्ट खाती ईमेलशिवायही वापरता येतात.","प्रोफाइल: अवतार, कव्हर इमेज, बायो आणि देश यांसारखी तू स्वतः जोडलेली माहिती.","वापर: तुझा पाहण्याचा इतिहास, रेटिंग, टिप्पण्या, याद्या, रिअ‍ॅक्शन आणि आवडते.","संदेश: तुझे मजकूर, इमेज आणि व्हॉइस संदेश आमच्या सर्व्हरवर साठवले जातात. संदेश एंड-टू-एंड एनक्रिप्टेड नाहीत; तक्रार आल्यासच मॉडरेशनसाठी पाहिले जातात.","अपलोड केलेला मीडिया: प्रोफाइल, टिप्पण्या आणि संदेशांत जोडलेले फोटो, GIF, व्हिडिओ आणि व्हॉइस रेकॉर्डिंग.","तांत्रिक: IP पत्ता, अंदाजे स्थान (देश/शहर पातळी), डिव्हाइस प्लॅटफॉर्म, अ‍ॅप आवृत्ती आणि एरर लॉग. हे सुरक्षा आणि दोष दुरुस्तीसाठी ठेवले जातात.","सूचना: पुश सूचनांसाठी तुझ्या डिव्हाइसचा टोकन आणि भाषेची निवड साठवली जाते. डिव्हाइसच्या सेटिंग्जमधून सूचना कधीही बंद करू शकतोस.","आम्ही डेटा कसा वापरतो","तुझा डेटा फक्त सेवा देणे, खाते सुरक्षित ठेवणे, सूचना पाठवणे, दोष दुरुस्त करणे आणि गैरवापर रोखणे यासाठीच वापरतो. आम्ही तुझा डेटा विकत नाही आणि जाहिरातीसाठी कोणाशीही शेअर करत नाही.","कुकीज आणि लोकल स्टोरेज","लोकल स्टोरेज फक्त तुला लॉग-इन ठेवण्यासाठी आणि भाषा/थीमसारख्या आवडी लक्षात ठेवण्यासाठी वापरले जाते. जाहिरात किंवा ट्रॅकिंग कुकीज नाहीत.","तृतीय-पक्ष सेवा","मालिका आणि चित्रपटांचा डेटा TMDB कडून, स्ट्रीमिंग प्लॅटफॉर्मची माहिती JustWatch कडून येते. पुश सूचना Google Firebase मार्फत पोहोचतात आणि साइटची वाहतूक Cloudflare सुरक्षित ठेवते. या सेवांना त्यांची स्वतःची गोपनीयता धोरणे लागू होतात.","साठवण आणि हटवणे","तुझे खाते असेपर्यंत तुझा डेटा राहतो. सेटिंग्जमधील \"माझे खाते हटवा\" ने खाते कायमचे हटवू शकतोस; डेटा लगेच आणि बॅकअपमधील प्रती जास्तीत जास्त १४ दिवसांत हटतात. एरर लॉग ३० दिवसांनी आपोआप हटतात.","सेटिंग्जमधून तुझा डेटा ZIP स्वरूपात निर्यात करू शकतोस; संग्रह तुझ्या ईमेल पत्त्यावर पाठवला जातो.","सुरक्षा","डेटा एनक्रिप्टेड कनेक्शनने (HTTPS) जातो आणि मर्यादित प्रवेश असलेल्या सर्व्हरवर साठवला जातो.","मुलांची गोपनीयता","dizi.jpg हे १३ वर्षांखालील मुलांसाठी नाही.","तुझे हक्क","KVKK आणि GDPR अंतर्गत तुला तुझ्या डेटामध्ये प्रवेश, दुरुस्ती, हटवणे आणि हस्तांतरणाचा हक्क आहे. यासाठी आम्हाला लिही: {}","बदल","हे धोरण बदलल्यास नवी आवृत्ती याच पानावर प्रसिद्ध होईल आणि तारीख अपडेट होईल.","नोंदणी करून तू {} स्वीकारतोस.","व्हॉइस आणि व्हिडिओ कॉल","कॉलमधील मजकूर कधीही रेकॉर्ड केला जात नाही. ऑडिओ आणि व्हिडिओ उपकरणांदरम्यान एंड-टू-एंड एन्क्रिप्टेड (DTLS-SRTP) प्रवाहित होतात; आमचे सर्व्हर हा डेटा डिक्रिप्ट, ऐकू किंवा साठवू शकत नाहीत.","फक्त कॉल मेटाडेटा ठेवला जातो: कोणासोबत, कोणत्या दिशेने, कधी आणि किती वेळ. या नोंदी 90 दिवसांनंतर आपोआप हटवल्या जातात.","थेट कनेक्शन शक्य नसल्यास ऑडिओ आणि व्हिडिओ एन्क्रिप्टेड स्वरूपात रिले सर्व्हरमधून (TURN) जातात. रिले सर्व्हरही मजकूर डिक्रिप्ट किंवा रेकॉर्ड करू शकत नाही.","मायक्रोफोन फक्त व्हॉइस किंवा व्हिडिओ कॉलदरम्यान आणि कॅमेरा फक्त व्हिडिओ कॉलदरम्यान वापरला जातो. कॉल संपल्यावर दोन्ही बंद होतात."],"te":["గోప్యతా విధానం","చివరి అప్‌డేట్: {}","dizi.jpg యాప్ మరియు dizijpg.com సైట్ వాడేటప్పుడు ఏ డేటా సేకరిస్తారో, ఎలా వాడతారో, నీ హక్కులు ఏమిటో ఈ విధానం వివరిస్తుంది.","మేము సేకరించే డేటా","ఖాతా: ఇమెయిల్ చిరునామా, యూజర్‌నేమ్, పాస్‌వర్డ్. పాస్‌వర్డ్‌లు తిరిగి చదవలేని హ్యాష్ రూపంలో నిల్వ అవుతాయి; గెస్ట్ ఖాతాలను ఇమెయిల్ లేకుండా వాడుకోవచ్చు.","ప్రొఫైల్: అవతార్, కవర్ ఫోటో, బయో, దేశం వంటి నువ్వు జోడించాలనుకున్న వివరాలు.","వాడకం: నీ వీక్షణ చరిత్ర, రేటింగ్‌లు, వ్యాఖ్యలు, జాబితాలు, రియాక్షన్‌లు, ఇష్టమైనవి.","సందేశాలు: నీ టెక్స్ట్, ఫోటో, వాయిస్ సందేశాలు మా సర్వర్లలో నిల్వ అవుతాయి. సందేశాలకు ఎండ్-టు-ఎండ్ ఎన్‌క్రిప్షన్ లేదు; రిపోర్ట్ అయితేనే మోడరేషన్ కోసం చూస్తారు.","అప్‌లోడ్ చేసిన మీడియా: ప్రొఫైల్, వ్యాఖ్యలు, సందేశాల్లో నువ్వు జోడించే ఫోటోలు, GIF, వీడియోలు, వాయిస్ రికార్డింగ్‌లు.","సాంకేతికం: IP చిరునామా, సుమారు ప్రాంతం (దేశం/నగరం స్థాయి), పరికర ప్లాట్‌ఫారమ్, యాప్ వెర్షన్, ఎర్రర్ లాగ్‌లు. ఇవి భద్రత, లోపాల సరిదిద్దటం కోసం ఉంచుతాం.","నోటిఫికేషన్లు: పుష్ నోటిఫికేషన్ల కోసం నీ పరికర టోకెన్, భాషా ఎంపిక నిల్వ అవుతాయి. పరికర సెట్టింగ్స్ నుంచి ఎప్పుడైనా నోటిఫికేషన్లు ఆపేయవచ్చు.","డేటాను ఎలా వాడతాం","నీ డేటాను సేవ అందించడానికి, ఖాతా రక్షణకు, నోటిఫికేషన్లు పంపడానికి, లోపాలు సరిచేయడానికి, దుర్వినియోగం ఆపడానికి మాత్రమే వాడతాం. నీ డేటాను అమ్మము; ప్రకటనల కోసం ఎవరితోనూ పంచుకోము.","కుకీలు మరియు లోకల్ స్టోరేజ్","నిన్ను లాగిన్‌లో ఉంచడానికి, భాష/థీమ్ వంటి ఎంపికలను గుర్తుంచుకోవడానికి మాత్రమే లోకల్ స్టోరేజ్ వాడతాం. ప్రకటన లేదా ట్రాకింగ్ కుకీలు లేవు.","మూడో పక్ష సేవలు","సిరీస్, సినిమాల డేటా TMDB నుంచి, స్ట్రీమింగ్ ప్లాట్‌ఫారమ్ సమాచారం JustWatch నుంచి వస్తాయి. పుష్ నోటిఫికేషన్లు Google Firebase ద్వారా చేరతాయి; సైట్ ట్రాఫిక్‌ను Cloudflare కాపాడుతుంది. ఈ సేవలకు వాటి సొంత గోప్యతా విధానాలు వర్తిస్తాయి.","నిల్వ మరియు తొలగింపు","నీ ఖాతా ఉన్నంతవరకు నీ డేటా ఉంటుంది. సెట్టింగ్స్‌లోని \"నా ఖాతాను తొలగించు\" ద్వారా ఖాతాను శాశ్వతంగా తొలగించవచ్చు; డేటా వెంటనే, బ్యాకప్‌లలోని కాపీలు గరిష్ఠంగా 14 రోజుల్లో తొలగుతాయి. ఎర్రర్ లాగ్‌లు 30 రోజుల తర్వాత ఆటోమేటిక్‌గా తొలగుతాయి.","సెట్టింగ్స్ నుంచి నీ డేటాను ZIP రూపంలో ఎగుమతి చేసుకోవచ్చు; ఆర్కైవ్ నీ ఇమెయిల్ చిరునామాకు పంపబడుతుంది.","భద్రత","డేటా ఎన్‌క్రిప్టెడ్ కనెక్షన్ల (HTTPS) ద్వారా వెళ్తుంది; పరిమిత యాక్సెస్ ఉన్న సర్వర్లలో నిల్వ అవుతుంది.","పిల్లల గోప్యత","dizi.jpg 13 ఏళ్లలోపు పిల్లల కోసం కాదు.","నీ హక్కులు","KVKK మరియు GDPR ప్రకారం నీ డేటాను చూడటానికి, సరిచేయడానికి, తొలగించడానికి, బదిలీ చేయడానికి నీకు హక్కు ఉంది. వీటి కోసం మాకు రాయి: {}","మార్పులు","ఈ విధానం మారితే కొత్త వెర్షన్ ఇదే పేజీలో ప్రచురించబడి తేదీ అప్‌డేట్ అవుతుంది.","నమోదు చేసుకోవడం ద్వారా నువ్వు {} అంగీకరిస్తున్నావు.","వాయిస్ మరియు వీడియో కాల్‌లు","కాల్ కంటెంట్ ఎప్పుడూ రికార్డ్ చేయబడదు. ఆడియో మరియు వీడియో పరికరాల మధ్య ఎండ్-టు-ఎండ్ ఎన్‌క్రిప్టెడ్ (DTLS-SRTP) గా ప్రవహిస్తాయి; మా సర్వర్లు ఈ ట్రాఫిక్‌ను డీక్రిప్ట్ చేయలేవు, వినలేవు లేదా నిల్వ చేయలేవు.","కాల్ మెటాడేటా మాత్రమే ఉంచబడుతుంది: ఎవరితో, ఏ దిశలో, ఎప్పుడు మరియు ఎంతసేపు. ఈ రికార్డులు 90 రోజుల తర్వాత ఆటోమేటిక్‌గా తొలగించబడతాయి.","ప్రత్యక్ష కనెక్షన్ సాధ్యం కాకపోతే, ఆడియో మరియు వీడియో ఎన్‌క్రిప్ట్ చేయబడిన స్థితిలో రిలే సర్వర్ (TURN) ద్వారా వెళ్తాయి. రిలే సర్వర్ కూడా కంటెంట్‌ను డీక్రిప్ట్ లేదా రికార్డ్ చేయలేదు.","మైక్రోఫోన్ వాయిస్ లేదా వీడియో కాల్ సమయంలో మాత్రమే, కెమెరా వీడియో కాల్ సమయంలో మాత్రమే ఉపయోగించబడతాయి. కాల్ ముగిసిన వెంటనే రెండూ ఆఫ్ అవుతాయి."],"vi":["Chính sách Quyền riêng tư","Cập nhật lần cuối: {}","Chính sách này giải thích dữ liệu nào được thu thập, được sử dụng ra sao và bạn có những quyền gì khi dùng ứng dụng dizi.jpg và trang dizijpg.com.","Dữ liệu chúng tôi thu thập","Tài khoản: địa chỉ email, tên người dùng và mật khẩu. Mật khẩu được lưu dưới dạng băm không thể đảo ngược; tài khoản khách có thể dùng mà không cần email.","Hồ sơ: những thông tin bạn tự chọn thêm, như ảnh đại diện, ảnh bìa, tiểu sử và quốc gia.","Sử dụng: lịch sử xem, điểm đánh giá, bình luận, danh sách, cảm xúc và mục yêu thích của bạn.","Tin nhắn: tin nhắn văn bản, hình ảnh và thoại của bạn được lưu trên máy chủ của chúng tôi. Tin nhắn không được mã hóa đầu cuối; chỉ được xem xét cho mục đích kiểm duyệt khi bị báo cáo.","Nội dung tải lên: ảnh, GIF, video và bản ghi âm bạn thêm vào hồ sơ, bình luận và tin nhắn.","Kỹ thuật: địa chỉ IP, vị trí ước chừng (cấp quốc gia/thành phố), nền tảng thiết bị, phiên bản ứng dụng và nhật ký lỗi. Chúng được lưu để bảo mật và khắc phục sự cố.","Thông báo: để gửi thông báo đẩy, chúng tôi lưu token thiết bị và ngôn ngữ bạn chọn. Bạn có thể tắt thông báo bất cứ lúc nào trong cài đặt thiết bị.","Cách chúng tôi dùng dữ liệu","Chúng tôi chỉ dùng dữ liệu của bạn để cung cấp dịch vụ, bảo vệ tài khoản, gửi thông báo, sửa lỗi và ngăn lạm dụng. Chúng tôi không bán dữ liệu của bạn và không chia sẻ với ai vì mục đích quảng cáo.","Cookie và bộ nhớ cục bộ","Bộ nhớ cục bộ chỉ dùng để giữ bạn đăng nhập và ghi nhớ các tùy chọn như ngôn ngữ, giao diện. Không có cookie quảng cáo hay theo dõi.","Dịch vụ bên thứ ba","Dữ liệu phim và series lấy từ TMDB, thông tin nền tảng streaming từ JustWatch. Thông báo đẩy được gửi qua Google Firebase, lưu lượng trang được Cloudflare bảo vệ. Các dịch vụ này tuân theo chính sách quyền riêng tư của riêng họ.","Lưu trữ và xóa","Dữ liệu của bạn được giữ chừng nào tài khoản còn tồn tại. Với \"Xóa tài khoản của tôi\" trong Cài đặt, bạn có thể xóa tài khoản vĩnh viễn; dữ liệu bị xóa ngay lập tức, các bản sao trong bản sao lưu chậm nhất trong 14 ngày. Nhật ký lỗi tự động xóa sau 30 ngày.","Bạn có thể xuất dữ liệu dưới dạng ZIP từ Cài đặt; tệp lưu trữ sẽ được gửi tới địa chỉ email của bạn.","Bảo mật","Dữ liệu được truyền qua kết nối mã hóa (HTTPS) và lưu trên các máy chủ có quyền truy cập hạn chế.","Quyền riêng tư của trẻ em","dizi.jpg không dành cho trẻ em dưới 13 tuổi.","Quyền của bạn","Theo KVKK và GDPR, bạn có quyền truy cập, sửa, xóa và chuyển dữ liệu của mình. Hãy viết cho chúng tôi về những việc này: {}","Thay đổi","Nếu chính sách này thay đổi, phiên bản mới sẽ được đăng trên trang này và ngày cập nhật sẽ được làm mới.","Khi đăng ký, bạn chấp nhận {}.","Cuộc gọi thoại và video","Nội dung cuộc gọi không bao giờ được ghi lại. Âm thanh và hình ảnh được mã hóa đầu cuối (DTLS-SRTP) giữa các thiết bị; máy chủ của chúng tôi không thể giải mã, nghe lén hay lưu trữ luồng dữ liệu này.","Chỉ siêu dữ liệu cuộc gọi được lưu: với ai, theo chiều nào, khi nào và kéo dài bao lâu. Các bản ghi này tự động bị xóa sau 90 ngày.","Nếu không thể kết nối trực tiếp, âm thanh và hình ảnh sẽ đi qua máy chủ chuyển tiếp (TURN) ở dạng đã mã hóa. Máy chủ chuyển tiếp cũng không thể giải mã hay ghi lại nội dung.","Micrô chỉ được dùng trong cuộc gọi thoại hoặc video, còn camera chỉ dùng trong cuộc gọi video. Cả hai đều tắt khi cuộc gọi kết thúc."],"ko":["개인정보 처리방침","마지막 업데이트: {}","이 방침은 dizi.jpg 앱과 dizijpg.com 사이트를 사용할 때 어떤 데이터가 수집되고 어떻게 사용되는지, 그리고 어떤 권리가 있는지 알려줘요.","수집하는 데이터","계정: 이메일 주소, 사용자 이름, 비밀번호. 비밀번호는 되돌릴 수 없는 해시 형태로 저장돼요. 게스트 계정은 이메일 없이도 쓸 수 있어요.","프로필: 아바타, 커버 이미지, 소개, 국가처럼 직접 추가하기로 선택한 정보.","이용 기록: 시청 기록, 평점, 댓글, 리스트, 리액션, 즐겨찾기.","메시지: 텍스트·이미지·음성 메시지는 저희 서버에 저장돼요. 메시지는 종단간 암호화되지 않으며, 신고된 경우에만 중재 목적으로 확인해요.","업로드한 미디어: 프로필, 댓글, 메시지에 추가한 사진, GIF, 동영상, 음성 녹음.","기술 데이터: IP 주소, 대략적인 위치(국가/도시 수준), 기기 플랫폼, 앱 버전, 오류 로그. 보안과 오류 해결을 위해 보관해요.","알림: 푸시 알림을 위해 기기 토큰과 언어 설정을 저장해요. 알림은 기기 설정에서 언제든 끌 수 있어요.","데이터를 사용하는 방법","데이터는 서비스 제공, 계정 보호, 알림 전송, 오류 수정, 악용 방지를 위해서만 사용해요. 데이터를 판매하지 않고, 광고 목적으로 누구와도 공유하지 않아요.","쿠키와 로컬 저장소","로컬 저장소는 로그인 상태 유지와 언어·테마 같은 설정 기억에만 사용해요. 광고용이나 추적용 쿠키는 없어요.","제3자 서비스","드라마와 영화 데이터는 TMDB에서, 스트리밍 플랫폼 정보는 JustWatch에서 가져와요. 푸시 알림은 Google Firebase를 통해 전달되고, 사이트 트래픽은 Cloudflare가 보호해요. 이 서비스들에는 각자의 개인정보 처리방침이 적용돼요.","보관과 삭제","데이터는 계정이 있는 동안 보관돼요. 설정의 \"내 계정 삭제\"로 계정을 영구 삭제할 수 있어요. 데이터는 즉시, 백업 속 사본은 늦어도 14일 안에 삭제돼요. 오류 로그는 30일 후 자동으로 삭제돼요.","설정에서 데이터를 ZIP으로 내보낼 수 있어요. 아카이브는 이메일 주소로 전송돼요.","보안","데이터는 암호화된 연결(HTTPS)로 전송되고, 접근이 제한된 서버에 저장돼요.","아동의 개인정보","dizi.jpg는 13세 미만 어린이를 위한 서비스가 아니에요.","이용자의 권리","KVKK와 GDPR에 따라 자신의 데이터에 접근하고, 수정하고, 삭제하고, 이전할 권리가 있어요. 필요하면 여기로 연락해줘: {}","변경 사항","이 방침이 바뀌면 새 버전을 이 페이지에 게시하고 날짜를 갱신해요.","가입하면 {}에 동의하는 거예요.","음성 및 영상 통화","통화 내용은 절대 녹음되지 않아요. 오디오와 영상은 기기 사이에서 종단 간 암호화(DTLS-SRTP)되어 전달되며, 저희 서버는 이 트래픽을 복호화하거나 듣거나 저장할 수 없어요.","통화 메타데이터만 보관돼요: 누구와, 어느 방향으로, 언제, 얼마나 오래 통화했는지. 이 기록은 90일 후 자동으로 삭제돼요.","직접 연결이 불가능하면 오디오와 영상은 암호화된 상태로 중계 서버(TURN)를 거쳐요. 중계 서버 역시 내용을 복호화하거나 기록할 수 없어요.","마이크는 음성 또는 영상 통화 중에만, 카메라는 영상 통화 중에만 사용돼요. 통화가 끝나면 둘 다 꺼져요."],"ta":["தனியுரிமைக் கொள்கை","கடைசி புதுப்பிப்பு: {}","dizi.jpg செயலியையும் dizijpg.com தளத்தையும் பயன்படுத்தும்போது என்ன தரவு சேகரிக்கப்படுகிறது, எப்படிப் பயன்படுத்தப்படுகிறது, உன் உரிமைகள் என்ன என்பதை இந்தக் கொள்கை விளக்குகிறது.","நாங்கள் சேகரிக்கும் தரவு","கணக்கு: மின்னஞ்சல் முகவரி, பயனர்பெயர், கடவுச்சொல். கடவுச்சொற்கள் மீட்க முடியாத ஹாஷாகச் சேமிக்கப்படுகின்றன; விருந்தினர் கணக்குகளை மின்னஞ்சல் இல்லாமல் பயன்படுத்தலாம்.","சுயவிவரம்: அவதாரம், அட்டைப் படம், பயோ, நாடு போன்ற நீ சேர்க்கத் தேர்வு செய்யும் தகவல்கள்.","பயன்பாடு: உன் பார்வை வரலாறு, மதிப்பீடுகள், கருத்துகள், பட்டியல்கள், ரியாக்ஷன்கள், பிடித்தவை.","செய்திகள்: உன் உரை, படம், குரல் செய்திகள் எங்கள் சர்வர்களில் சேமிக்கப்படுகின்றன. செய்திகள் முனைக்கு-முனை என்க்ரிப்ட் செய்யப்படவில்லை; புகார் வந்தால் மட்டுமே மதிப்பாய்வுக்காகப் பார்க்கப்படும்.","பதிவேற்றிய மீடியா: சுயவிவரம், கருத்துகள், செய்திகளில் நீ சேர்க்கும் புகைப்படங்கள், GIF, வீடியோக்கள், குரல் பதிவுகள்.","தொழில்நுட்பம்: IP முகவரி, தோராயமான இடம் (நாடு/நகரம் அளவில்), சாதன இயங்குதளம், செயலி பதிப்பு, பிழைப் பதிவுகள். இவை பாதுகாப்புக்கும் பிழை சரிசெய்யவும் வைக்கப்படுகின்றன.","அறிவிப்புகள்: புஷ் அறிவிப்புகளுக்காக உன் சாதன டோக்கனும் மொழித் தேர்வும் சேமிக்கப்படுகின்றன. சாதன அமைப்புகளில் எப்போது வேண்டுமானாலும் அறிவிப்புகளை அணைக்கலாம்.","தரவை எப்படிப் பயன்படுத்துகிறோம்","உன் தரவை சேவை வழங்க, கணக்கைப் பாதுகாக்க, அறிவிப்பு அனுப்ப, பிழைகளைச் சரிசெய்ய, தவறான பயன்பாட்டைத் தடுக்க மட்டுமே பயன்படுத்துகிறோம். உன் தரவை விற்பதில்லை; விளம்பரத்துக்காக யாருடனும் பகிர்வதில்லை.","குக்கீகளும் லோக்கல் ஸ்டோரேஜும்","உன்னை உள்நுழைந்த நிலையில் வைக்கவும் மொழி/தீம் போன்ற விருப்பங்களை நினைவில் வைக்கவும் மட்டுமே லோக்கல் ஸ்டோரேஜ் பயன்படுகிறது. விளம்பர அல்லது கண்காணிப்பு குக்கீகள் இல்லை.","மூன்றாம் தரப்பு சேவைகள்","தொடர்கள், படங்களின் தரவு TMDB-யிலிருந்தும், ஸ்ட்ரீமிங் தள விவரம் JustWatch-இலிருந்தும் வருகிறது. புஷ் அறிவிப்புகள் Google Firebase வழியாக அனுப்பப்படுகின்றன; தள ட்ராஃபிக்கை Cloudflare பாதுகாக்கிறது. இந்தச் சேவைகளுக்கு அவற்றின் சொந்த தனியுரிமைக் கொள்கைகள் பொருந்தும்.","சேமிப்பும் நீக்கமும்","உன் கணக்கு இருக்கும் வரை உன் தரவு இருக்கும். அமைப்புகளில் உள்ள \"என் கணக்கை நீக்கு\" மூலம் கணக்கை நிரந்தரமாக நீக்கலாம்; தரவு உடனே அழிக்கப்படும், பேக்அப்பில் உள்ள நகல்கள் அதிகபட்சம் 14 நாட்களில் அழியும். பிழைப் பதிவுகள் 30 நாட்களுக்குப் பிறகு தானாக அழிக்கப்படும்.","அமைப்புகளிலிருந்து உன் தரவை ZIP ஆக ஏற்றுமதி செய்யலாம்; காப்பகம் உன் மின்னஞ்சல் முகவரிக்கு அனுப்பப்படும்.","பாதுகாப்பு","தரவு என்க்ரிப்ட் செய்யப்பட்ட இணைப்புகள் (HTTPS) வழியாகச் செல்கிறது; வரம்புள்ள அணுகல் கொண்ட சர்வர்களில் சேமிக்கப்படுகிறது.","குழந்தைகளின் தனியுரிமை","dizi.jpg 13 வயதுக்குக் குறைவான குழந்தைகளுக்கானது அல்ல.","உன் உரிமைகள்","KVKK மற்றும் GDPR படி உன் தரவை அணுக, திருத்த, நீக்க, மாற்ற உனக்கு உரிமை உண்டு. இதற்காக எங்களுக்கு எழுது: {}","மாற்றங்கள்","இந்தக் கொள்கை மாறினால் புதிய பதிப்பு இதே பக்கத்தில் வெளியிடப்பட்டு தேதி புதுப்பிக்கப்படும்.","பதிவு செய்வதன் மூலம் {} ஏற்றுக்கொள்கிறாய்.","குரல் மற்றும் வீடியோ அழைப்புகள்","அழைப்பின் உள்ளடக்கம் ஒருபோதும் பதிவு செய்யப்படுவதில்லை. ஒலியும் காணொலியும் சாதனங்களுக்கு இடையே முனை-முதல்-முனை மறையாக்கத்துடன் (DTLS-SRTP) பாய்கின்றன; எங்கள் சேவையகங்களால் இதை மறைநீக்கவோ, கேட்கவோ, சேமிக்கவோ முடியாது.","அழைப்பின் மேல்தரவு மட்டுமே வைக்கப்படுகிறது: யாருடன், எந்தத் திசையில், எப்போது, எவ்வளவு நேரம். இந்தப் பதிவுகள் 90 நாட்களுக்குப் பிறகு தானாக நீக்கப்படும்.","நேரடி இணைப்பு சாத்தியமில்லை எனில், ஒலியும் காணொலியும் மறையாக்கப்பட்ட நிலையில் ஒரு பரிமாற்றச் சேவையகம் (TURN) வழியாகச் செல்கின்றன. அந்தச் சேவையகத்தாலும் உள்ளடக்கத்தை மறைநீக்கவோ பதிவு செய்யவோ முடியாது.","மைக்ரோஃபோன் குரல் அல்லது வீடியோ அழைப்பின்போது மட்டும், கேமரா வீடியோ அழைப்பின்போது மட்டும் பயன்படுத்தப்படும். அழைப்பு முடிந்ததும் இரண்டும் அணைக்கப்படும்."],"it":["Informativa sulla Privacy","Ultimo aggiornamento: {}","Questa informativa spiega quali dati vengono raccolti, come vengono usati e quali sono i tuoi diritti quando usi l'app dizi.jpg e il sito dizijpg.com.","Dati che raccogliamo","Account: indirizzo e-mail, nome utente e password. Le password sono salvate con hash irreversibile; gli account ospite possono essere usati senza e-mail.","Profilo: le informazioni che scegli di aggiungere, come avatar, immagine di copertina, bio e paese.","Utilizzo: la tua cronologia di visione, i voti, i commenti, le liste, le reazioni e i preferiti.","Messaggi: i tuoi messaggi di testo, immagine e vocali sono salvati sui nostri server. I messaggi non sono crittografati end-to-end; vengono esaminati solo in caso di segnalazione, a fini di moderazione.","Contenuti caricati: foto, GIF, video e registrazioni vocali che aggiungi al profilo, ai commenti e ai messaggi.","Dati tecnici: indirizzo IP, posizione approssimativa (paese/città), piattaforma del dispositivo, versione dell'app e log degli errori. Sono conservati per sicurezza e per la risoluzione dei problemi.","Notifiche: per le notifiche push conserviamo il token del tuo dispositivo e la tua lingua. Puoi disattivarle in qualsiasi momento dalle impostazioni del dispositivo.","Come usiamo i tuoi dati","Usiamo i tuoi dati solo per fornire il servizio, proteggere il tuo account, inviare notifiche, correggere errori e prevenire abusi. Non vendiamo i tuoi dati e non li condividiamo con nessuno a fini pubblicitari.","Cookie e archiviazione locale","Usiamo l'archiviazione locale solo per mantenerti connesso e ricordare preferenze come lingua e tema. Non ci sono cookie pubblicitari o di tracciamento.","Servizi di terze parti","I dati di serie e film provengono da TMDB, le informazioni sulle piattaforme di streaming da JustWatch. Le notifiche push sono recapitate tramite Google Firebase e il traffico del sito è protetto da Cloudflare. Questi servizi sono soggetti alle rispettive informative sulla privacy.","Conservazione ed eliminazione","I tuoi dati sono conservati finché il tuo account esiste. Con \"Elimina il mio account\" nelle Impostazioni puoi eliminare l'account in modo permanente; i tuoi dati vengono cancellati subito e le copie nei backup entro 14 giorni al massimo. I log degli errori vengono eliminati automaticamente dopo 30 giorni.","Puoi esportare i tuoi dati in formato ZIP dalle Impostazioni; l'archivio viene inviato al tuo indirizzo e-mail.","Sicurezza","I dati viaggiano su connessioni crittografate (HTTPS) e sono conservati su server ad accesso limitato.","Privacy dei minori","dizi.jpg non è rivolto ai minori di 13 anni.","I tuoi diritti","In base a KVKK e GDPR hai il diritto di accedere ai tuoi dati, correggerli, eliminarli e trasferirli. Per esercitarli scrivici: {}","Modifiche","Se questa informativa cambia, la nuova versione sarà pubblicata su questa pagina e la data sarà aggiornata.","Registrandoti accetti l'{}.","Chiamate vocali e video","Il contenuto delle chiamate non viene mai registrato. Audio e video viaggiano cifrati end-to-end (DTLS-SRTP) tra i dispositivi; i nostri server non possono decifrare, ascoltare o conservare questo traffico.","Vengono conservati solo i metadati della chiamata: con chi, in quale direzione, quando e quanto è durata. Questi dati vengono eliminati automaticamente dopo 90 giorni.","Se non è possibile stabilire una connessione diretta, audio e video passano cifrati attraverso un server di inoltro (TURN). Nemmeno quel server può decifrare o registrare il contenuto.","Il microfono viene usato solo durante una chiamata vocale o video, la fotocamera solo durante una videochiamata. Entrambi vengono spenti al termine della chiamata."],"fa":["سیاست حفظ حریم خصوصی","آخرین به‌روزرسانی: {}","این سیاست توضیح می‌دهد هنگام استفاده از اپلیکیشن dizi.jpg و سایت dizijpg.com چه داده‌هایی جمع‌آوری می‌شود، چگونه استفاده می‌شود و چه حقوقی داری.","داده‌هایی که جمع‌آوری می‌کنیم","حساب: نشانی ایمیل، نام کاربری و رمز عبور. رمزهای عبور به‌صورت هش برگشت‌ناپذیر ذخیره می‌شوند؛ حساب‌های مهمان را می‌توان بدون ایمیل استفاده کرد.","پروفایل: اطلاعاتی که خودت انتخاب می‌کنی اضافه کنی، مانند آواتار، تصویر کاور، بیو و کشور.","استفاده: تاریخچه تماشا، امتیازها، نظرها، فهرست‌ها، واکنش‌ها و علاقه‌مندی‌هایت.","پیام‌ها: پیام‌های متنی، تصویری و صوتی تو روی سرورهای ما ذخیره می‌شوند. پیام‌ها رمزگذاری سرتاسری ندارند؛ فقط در صورت گزارش‌شدن و برای نظارت بررسی می‌شوند.","رسانه‌های بارگذاری‌شده: عکس‌ها، GIFها، ویدیوها و ضبط‌های صوتی که به پروفایل، نظرها و پیام‌هایت اضافه می‌کنی.","داده‌های فنی: نشانی IP، موقعیت تقریبی (کشور/شهر)، پلتفرم دستگاه، نسخه اپلیکیشن و گزارش‌های خطا. این‌ها برای امنیت و رفع اشکال نگهداری می‌شوند.","اعلان‌ها: برای اعلان‌های پوش، توکن دستگاه و زبان انتخابی‌ات را نگه می‌داریم. هر وقت بخواهی می‌توانی اعلان‌ها را از تنظیمات دستگاه خاموش کنی.","چطور از داده‌هایت استفاده می‌کنیم","از داده‌هایت فقط برای ارائه سرویس، محافظت از حساب، ارسال اعلان، رفع خطاها و جلوگیری از سوءاستفاده استفاده می‌کنیم. داده‌هایت را نمی‌فروشیم و برای تبلیغات با هیچ‌کس به اشتراک نمی‌گذاریم.","کوکی‌ها و ذخیره‌سازی محلی","از ذخیره‌سازی محلی فقط برای باز نگه داشتن نشستت و به‌خاطر سپردن ترجیح‌هایی مانند زبان و پوسته استفاده می‌کنیم. هیچ کوکی تبلیغاتی یا ردیابی وجود ندارد.","سرویس‌های شخص ثالث","اطلاعات سریال‌ها و فیلم‌ها از TMDB و اطلاعات پلتفرم‌های پخش از JustWatch می‌آید. اعلان‌های پوش از طریق Google Firebase ارسال می‌شوند و ترافیک سایت را Cloudflare محافظت می‌کند. این سرویس‌ها تابع سیاست‌های حریم خصوصی خودشان هستند.","نگهداری و حذف","داده‌هایت تا زمانی که حسابت فعال است نگهداری می‌شوند. با «حذف حساب من» در تنظیمات می‌توانی حسابت را برای همیشه حذف کنی؛ داده‌هایت بلافاصله و نسخه‌های موجود در پشتیبان‌ها حداکثر تا ۱۴ روز پاک می‌شوند. گزارش‌های خطا پس از ۳۰ روز به‌طور خودکار حذف می‌شوند.","می‌توانی داده‌هایت را از تنظیمات به‌صورت ZIP خروجی بگیری؛ آرشیو به نشانی ایمیلت فرستاده می‌شود.","امنیت","داده‌ها از طریق اتصال‌های رمزگذاری‌شده (HTTPS) منتقل و روی سرورهایی با دسترسی محدود نگهداری می‌شوند.","حریم خصوصی کودکان","‏dizi.jpg برای کودکان زیر ۱۳ سال طراحی نشده است.","حقوق تو","طبق KVKK و GDPR حق دسترسی به داده‌هایت، اصلاح، حذف و انتقال آن‌ها را داری. برای این موارد برایمان بنویس: {}","تغییرات","اگر این سیاست تغییر کند، نسخه جدید در همین صفحه منتشر و تاریخ به‌روزرسانی می‌شود.","با ثبت‌نام، {} را می‌پذیری.","تماس‌های صوتی و تصویری","محتوای تماس‌ها هرگز ضبط نمی‌شود. صدا و تصویر با رمزگذاری سرتاسری (DTLS-SRTP) میان دستگاه‌ها جریان می‌یابد؛ سرورهای ما نمی‌توانند این ترافیک را رمزگشایی، شنود یا ذخیره کنند.","فقط فراداده تماس نگهداری می‌شود: با چه کسی، در چه جهتی، چه زمانی و چه مدت. این سوابق پس از ۹۰ روز به‌طور خودکار حذف می‌شوند.","اگر اتصال مستقیم ممکن نباشد، صدا و تصویر به‌صورت رمزگذاری‌شده از یک سرور بازپخش (TURN) عبور می‌کنند. آن سرور نیز نمی‌تواند محتوا را رمزگشایی یا ضبط کند.","میکروفون فقط هنگام تماس صوتی یا تصویری و دوربین فقط هنگام تماس تصویری استفاده می‌شود. با پایان تماس هر دو خاموش می‌شوند."],"pl":["Polityka Prywatności","Ostatnia aktualizacja: {}","Ta polityka wyjaśnia, jakie dane są zbierane, jak są wykorzystywane i jakie masz prawa, gdy korzystasz z aplikacji dizi.jpg i strony dizijpg.com.","Jakie dane zbieramy","Konto: adres e-mail, nazwa użytkownika i hasło. Hasła są przechowywane w postaci nieodwracalnego skrótu; z kont gościnnych można korzystać bez e-maila.","Profil: informacje, które sam(a) dodajesz, np. awatar, zdjęcie w tle, bio i kraj.","Korzystanie: twoja historia oglądania, oceny, komentarze, listy, reakcje i ulubione.","Wiadomości: twoje wiadomości tekstowe, graficzne i głosowe są przechowywane na naszych serwerach. Wiadomości nie są szyfrowane end-to-end; są przeglądane wyłącznie po zgłoszeniu, w celach moderacji.","Przesłane media: zdjęcia, GIF-y, filmy i nagrania głosowe, które dodajesz do profilu, komentarzy i wiadomości.","Dane techniczne: adres IP, przybliżona lokalizacja (kraj/miasto), platforma urządzenia, wersja aplikacji i dzienniki błędów. Przechowujemy je dla bezpieczeństwa i usuwania usterek.","Powiadomienia: dla powiadomień push przechowujemy token twojego urządzenia i wybrany język. Powiadomienia możesz w każdej chwili wyłączyć w ustawieniach urządzenia.","Jak wykorzystujemy twoje dane","Twoje dane wykorzystujemy wyłącznie do świadczenia usługi, ochrony konta, wysyłania powiadomień, naprawiania błędów i zapobiegania nadużyciom. Nie sprzedajemy twoich danych i nie udostępniamy ich nikomu w celach reklamowych.","Pliki cookie i pamięć lokalna","Pamięci lokalnej używamy tylko po to, aby utrzymać cię zalogowanym i zapamiętać preferencje, takie jak język i motyw. Nie ma żadnych reklamowych ani śledzących plików cookie.","Usługi zewnętrzne","Dane o serialach i filmach pochodzą z TMDB, informacje o platformach streamingowych z JustWatch. Powiadomienia push są dostarczane przez Google Firebase, a ruch na stronie chroni Cloudflare. Te usługi podlegają własnym politykom prywatności.","Przechowywanie i usuwanie","Twoje dane są przechowywane, dopóki istnieje twoje konto. Przez „Usuń moje konto\" w ustawieniach możesz trwale usunąć konto; dane są kasowane od razu, a ich kopie w backupach najpóźniej w ciągu 14 dni. Dzienniki błędów są automatycznie usuwane po 30 dniach.","Możesz wyeksportować swoje dane jako ZIP z ustawień; archiwum zostanie wysłane na twój adres e-mail.","Bezpieczeństwo","Dane są przesyłane szyfrowanymi połączeniami (HTTPS) i przechowywane na serwerach z ograniczonym dostępem.","Prywatność dzieci","dizi.jpg nie jest przeznaczony dla dzieci poniżej 13 lat.","Twoje prawa","Zgodnie z KVKK i GDPR masz prawo do dostępu do swoich danych, ich poprawiania, usunięcia i przeniesienia. W tych sprawach napisz do nas: {}","Zmiany","Jeśli ta polityka się zmieni, nowa wersja zostanie opublikowana na tej stronie, a data zaktualizowana.","Rejestrując się, akceptujesz {}.","Połączenia głosowe i wideo","Treść rozmów nigdy nie jest nagrywana. Dźwięk i obraz płyną między urządzeniami z szyfrowaniem end-to-end (DTLS-SRTP); nasze serwery nie mogą tego ruchu odszyfrować, podsłuchać ani przechować.","Przechowywane są wyłącznie metadane połączenia: z kim, w którą stronę, kiedy i jak długo trwało. Te zapisy są automatycznie usuwane po 90 dniach.","Jeśli bezpośrednie połączenie nie jest możliwe, dźwięk i obraz przechodzą w postaci zaszyfrowanej przez serwer przekaźnikowy (TURN). On również nie może odszyfrować ani nagrać treści.","Mikrofon jest używany tylko podczas rozmowy głosowej lub wideo, a kamera tylko podczas rozmowy wideo. Po zakończeniu rozmowy oba są wyłączane."],"uk":["Політика конфіденційності","Останнє оновлення: {}","Ця політика пояснює, які дані збираються, як вони використовуються і які в тебе права, коли ти користуєшся застосунком dizi.jpg та сайтом dizijpg.com.","Які дані ми збираємо","Акаунт: адреса електронної пошти, ім'я користувача та пароль. Паролі зберігаються у вигляді незворотного хешу; гостьовими акаунтами можна користуватися без пошти.","Профіль: відомості, які ти додаєш за бажанням, — аватар, обкладинка, біо та країна.","Використання: твоя історія переглядів, оцінки, коментарі, списки, реакції та улюблене.","Повідомлення: твої текстові, графічні та голосові повідомлення зберігаються на наших серверах. Повідомлення не мають наскрізного шифрування; їх переглядають лише в разі скарги, з метою модерації.","Завантажені файли: фото, GIF, відео та голосові записи, які ти додаєш у профіль, коментарі та повідомлення.","Технічні дані: IP-адреса, приблизне розташування (країна/місто), платформа пристрою, версія застосунку та журнали помилок. Вони зберігаються для безпеки та налагодження.","Сповіщення: для push-сповіщень ми зберігаємо токен твого пристрою та обрану мову. Сповіщення можна будь-коли вимкнути в налаштуваннях пристрою.","Як ми використовуємо твої дані","Ми використовуємо твої дані лише для роботи сервісу, захисту акаунта, надсилання сповіщень, виправлення помилок і запобігання зловживанням. Ми не продаємо твої дані й нікому не передаємо їх із рекламною метою.","Cookie та локальне сховище","Локальне сховище використовується лише для того, щоб тримати тебе в системі та запам'ятовувати налаштування, як-от мову й тему. Рекламних чи відстежувальних cookie немає.","Сторонні сервіси","Дані про серіали й фільми надходять із TMDB, відомості про стримінгові платформи — з JustWatch. Push-сповіщення доставляються через Google Firebase, трафік сайту захищає Cloudflare. На ці сервіси поширюються їхні власні політики конфіденційності.","Зберігання та видалення","Твої дані зберігаються, поки існує акаунт. Через «Видалити акаунт» у налаштуваннях можна видалити акаунт назавжди; дані стираються одразу, а їхні копії в резервних копіях — щонайпізніше за 14 днів. Журнали помилок автоматично видаляються за 30 днів.","Ти можеш вивантажити свої дані у вигляді ZIP із налаштувань; архів надійде на твою електронну пошту.","Безпека","Дані передаються зашифрованими з'єднаннями (HTTPS) і зберігаються на серверах з обмеженим доступом.","Конфіденційність дітей","dizi.jpg не призначений для дітей до 13 років.","Твої права","Згідно з KVKK та GDPR ти маєш право на доступ до своїх даних, їх виправлення, видалення та перенесення. Із цих питань напиши нам: {}","Зміни","Якщо політика зміниться, нову версію буде опубліковано на цій сторінці, а дату оновлено.","Реєструючись, ти приймаєш {}.","Голосові та відеовиклики","Вміст викликів ніколи не записується. Аудіо та відео передаються між пристроями з наскрізним шифруванням (DTLS-SRTP); наші сервери не можуть їх розшифрувати, прослухати чи зберегти.","Зберігаються лише метадані виклику: з ким, у якому напрямку, коли й скільки тривав. Ці записи автоматично видаляються через 90 днів.","Якщо пряме зʼєднання неможливе, аудіо та відео проходять у зашифрованому вигляді через сервер ретрансляції (TURN). Він також не може розшифрувати чи записати вміст.","Мікрофон використовується лише під час голосового або відеовиклику, а камера — лише під час відеовиклику. Після завершення виклику обидва вимикаються."],"ro":["Politica de Confidențialitate","Ultima actualizare: {}","Această politică explică ce date sunt colectate, cum sunt folosite și ce drepturi ai atunci când folosești aplicația dizi.jpg și site-ul dizijpg.com.","Datele pe care le colectăm","Cont: adresa de e-mail, numele de utilizator și parola. Parolele sunt stocate ca hash ireversibil; conturile de oaspete pot fi folosite fără e-mail.","Profil: informațiile pe care alegi să le adaugi, precum avatarul, imaginea de copertă, bio și țara.","Utilizare: istoricul tău de vizionare, notele, comentariile, listele, reacțiile și favoritele.","Mesaje: mesajele tale text, cu imagini și vocale sunt stocate pe serverele noastre. Mesajele nu sunt criptate end-to-end; sunt examinate doar dacă sunt raportate, în scop de moderare.","Conținut încărcat: fotografii, GIF-uri, videoclipuri și înregistrări vocale pe care le adaugi la profil, comentarii și mesaje.","Tehnice: adresa IP, locația aproximativă (la nivel de țară/oraș), platforma dispozitivului, versiunea aplicației și jurnalele de erori. Sunt păstrate pentru securitate și remedierea problemelor.","Notificări: pentru notificările push păstrăm tokenul dispozitivului tău și limba preferată. Poți dezactiva notificările oricând din setările dispozitivului.","Cum îți folosim datele","Îți folosim datele doar pentru a oferi serviciul, a-ți proteja contul, a trimite notificări, a remedia erori și a preveni abuzurile. Nu îți vindem datele și nu le partajăm cu nimeni în scopuri publicitare.","Cookie-uri și stocare locală","Folosim stocarea locală doar pentru a te menține conectat și a reține preferințe precum limba și tema. Nu există cookie-uri de publicitate sau de urmărire.","Servicii terțe","Datele despre seriale și filme provin de la TMDB, informațiile despre platformele de streaming de la JustWatch. Notificările push sunt livrate prin Google Firebase, iar traficul site-ului este protejat de Cloudflare. Aceste servicii au propriile politici de confidențialitate.","Păstrare și ștergere","Datele tale sunt păstrate cât timp există contul tău. Prin „Șterge-mi contul\" din setări îți poți șterge contul de
